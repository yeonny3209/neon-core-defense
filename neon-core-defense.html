  '<div><b>단축키</b><kbd>Space</kbd> 호출 · <kbd>P</kbd> 정지 · <kbd>U</kbd> 강화 · <kbd>X</kbd> 해체 · <kbd>[</kbd> <kbd>]</kbd> 배속 · <kbd>Esc</kbd> 선택 해제</div>'+
  '</div></details>';
 E.veil.classList.remove('hide');
 const minis=E.sheet.querySelectorAll('[data-mini]');
 for(let i=0;i<minis.length;i++){
  const m=findMap(minis[i].dataset.mini);
  if(m) miniMap(minis[i],m);
 }
 const mc=E.sheet.querySelectorAll('[data-map]');
 for(let i=0;i<mc.length;i++) mc[i].addEventListener('click',function(){
  const id=this.dataset.map;
  const m=findMap(id);
  if(!m) return;
  applyMap(m);
  for(let j=0;j<mc.length;j++) mc[j].classList.toggle('on',mc[j].dataset.map===id);
  refreshBest();
  SND.init(); SND.resume(); SND.play('build');
 });
 const moc=E.sheet.querySelectorAll('[data-mode]');
 for(let i=0;i<moc.length;i++) moc[i].addEventListener('click',function(){
  const m=this.dataset.mode;
  G.duelSel=(m==='2');
  G.chaosSel=(m!=='0');
  DB.setOpt('chaos',G.chaosSel);
  SND.init(); SND.resume(); SND.play('build');
  showMenu(resumable);
 });
 const dc=E.sheet.querySelectorAll('[data-diff]');
 for(let i=0;i<dc.length;i++) dc[i].addEventListener('click',function(){
  G.diff=this.dataset.diff; G.D=DIFFS[G.diff]; DB.setOpt('diff',G.diff);
  for(let j=0;j<dc.length;j++) dc[j].classList.toggle('on',dc[j].dataset.diff===G.diff);
  refreshBest();
  syncDiffBadge();
 });
 const go=E.sheet.querySelector('#m-go');
 if(go) go.addEventListener('click',function(){
  if(G.duelSel){
   const inp=E.sheet.querySelector('#d-code'), msg=E.sheet.querySelector('#d-msg');
   const raw=inp?inp.value.trim():'';
   if(raw){
    const c=parseDuelCode(raw);
    if(!c){ if(msg){ msg.innerHTML='<b style="color:#ff4d6d">코드를 알아볼 수 없습니다</b> · NCD-XXXX-00-X-XXXX 형태여야 합니다'; } return; }
    const m=findMap(c.map);
    if(m) applyMap(m);
    G.diff=c.diff; G.D=DIFFS[G.diff];
    G.duel.seed=c.seed; G.duel.p1=c.p1; G.duel.p2=null;
    startDuelTurn(2);
    feed('도전 코드 수락 · 플레이어 1 기록 <b>'+c.p1.wave+'웨이브 / '+fmt(c.p1.score)+'점</b>','warn');
    return;
   }
   G.duel.seed=(Math.random()*1e9)|0; G.duel.p1=null; G.duel.p2=null;
   startDuelTurn(1);
   return;
  }
  G.duel.on=false;
  startGame(false);
 });
 const rs=E.sheet.querySelector('#m-resume');
 if(rs) rs.addEventListener('click',function(){ E.veil.classList.add('hide'); togglePause(); });
 function refreshBest(){
  const b=DB.best(G.map.id,bestKey(G.chaosSel)), el=E.sheet.querySelector('#m-best');
  if(el) el.innerHTML=b?'이 지형 최고 점수 <b>'+fmt(b)+'</b>':'아직 기록이 없습니다';
 }
}

/* ═══════════ 시작 · 종료 ═══════════ */
function startGame(endless){
 G.D=DIFFS[G.diff];
 augReset();
 G.chaos=!!G.chaosSel;
 G.duel.on=!!G.duelSel;
 if(G.duel.on){ if(!G.duel.seed) G.duel.seed=(Math.random()*1e9)|0; G.rng=mulberry32(G.duel.seed); }
 else G.rng=null;
 syncDiffBadge();
 applyMap(G.map);
 G.occ=new Array(COLS*ROWS).fill(null);
 G.scene='play';
 G.gold=G.D.gold+(G.chaos?220:0); G.lives=G.D.lives; G.maxLives=G.D.lives;
 G.score=0; G.wave=0; G.waveOn=false; G.waveT=0; G.repBank=0;
 G.queue=[]; G.enemies=[]; G.towers=[]; G.shots=[]; G.fx=[]; G.parts=[]; G.texts=[];
 G.pools=[]; G.mines=[]; G.bombs=[]; G.crawlers=[]; G.vortex=[]; G.shBank=0; G.rushT=0; G.pAcc=0; G.cShield=0; G.bossOn=false; G.corpseDepth=0;
 G.sel=null; G.buy=null; G.paused=false; G.endless=!!endless||G.chaos;
 G.killed=0; G.leaked=0; G.earned=0; G.dealt=0; G.tips=0; G.tab=0;
 G.prepMax=20; G.prep=20;
 uiCache={};
 setSpeed(1);
 E.pause.classList.remove('on'); E.pause.innerHTML='❚❚ 정지';
 E.veil.classList.add('hide');
 E.feed.innerHTML='';
 feed('<b>'+G.map.name+'</b> · '+G.D.name+(G.chaos?' · <b>아수라장</b>':'')+' 작전 개시');
 feed('배치 준비 <b>20초</b> · 시작 에너지 <b>'+G.gold+'</b>');
 if(G.chaos) feed('웨이브 1·4·7… 종료마다 <b>증강</b>을 하나 선택합니다','warn');
 hintText('방어탑을 고르고 <b>회랑 옆 빈 칸</b>을 클릭해 배치하세요');
 SND.init(); SND.resume(); SND.startMusic(); SND.intensity=.2;
 syncUI();
}
function grade(){
 const s=G.score;
 if(s>=26000) return 'S · 완벽한 방어선';
 if(s>=17000) return 'A · 능숙한 지휘';
 if(s>=10000) return 'B · 안정적인 운용';
 if(s>=5000) return 'C · 버텨냈다';
 return 'D · 재편성이 필요하다';
}
function finish(win){
 if(G.scene==='over') return;
 G.scene='over';
 if(win) G.score+=Math.round((G.lives*260+2400)*G.D.mult);
 SND.play(win?'win':'lose');
 SND.stopMusic();
 if(G.duel.on){
  const rec={wave:G.wave,score:G.score,killed:G.killed,lives:G.lives,leaked:G.leaked};
  G.buy=null; G.sel=null; E.detail.classList.remove('show');
  if(G.duel.turn===1){ G.duel.p1=rec; showDuelHandoff(); }
  else { G.duel.p2=rec; showDuelResult(); }
  return;
 }
 const isBest=DB.setBest(G.map.id,bestKey(G.chaos),G.score);
 G.buy=null; G.sel=null;
 E.detail.classList.remove('show');
 E.sheet.innerHTML=
  '<div class="verdict'+(win?'':' bad')+'">'+(win?'방어 성공':'코어 붕괴')+'</div>'+
  '<h1>'+(win?'모든 웨이브를 막아냈습니다':'웨이브 '+G.wave+'에서 무너졌습니다')+'</h1>'+
  '<p class="tag">'+G.map.name+' · '+G.D.name+' · 평가 '+grade()+(isBest?' · <span style="color:#ffc247">개인 최고 기록</span>':'')+'</p>'+
  '<div class="scores">'+
   '<div class="sc"><div class="k">Score</div><div class="v" style="color:#ffc247">'+fmt(G.score)+'</div></div>'+
   '<div class="sc"><div class="k">도달 웨이브</div><div class="v">'+G.wave+'</div></div>'+
   '<div class="sc"><div class="k">격추</div><div class="v">'+fmt(G.killed)+'</div></div>'+
   '<div class="sc"><div class="k">누적 피해</div><div class="v">'+fmt(G.dealt)+'</div></div>'+
   '<div class="sc"><div class="k">침투 허용</div><div class="v" style="color:'+(G.leaked?'#ff4d6d':'#5ef2a4')+'">'+G.leaked+'</div></div>'+
   '<div class="sc"><div class="k">남은 내구도</div><div class="v">'+G.lives+'</div></div>'+
  '</div>'+
  '<div class="startrow">'+
   '<button class="big" id="e-again">다시 도전</button>'+
   (win?'<button class="big alt" id="e-endless">무한 모드 계속</button>':'')+
   '<button class="btn" id="e-menu" style="padding:12px 18px">지형 · 난이도 변경</button>'+
   '<button class="btn" id="e-share" style="padding:12px 18px">결과 복사</button>'+
  '</div>';
 E.veil.classList.remove('hide');
 E.sheet.querySelector('#e-again').addEventListener('click',function(){ startGame(false); });
 const en=E.sheet.querySelector('#e-endless');
 if(en) en.addEventListener('click',function(){
  G.scene='play'; G.endless=true; G.prepMax=15; G.prep=15;
  E.veil.classList.add('hide');
  feed('<b>무한 모드</b> 진입 · 웨이브가 끝없이 강해집니다','warn');
  SND.startMusic();
 });
 E.sheet.querySelector('#e-menu').addEventListener('click',function(){ showMenu(false); });
 const sh=E.sheet.querySelector('#e-share');
 sh.addEventListener('click',function(){
  const txt='네온 코어 디펜스 · '+G.map.name+' · '+G.D.name+'\n'+
   (win?'전 웨이브 방어 성공':'웨이브 '+G.wave+'에서 코어 붕괴')+'\n'+
   '점수 '+fmt(G.score)+' · 격추 '+fmt(G.killed)+' · 평가 '+grade()+'\n너도 한번 해볼래?';
  const done=function(){ sh.textContent='복사 완료'; setTimeout(function(){ sh.textContent='결과 복사'; },1800); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,function(){ sh.textContent='복사 실패'; });
  else sh.textContent='복사 실패';
 });
}

/* ═══════════ 루프 ═══════════ */
const FIX=1/60;
let lastT=0, acc=0, fpsA=0, fpsN=0;
function loop(ts){
 requestAnimationFrame(loop);
 if(!lastT){ lastT=ts; return; }
 let dt=(ts-lastT)/1000; lastT=ts;
 if(dt>.25) dt=.25;
 fpsA+=dt; fpsN++;
 if(fpsA>=1.5){ G.lowfx=(fpsN/fpsA)<44; fpsA=0; fpsN=0; }
 const frozen=(G.scene==='play'&&G.paused);
 acc+=dt;
 let guard=0;
 while(acc>=FIX&&guard++<6){
  acc-=FIX;
  if(frozen) continue;
  const n=(G.scene==='play')?G.speed:1;
  for(let i=0;i<n;i++) step(FIX);
 }
 if(G.path) render();
 if(G.scene!=='menu') syncFast(false);
}

/* ═══════════ 부팅 ═══════════ */
function boot(){
 E.veil=$('#veil'); E.sheet=$('#sheet'); E.shop=$('#shop'); E.detail=$('#detail');
 E.dIc=$('#d-ic'); E.dNm=$('#d-nm'); E.dLv=$('#d-lv'); E.dRows=$('#d-rows'); E.dNote=$('#d-note');
 E.modes=$('#d-modes'); E.up=$('#d-up'); E.sell=$('#d-sell'); E.acts=E.up.parentNode;
 E.feed=$('#feed'); E.hint=$('#hint'); E.banner=$('#banner');
 E.bannerT=E.banner.querySelector('.txt'); E.bannerS=E.banner.querySelector('.sub');
 E.vWave=$('#v-wave'); E.vGold=$('#v-gold'); E.vLife=$('#v-life'); E.vScore=$('#v-score');
 E.roGold=$('#ro-gold'); E.roLife=$('#ro-life'); E.mapname=$('#mapname'); E.diffbadge=$('#diffbadge');
 E.mflist=$('#mflist'); E.mftimer=$('#mftimer'); E.mfbonus=$('#mfbonus');
 E.call=$('#b-call'); E.auto=$('#b-auto'); E.pause=$('#b-pause');
 E.tabs=$('#tabs'); E.augpanel=$('#augpanel'); E.auglist=$('#auglist');

 G.diff=DB.opt('diff','normal'); G.D=DIFFS[G.diff]||DIFFS.normal;
 G.chaosSel=DB.opt('chaos',false);
 buildTabs(); buildShop();
 VIG=buildVIG();
 syncDiffBadge();
 applyMap(findMap(DB.opt('map','dawn'))||MAPS[0]);
 G.auto=DB.opt('auto',true);
 E.auto.classList.toggle('on',G.auto);
 SND.on=DB.opt('sfx',true); SND.musOn=DB.opt('mus',true);
 $('#b-sfx').classList.toggle('on',SND.on);
 $('#b-mus').classList.toggle('on',SND.musOn);

 cv.addEventListener('pointermove',function(ev){
  const p=canvasPos(ev);
  G.mouse.x=p.x; G.mouse.y=p.y; G.mouse.in=true;
  G.hover.x=Math.floor(p.x/TILE); G.hover.y=Math.floor(p.y/TILE);
 });
 cv.addEventListener('pointerleave',function(){ G.mouse.in=false; });
 cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
 cv.addEventListener('pointerdown',function(ev){
  ev.preventDefault();
  SND.init(); SND.resume();
  if(G.scene!=='play'||G.paused) return;
  const p=canvasPos(ev);
  const tx=Math.floor(p.x/TILE), ty=Math.floor(p.y/TILE);
  G.hover.x=tx; G.hover.y=ty; G.mouse.in=true; G.mouse.x=p.x; G.mouse.y=p.y;
  if(ev.button===2){ G.buy=null; G.sel=null; syncUI(); return; }
  const occ=(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS)?G.occ[ty*COLS+tx]:null;
  if(G.buy){
   if(occ){ G.sel=occ; G.buy=null; syncUI(); }
   else tryPlace(tx,ty);
   return;
  }
  G.sel=(occ&&G.sel!==occ)?occ:null;
  syncUI();
 });
 E.modes.addEventListener('click',function(ev){
  const b=ev.target.closest('[data-mode]');
  if(!b||!G.sel) return;
  G.sel.mode=b.dataset.mode;
  syncUI();
 });
 E.up.addEventListener('click',function(){ if(G.sel) upgrade(G.sel); });
 E.sell.addEventListener('click',function(){ if(G.sel) sellTower(G.sel); });
 E.call.addEventListener('click',function(){ SND.init(); SND.resume(); callWave(); });
 E.auto.addEventListener('click',function(){
  G.auto=!G.auto; E.auto.classList.toggle('on',G.auto); DB.setOpt('auto',G.auto);
  feed('웨이브 자동 시작 <b>'+(G.auto?'켜짐':'꺼짐')+'</b>');
 });
 E.pause.addEventListener('click',togglePause);
 $('#b-quit').addEventListener('click',openMenu);
 $('#b-sfx').addEventListener('click',function(){
  SND.init(); SND.on=!SND.on; this.classList.toggle('on',SND.on); DB.setOpt('sfx',SND.on);
  if(SND.on) SND.play('build');
 });
 $('#b-mus').addEventListener('click',function(){
  SND.init(); SND.resume();
  SND.setMusic(!SND.musOn); this.classList.toggle('on',SND.musOn); DB.setOpt('mus',SND.musOn);
  if(SND.musOn&&G.scene==='play') SND.startMusic();
 });
 const sp=document.querySelectorAll('[data-speed]');
 for(let i=0;i<sp.length;i++) sp[i].addEventListener('click',function(){ setSpeed(+this.dataset.speed); });

 window.addEventListener('keydown',function(ev){
  const c=ev.code;
  if(G.scene!=='play'){
   if(c==='Enter'&&!E.veil.classList.contains('hide')){
    const g=E.sheet.querySelector('#m-go')||E.sheet.querySelector('#e-again');
    if(g) g.click();
   }
   return;
  }
  if(c.indexOf('Digit')===0){
   const n=+c.slice(5), ids=TCATS[G.tab].ids;
   if(n>=1&&n<=ids.length){ selectBuy(ids[n-1]); ev.preventDefault(); }
  }
  else if(c==='Tab'){ ev.preventDefault(); G.tab=(G.tab+1)%TCATS.length; buildTabs(); buildShop(); syncUI(); }
  else if(c==='Space'){ ev.preventDefault(); SND.init(); SND.resume(); callWave(); }
  else if(c==='KeyP'){ togglePause(); }
  else if(c==='Escape'){ G.buy=null; G.sel=null; syncUI(); }
  else if(c==='KeyU'){ if(G.sel) upgrade(G.sel); }
  else if(c==='KeyX'){ if(G.sel) sellTower(G.sel); }
  else if(c==='BracketLeft'){ setSpeed(Math.max(1,G.speed-1)); }
  else if(c==='BracketRight'){ setSpeed(Math.min(3,G.speed+1)); }
 });
 window.addEventListener('blur',function(){ if(G.scene==='play'&&!G.paused) togglePause(); });

 showMenu(false);
 syncUI();
 requestAnimationFrame(loop);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
