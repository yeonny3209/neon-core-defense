plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neoncore.defense'
    compileSdk 34

    defaultConfig {
        applicationId "com.neoncore.defense"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 게임 HTML을 https://appassets.androidplatform.net 으로 서빙하기 위해 사용한다.
    // file:// 로 띄우면 localStorage 와 WebRTC 가 불안정해서 이 방식이 필요하다.
    implementation 'androidx.webkit:webkit:1.10.0'
}
