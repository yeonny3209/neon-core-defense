<title>네온 코어 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#05070f; --deck:#0b1120; --deck2:#121c34;
  --edge:rgba(125,170,255,.15); --edge2:rgba(125,170,255,.34);
  --ice:#e8f0ff; --mute:#8095bd; --dim:#5b6c94;
  --core:#2fe0ff; --flux:#ffc247; --breach:#ff4d6d; --grow:#5ef2a4;
  --font-d:'Orbitron',ui-sans-serif,system-ui,sans-serif;
  --font-b:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 640px at 18% -12%, #112445 0%, transparent 62%),
    radial-gradient(900px 620px at 104% 112%, #1d1136 0%, transparent 58%),
    var(--void);
  background-attachment:fixed;
  color:var(--ice); font-family:var(--font-b); font-size:14px; line-height:1.5;
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{background:var(--core);color:#04202a}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--core);outline-offset:2px;border-radius:6px}

#app{max-width:1500px;margin:0 auto;padding:12px 14px 22px;display:flex;flex-direction:column;gap:11px}

/* ---------- top rail ---------- */
#rail{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 14px;border:1px solid var(--edge);
  border-radius:14px;background:linear-gradient(180deg,rgba(21,33,60,.8),rgba(9,14,28,.72));backdrop-filter:blur(9px)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-d);font-weight:900;font-size:14px;letter-spacing:.05em;white-space:nowrap}
.brand .mark{width:20px;height:22px;background:linear-gradient(160deg,var(--core),#0a6f8c);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:0 0 16px -2px var(--core);flex:none;
  animation:markpulse 3.4s ease-in-out infinite}
@keyframes markpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
.brand small{font-family:var(--font-b);font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0}
.diffbadge{font-family:var(--font-b);font-weight:700;font-size:9.5px;letter-spacing:.06em;color:var(--core);
  background:rgba(47,224,255,.12);border:1px solid rgba(47,224,255,.36);border-radius:99px;padding:2px 8px;white-space:nowrap}
.diffbadge.easy{color:var(--grow);background:rgba(94,242,164,.12);border-color:rgba(94,242,164,.36)}
.diffbadge.hard{color:var(--breach);background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.4)}
.diffbadge.chaos{color:#ff6bd6;background:rgba(255,107,214,.16);border-color:rgba(255,107,214,.5)}

.readouts{display:flex;gap:7px;flex-wrap:wrap}
.ro{min-width:88px;padding:5px 11px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.028)}
.ro .k{display:block;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:500}
.ro .v{display:block;font-family:var(--font-d);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.25}
.ro.flux .v{color:var(--flux)} .ro.life .v{color:var(--grow)} .ro.life.hurt .v{color:var(--breach)}
.ro.bump .v{animation:bump .34s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{font-size:12px;font-weight:600;color:var(--mute);background:rgba(255,255,255,.04);border:1px solid var(--edge);
  border-radius:9px;padding:7px 11px;cursor:pointer;transition:background .14s,color .14s,border-color .14s,transform .14s}
.btn:hover{color:var(--ice);border-color:var(--edge2);background:rgba(47,224,255,.1)}
.btn:active{transform:translateY(1px)}
.btn.on{color:#04202a;background:var(--core);border-color:var(--core);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden}
.seg .btn{border:0;border-radius:0;padding:7px 10px}
.seg .btn+.btn{border-left:1px solid var(--edge)}

/* ---------- stage ---------- */
#stage{display:flex;gap:11px;align-items:flex-start}
#field{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:9px}
#board{position:relative;border:1px solid var(--edge2);border-radius:14px;overflow:hidden;background:#04060d;
  box-shadow:0 26px 70px -26px #000,0 0 60px -30px var(--core)}
canvas#game{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
#banner .txt{font-family:var(--font-d);font-weight:900;font-size:clamp(28px,5vw,58px);letter-spacing:.16em;
  color:#fff;text-shadow:0 0 34px var(--core),0 0 90px var(--core);white-space:nowrap;text-align:center}
#banner .sub{font-size:13px;letter-spacing:.34em;color:var(--core);text-align:center;margin-top:6px;text-transform:uppercase}
#banner.go{animation:bannergo 2.1s ease forwards}
@keyframes bannergo{0%{opacity:0;transform:scale(.86)}18%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:7px 15px;border-radius:99px;
  background:rgba(6,10,20,.86);border:1px solid var(--edge2);font-size:12px;color:var(--mute);pointer-events:none;
  white-space:nowrap;transition:opacity .3s;backdrop-filter:blur(4px)}
#hint b{color:var(--core)}
#hint.off{opacity:0}

/* ---------- manifest ---------- */
#manifest{display:flex;align-items:center;gap:11px;padding:8px 11px;border:1px solid var(--edge);border-radius:12px;
  background:linear-gradient(180deg,rgba(18,28,52,.72),rgba(9,14,28,.72));flex-wrap:wrap;position:relative;overflow:hidden}
#manifest .lead{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600;white-space:nowrap}
#mflist{display:flex;gap:6px;flex:1 1 200px;flex-wrap:wrap;min-width:0}
.chip{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 5px;border-radius:99px;background:rgba(255,255,255,.045);
  border:1px solid var(--edge);font-size:11.5px;font-weight:500;white-space:nowrap}
.chip svg{flex:none}
.chip b{font-family:var(--font-d);font-size:11px;font-variant-numeric:tabular-nums;color:var(--ice)}
.chip.boss{border-color:var(--breach);background:rgba(255,77,109,.14);color:#ffd7dd}
#mftimer{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--core),#7cf5ff);width:0;
  box-shadow:0 0 12px var(--core)}

/* ---------- side column ---------- */
#col{width:302px;flex:0 0 302px;display:flex;flex-direction:column;gap:9px}
.panel{border:1px solid var(--edge);border-radius:14px;padding:11px;
  background:linear-gradient(180deg,rgba(19,29,54,.76),rgba(8,13,26,.8))}
.panel>h2{margin:0 0 9px;font-family:var(--font-d);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mute);font-weight:700;display:flex;align-items:center;gap:8px}
.panel>h2::after{content:"";flex:1;height:1px;background:var(--edge)}

#tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{flex:1;padding:6px 2px;border-radius:8px;border:1px solid var(--edge);background:transparent;color:var(--dim);
  font-size:11px;font-weight:700;cursor:pointer;transition:.13s;font-family:var(--font-b)}
.tab:hover{color:var(--ice);border-color:var(--edge2)}
.tab.on{background:rgba(47,224,255,.16);border-color:var(--core);color:var(--core)}
#shop{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#auglist{display:flex;flex-wrap:wrap;gap:5px}
.augchip{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;
  border:1px solid;white-space:nowrap}
.augchip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;font-style:normal}
.augs{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:4px 0}
.augcard{position:relative;padding:16px 14px 15px;border-radius:14px;border:1px solid var(--edge);cursor:pointer;
  text-align:left;color:var(--ice);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  display:flex;flex-direction:column;gap:7px;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.augcard:hover{transform:translateY(-3px)}
.augcard .rr{font-family:var(--font-d);font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.augcard .an{font-size:15px;font-weight:700;line-height:1.3}
.augcard .ad{font-size:11.5px;color:var(--mute);line-height:1.55}
.augcard::before{content:"";position:absolute;inset:0;opacity:.1;pointer-events:none;background:radial-gradient(120px 60px at 50% 0%,currentColor,transparent 70%)}
.augcard.r1{border-color:rgba(185,198,255,.4);color:#b9c6ff}
.augcard.r1:hover{box-shadow:0 12px 34px -14px #b9c6ff}
.augcard.r2{border-color:rgba(255,194,71,.5);color:#ffc247}
.augcard.r2:hover{box-shadow:0 12px 34px -12px #ffc247}
.augcard.r3{border-color:rgba(255,107,214,.6);color:#ff6bd6;
  background:linear-gradient(180deg,rgba(255,107,214,.14),rgba(47,224,255,.07))}
.augcard.r3:hover{box-shadow:0 14px 40px -10px #ff6bd6}
.augcard .an,.augcard .ad{color:var(--ice)}
.augcard .ad{color:var(--mute)}
@media (max-width:700px){ .augs{grid-template-columns:1fr} }
.card{position:relative;padding:8px 8px 7px;border-radius:11px;border:1px solid var(--edge);text-align:left;
  background:rgba(255,255,255,.025);cursor:pointer;color:var(--ice);display:flex;flex-direction:column;gap:5px;
  transition:transform .13s,border-color .13s,background .13s,box-shadow .13s}
.card:hover{border-color:var(--edge2);background:rgba(255,255,255,.06);transform:translateY(-1px)}
.card.sel{border-color:var(--c);background:rgba(255,255,255,.08);box-shadow:0 0 0 1px var(--c),0 8px 26px -10px var(--c)}
.card.poor{opacity:.42}
.card .ic{height:30px;display:grid;place-items:center}
.card .nm{font-size:11.5px;font-weight:700;letter-spacing:-.01em}
.card .ct{font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--flux);font-variant-numeric:tabular-nums}
.card .hk{position:absolute;top:5px;right:6px;font-family:var(--font-d);font-size:9px;color:var(--dim)}

#detail{display:none}
#detail.show{display:block}
.dhead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.dhead .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--edge);flex:none}
.dhead .nm{font-size:13.5px;font-weight:700;line-height:1.25}
.dhead .lv{font-family:var(--font-d);font-size:10px;letter-spacing:.1em;color:var(--core)}
.rows{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.row{display:flex;align-items:baseline;gap:8px;font-size:11.5px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.02)}
.row .k{color:var(--dim);flex:none}
.row .v{font-family:var(--font-d);font-size:11.5px;font-variant-numeric:tabular-nums;margin-left:auto}
.row .up{color:var(--grow);font-size:10.5px;font-family:var(--font-d);margin-left:5px}
.note{font-size:11px;line-height:1.5;color:var(--mute);padding:7px 9px;border-radius:8px;background:rgba(47,224,255,.07);
  border-left:2px solid var(--core);margin-bottom:9px}
.note.locked{background:rgba(255,255,255,.03);border-left-color:var(--dim);color:var(--dim)}
.modes{display:flex;gap:4px;margin-bottom:9px;flex-wrap:wrap}
.mode{flex:1 1 auto;padding:5px 2px;border-radius:7px;border:1px solid var(--edge);background:transparent;color:var(--dim);
  font-size:10.5px;font-weight:600;cursor:pointer;transition:.13s}
.mode:hover{color:var(--ice)}
.mode.on{background:rgba(47,224,255,.16);border-color:var(--core);color:var(--core)}
.acts{display:flex;gap:6px}
.acts .btn{flex:1;padding:9px 6px;font-size:12px}
.btn.buy{background:linear-gradient(180deg,rgba(94,242,164,.2),rgba(94,242,164,.09));border-color:rgba(94,242,164,.5);color:#b7ffdb}
.btn.buy:hover:not(:disabled){background:rgba(94,242,164,.3);color:#fff}
.btn.sell{color:#ffb3bf;border-color:rgba(255,77,109,.36)}
.btn.sell:hover{background:rgba(255,77,109,.18);color:#fff}

#feed{max-height:116px;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:11.5px;scrollbar-width:thin}
#feed div{color:var(--mute);padding:2px 0;border-bottom:1px solid rgba(125,170,255,.06);animation:fadein .25s ease}
#feed b{color:var(--ice);font-weight:600}
#feed .good b{color:var(--grow)} #feed .bad b{color:var(--breach)} #feed .warn b{color:var(--flux)}
@keyframes fadein{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

/* ---------- overlay ---------- */
#veil{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;overflow:auto;
  background:radial-gradient(900px 600px at 50% 0%,rgba(20,44,80,.5),transparent 65%),rgba(3,5,12,.86);backdrop-filter:blur(11px)}
#veil.hide{display:none}
.sheet{width:min(780px,100%);border:1px solid var(--edge2);border-radius:18px;padding:26px 28px 24px;
  background:linear-gradient(180deg,rgba(20,31,58,.96),rgba(6,10,21,.98));box-shadow:0 50px 140px -40px #000;
  animation:sheetin .35s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet h1{font-family:var(--font-d);font-weight:900;font-size:clamp(27px,4.6vw,44px);letter-spacing:.03em;margin:0;
  background:linear-gradient(180deg,#fff,#63d8ff 78%,#2fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-wrap:balance;filter:drop-shadow(0 0 26px rgba(47,224,255,.35))}
.sheet .tag{color:var(--mute);font-size:13px;margin:8px 0 20px;max-width:58ch;line-height:1.65}
.sheet h3{font-family:var(--font-d);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:18px 0 9px;font-weight:700}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mapcard{padding:11px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.026);cursor:pointer;
  text-align:left;color:var(--ice);transition:.14s;display:flex;flex-direction:column;gap:7px}
.mapcard:hover{border-color:var(--edge2);background:rgba(255,255,255,.06)}
.mapcard.on{border-color:var(--core);box-shadow:0 0 0 1px var(--core),0 10px 30px -14px var(--core);background:rgba(47,224,255,.08)}
.mapcard canvas{width:100%;height:auto;display:block;border-radius:7px;background:rgba(0,0,0,.36)}
.mapcard .nm{font-size:13px;font-weight:700}
.mapcard .sub{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips .btn{padding:8px 15px}
.startrow{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.big{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.07em;padding:14px 34px;border-radius:11px;
  color:#04202a;background:linear-gradient(180deg,#7ceeff,var(--core));border:0;cursor:pointer;
  box-shadow:0 12px 34px -12px var(--core);transition:.16s}
.big:hover{transform:translateY(-2px);box-shadow:0 18px 44px -12px var(--core);filter:brightness(1.08)}
.big.alt{background:linear-gradient(180deg,#ffe08a,var(--flux));box-shadow:0 12px 34px -12px var(--flux);color:#2a1c00}
.best{font-size:12px;color:var(--mute)}
.best b{font-family:var(--font-d);color:var(--flux);font-size:14px}
details.guide{margin-top:18px;border-top:1px solid var(--edge);padding-top:14px}
details.guide summary{cursor:pointer;font-size:12px;color:var(--mute);font-weight:600;list-style:none;display:flex;align-items:center;gap:7px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::before{content:"▸";color:var(--core);transition:transform .2s;display:inline-block}
details.guide[open] summary::before{transform:rotate(90deg)}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:10px;margin-top:13px}
.gl div{font-size:11.5px;color:var(--mute);line-height:1.6;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid var(--edge)}
.gl b{color:var(--ice);display:block;margin-bottom:3px;font-size:12px}
kbd{font-family:var(--font-d);font-size:10px;background:rgba(255,255,255,.09);border:1px solid var(--edge2);
  border-radius:5px;padding:1px 6px;color:var(--ice)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px;margin:6px 0 4px}
.sc{padding:11px 13px;border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.028)}
.sc .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sc .v{font-family:var(--font-d);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;margin-top:2px}
.verdict{font-family:var(--font-d);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--core);margin-bottom:7px}
.verdict.bad{color:var(--breach)}
@media (max-width:1080px){
  #stage{flex-direction:column}
  #col{width:100%;flex:none}
  #shop{grid-template-columns:repeat(auto-fit,minmax(124px,1fr))}
  .maps{grid-template-columns:1fr}
  .mapcard{flex-direction:row;align-items:center}
  .mapcard canvas{width:104px;flex:none}
}
@media (max-width:620px){
  #app{padding:8px 8px 16px}
  .brand small{display:none}
  .ro{min-width:68px;padding:4px 8px}
  .ro .v{font-size:15px}
  .sheet{padding:20px 18px}
  .big{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
<div id="app">
  <header id="rail">
    <div class="brand"><span class="mark"></span>NEON CORE <small id="mapname">새벽 회랑</small><span class="diffbadge" id="diffbadge">정규</span></div>
    <div class="readouts">
      <div class="ro" id="ro-wave"><span class="k">Wave</span><span class="v" id="v-wave">0 / 30</span></div>
      <div class="ro flux" id="ro-gold"><span class="k">에너지</span><span class="v" id="v-gold">0</span></div>
      <div class="ro life" id="ro-life"><span class="k">코어 내구도</span><span class="v" id="v-life">20</span></div>
      <div class="ro" id="ro-score"><span class="k">Score</span><span class="v" id="v-score">0</span></div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="게임 속도">
        <button class="btn on" data-speed="1">1×</button>
        <button class="btn" data-speed="2">2×</button>
        <button class="btn" data-speed="3">3×</button>
      </div>
      <button class="btn" id="b-pause" title="일시정지 (P)">❚❚ 정지</button>
      <button class="btn on" id="b-sfx" title="효과음">효과음</button>
      <button class="btn on" id="b-mus" title="배경음">배경음</button>
      <button class="btn" id="b-quit" title="메인으로">나가기</button>
    </div>
  </header>

  <div id="stage">
    <div id="field">
      <div id="board">
        <canvas id="game" width="1120" height="640" aria-label="게임 화면"></canvas>
        <div id="banner"><div><div class="txt">WAVE 1</div><div class="sub"></div></div></div>
        <div id="hint">타워를 고르고 <b>빈 칸</b>을 클릭해 설치하세요</div>
      </div>
      <div id="manifest">
        <span class="lead">다음 편성</span>
        <div id="mflist"></div>
        <span class="best" id="mfbonus"></span>
        <button class="btn on" id="b-call">웨이브 호출 <kbd>Space</kbd></button>
        <button class="btn on" id="b-auto" title="웨이브 자동 시작">자동</button>
        <div id="mftimer"></div>
      </div>
    </div>

    <aside id="col">
      <section class="panel">
        <h2>건설</h2>
        <div id="tabs"></div>
        <div id="shop"></div>
      </section>
      <section class="panel" id="augpanel" hidden>

function rollAugments(n){

 if(w>=20){ wt[1]=42; wt[2]=39; wt[3]=19; }
 if(w>=30){ wt[1]=32; wt[2]=42; wt[3]=26; }
 for(let k=0;k<n&&pool.length;k++){
  let r=Math.random()*(wt[1]+wt[2]+wt[3]);
  let tier=r<wt[1]?1:(r<wt[1]+wt[2]?2:3);
  let band=pool.filter(function(a){return a.r===tier;});
  if(!band.length) band=pool.slice();
  const pick=band[(Math.random()*band.length)|0];
  picks.push(pick);
  const idx=pool.indexOf(pick); if(idx>=0) pool.splice(idx,1);
 }

}

function buildPath(map){
 const pts=map.wp.map(w=>({x:(w[0]+.5)*TILE,y:(w[1]+.5)*TILE}));
 const segs=[]; let total=0;
 for(let i=0;i<pts.length-1;i++){
  const a=pts[i],b=pts[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);
  segs.push({a:a,b:b,len:len,s:total,ux:(b.x-a.x)/len,uy:(b.y-a.y)/len});
  total+=len;
 }
 const tiles=new Set();
 for(let i=0;i<map.wp.length-1;i++){
  let x=map.wp[i][0],y=map.wp[i][1];
  const tx=map.wp[i+1][0],ty=map.wp[i+1][1];
  const sx=Math.sign(tx-x),sy=Math.sign(ty-y); let guard=0;
  tiles.add(x+','+y);
  while((x!==tx||y!==ty)&&guard++<300){ x+=sx; y+=sy; tiles.add(x+','+y); }
 }
 const gate=pts[0], core=pts[pts.length-1];
 return {pts:pts,segs:segs,total:total,tiles:tiles,gate:gate,core:core,
   airLen:Math.hypot(core.x-gate.x,core.y-gate.y)};
}
function ptAt(d){
 const p=G.path, n=p.segs.length; d=clamp(d,0,p.total);
 for(let i=0;i<n;i++){ const s=p.segs[i];
  if(d<=s.s+s.len||i===n-1){ const k=d-s.s; return {x:s.a.x+s.ux*k, y:s.a.y+s.uy*k, ang:Math.atan2(s.uy,s.ux)}; } }
 return {x:p.core.x,y:p.core.y,ang:0};
}
function airAt(d){
 const p=G.path, k=clamp(d/p.airLen,0,1);
 return {x:lerp(p.gate.x,p.core.x,k), y:lerp(p.gate.y,p.core.y,k),
   ang:Math.atan2(p.core.y-p.gate.y,p.core.x-p.gate.x)};
}

function makeEnemy(type,waveN,dist){
 const D=ENEMIES[type];
 const hs=hpScale(waveN)*G.D.hp*(G.chaos?chaosHp(waveN):1);
 const e={
  type:type,D:D,waveN:waveN,r:D.r,col:D.col,air:!!D.air,
  maxHp:D.hp*hs, hp:D.hp*hs,
  armor:D.armor+(G.chaos?chaosArmor(waveN):0),
  shred:0, vuln:0, cursed:false,
  gold:Math.max(1,Math.round(D.gold*goldScale(waveN))),
  dist:dist||0, x:0,y:0, ang:0, prog:0,
  spd:D.spd*G.D.spd*(G.chaos?chaosSpd(waveN):1), slow:0, slowT:0, freeze:0, stun:0, pois:[],
  shield:D.shield?D.shield.amt*hs:0, shieldMax:D.shield?D.shield.amt*hs:0, shieldT:0,
  healCd:rnd(0,1), spawnCd:3, alive:true, hitT:0, hasted:false,
  wob:Math.random()*TAU, spin:rnd(-1.6,1.6), age:0
 };
 const p=e.air?airAt(e.dist):ptAt(e.dist);
 e.x=p.x; e.y=p.y; e.ang=p.ang;
 return e;
}
function hurt(e,amount,o){
 o=o||{};
 if(!e.alive||amount<=0) return 0;
 let dmg=amount, crit=false;
 const src=o.src, direct=(src&&!o.pure&&!o.aug);
 if(direct&&src.cc>0&&!o.nocrit&&Math.random()<src.cc){ crit=true; dmg*=src.cm; }
 if(e.D.dr) dmg*=(1-e.D.dr);
 if(AUG.swarm&&e.D.cls==='swarm') dmg*=(1+AUG.swarm);
 if(AUG.giant&&e.D.cls==='giant') dmg*=(1+AUG.giant);
 if(AUG.air&&e.air) dmg*=(1+AUG.air);
 const vul=AUG.vuln+(e.vuln||0);
 if(vul) dmg*=(1+vul);
 if(AUG.first&&G.waveOn&&G.waveT<4) dmg*=(1+AUG.first);
 if(AUG.last&&G.lives<=5) dmg*=(1+AUG.last);
 if(!o.pure){
  const ar=Math.max(0,(e.armor-AUG.shred-(e.shred||0))*(1-(o.pen||0)));
  dmg=Math.max(dmg*0.12,dmg-ar);
 }
 if(AUG.exec&&direct&&!e.D.boss&&e.shield<=0&&e.hp>0&&e.hp/e.maxHp<=AUG.exec){
  say(e.x,e.y-e.r-6,'처형','#ff6bd6',14); dmg=e.hp+1;
 }
 if(e.shield>0){
  const a=Math.min(e.shield,dmg); e.shield-=a; dmg-=a; e.shieldT=e.D.shield.delay;
  if(e.shield<=0){ ring(e.x,e.y,e.r+10,'#ffe066',.35,2); SND.play('die',60); }
 }
 e.hp-=dmg; e.hitT=.11;
 G.dealt+=dmg;
 if(src){ src.dmg+=dmg; }
 if(!o.silent&&dmg>=6) say(e.x+rnd(-4,4),e.y-e.r-3,Math.round(dmg),crit?'#ffd34d':'#eaf4ff',crit?15:11);
 if(e.hp<=0){ kill(e,src); return dmg; }
 if(direct) augOnHit(e,src,dmg);
 return dmg;
}
function augOnHit(e,src,dmg){
 if(AUG.slow>0&&!e.D.noSlow){ if(AUG.slow>e.slow||e.slowT<=0) e.slow=Math.max(e.slow,AUG.slow); e.slowT=Math.max(e.slowT,1.2); }
 if(AUG.burn>0) poison(e,AUG.burn,3,3,src);
 if(AUG.stun>0&&Math.random()<AUG.stun) e.stun=Math.max(e.stun,.4);
 if(AUG.splash>0&&dmg>0){
  const r=AUG.splash, r2=r*r, n=G.enemies.length;
  for(let i=0;i<n;i++){
   const o2=G.enemies[i];
   if(!o2.alive||o2===e||d2(e.x,e.y,o2.x,o2.y)>r2) continue;
   hurt(o2,dmg*.35,{src:src,aug:true,silent:true});
  }
  ring(e.x,e.y,r,'#ffb066',.2,1.5);
 }
 if(AUG.chain>0&&Math.random()<AUG.chain){
  let best=null,bd=92*92, n=G.enemies.length;
  for(let i=0;i<n;i++){
   const o2=G.enemies[i];
   if(!o2.alive||o2===e) continue;
   const dd=d2(e.x,e.y,o2.x,o2.y);
   if(dd<bd){ bd=dd; best=o2; }
  }
  if(best){ bolt([{x:e.x,y:e.y},{x:best.x,y:best.y}],'#9df0ff',.14); hurt(best,dmg*.5,{src:src,aug:true,silent:true}); }
 }
}
function kill(e,src){
 if(!e.alive) return;
 e.alive=false;
 let gain=e.gold*(1+AUG.goldKill)*(G.chaos?1.35:1);
 if(e.cursed) gain*=2;
 if(e.D.boss) gain*=(1+AUG.bossGold);
 e.gold=Math.max(1,Math.round(gain));
 G.gold+=e.gold; G.earned+=e.gold; G.score+=Math.round(e.D.pt*G.D.mult);
 if(!e.D.noCount) G.killed++;
 flashGold();
 if(src){ src.kills++; }
 burst(e.x,e.y,e.col,e.D.boss?54:11,e.D.boss?4.2:1.6);
 say(e.x,e.y-e.r-4,'+'+e.gold,'#ffc247',e.D.boss?18:11);
 if(e.D.boss){ G.shake=Math.max(G.shake,18); boom(e.x,e.y,90,'#ff5b6e'); SND.play('bigdie'); feed('<b>'+e.D.name+'</b> 격파','good'); }
 else SND.play('die',40);
 if(e.D.split){
  for(let i=0;i<e.D.split[1];i++){
   const s=makeEnemy(e.D.split[0],e.waveN,Math.max(0,e.dist-i*14));
   s.x=e.x+rnd(-9,9); s.y=e.y+rnd(-9,9); G.enemies.push(s);
  }
 }
}
function leak(e){
 e.alive=false;
 G.lives-=e.D.leak; G.leaked++;
 G.shake=Math.max(G.shake,e.D.boss?22:9); G.flash=1;
 boom(G.path.core.x,G.path.core.y,64,'#ff4d6d');
 SND.play('leak',100);
 feed('<b>'+e.D.name+'</b> 코어 침투 · 내구도 -'+e.D.leak,'bad');
 if(G.lives<=0){ G.lives=0; finish(false); }
}

function refreshBuffs(){
 const n=G.towers.length;
 let any=false;
 for(let i=0;i<n;i++){
  const t=G.towers[i]; t.bd=0;t.br=0;t.bg=0;t.bc=0;t.bcm=0;
  if(t.id==='amp'||t.id==='chrono'||t.id==='radar') any=true;
 }
 if(any) for(let i=0;i<n;i++){
  const a=G.towers[i];
  if(a.id!=='amp'&&a.id!=='chrono'&&a.id!=='radar') continue;
  const L=a.D.lv[a.lv], r2=L.rng*L.rng;
  for(let j=0;j<n;j++){
   const t=G.towers[j];
   if(t===a||t.D.hits==='none') continue;
   if(d2(a.x,a.y,t.x,t.y)>r2) continue;
   if(a.id==='amp'){ t.bd+=L.ad; t.br+=L.ar; if(a.lv===3) t.bg+=.10; }
   else if(a.id==='chrono'){ t.br+=L.ar; }
   else { t.bc+=L.ac; t.bg+=L.abg; if(a.lv===3) t.bcm+=.5; }
  }
 }
 for(let i=0;i<n;i++){
  const t=G.towers[i];
  t.bd=Math.min(t.bd,1.2); t.br=Math.min(t.br,1.0);
  t.bg=Math.min(t.bg,.45); t.bc=Math.min(t.bc,.6);
 }
}
/* 저주·시간붕괴 오라를 적에게 각인 */
function applyAuras(){
 const n=G.enemies.length;
 for(let i=0;i<n;i++){ const e=G.enemies[i]; e.shred=0; e.vuln=0; e.cursed=false; }
 for(let i=0;i<G.towers.length;i++){
  const t=G.towers[i];
  if(t.id!=='curse'&&!(t.id==='chrono'&&t.lv===3)) continue;
  const L=t.D.lv[t.lv], r2=L.rng*L.rng;
  for(let j=0;j<n;j++){
   const e=G.enemies[j];
   if(!e.alive||d2(t.x,t.y,e.x,e.y)>r2) continue;
   if(t.id==='curse'){
    if(L.shred>e.shred) e.shred=L.shred;
    if(L.vuln>e.vuln) e.vuln=L.vuln;
    if(t.lv===3) e.cursed=true;
   } else if(!e.D.noSlow){
    if(e.slow<.2||e.slowT<=0) e.slow=Math.max(e.slow,.2);
    e.slowT=Math.max(e.slowT,.3);
   }
  }
 }
}
function buildCost(id){ return Math.max(10,Math.round(TOWERS[id].cost*(1-AUG.buildDisc))); }
function upCost(t){ return t.lv>=3?0:Math.max(5,Math.round(t.D.lv[t.lv+1].cost*(1-AUG.upDisc))); }
function sellValue(t){ return Math.floor(t.spent*Math.min(1,.7+AUG.sellBack)); }

/* ═══════════ 조준 · 사격 ═══════════ */
function findTarget(t,s){
 const r2=s.rng*s.rng, hits=t.D.hits;
 let best=null,bk=-Infinity;
 for(let i=0;i<G.enemies.length;i++){
  const e=G.enemies[i];
  if(!e.alive) continue;
  if(e.air&&hits==='ground') continue;
  const dd=d2(t.x,t.y,e.x,e.y);
  if(dd>r2) continue;
  let k;
  if(t.mode==='last') k=-e.prog;
  else if(t.mode==='strong') k=e.hp+e.shield;
  else if(t.mode==='close') k=-dd;
  else k=e.prog;
  if(k>bk){ bk=k; best=e; }
 }
 return best;
}
function aim(t,e){ t.ang=Math.atan2(e.y-t.y,e.x-t.x); }
function poison(e,dps,dur,cap,src){
 const st=e.pois;
 if(st.length<cap){ st.push({dps:dps,t:dur,src:src||null}); return; }
 let m=0; for(let i=1;i<st.length;i++) if(st[i].dps<st[m].dps) m=i;
 if(dps>=st[m].dps){ st[m].dps=dps; st[m].t=dur; st[m].src=src||null; }
 else st[m].t=Math.max(st[m].t,dur);
}

/* 직선 위의 적을 앞에서부터 수집 */
function rayHits(x,y,ang,len,wide,hits){
 const cx=Math.cos(ang), cy=Math.sin(ang), out=[], n=G.enemies.length;
 for(let i=0;i<n;i++){
  const e=G.enemies[i];
  if(!e.alive) continue;
  if(e.air&&hits==='ground') continue;
  const dx=e.x-x, dy=e.y-y, proj=dx*cx+dy*cy;
  if(proj<-8||proj>len) continue;
  if(Math.abs(dx*(-cy)+dy*cx)>wide*.5+e.r*.6) continue;
  out.push({e:e,d:proj});
 }
 out.sort(function(a,b){ return a.d-b.d; });
 return out;
}
/* 부채꼴 안의 적 */
function coneHits(t,rng,ang,cone,hits){
 const r2=rng*rng, out=[], n=G.enemies.length;
 for(let i=0;i<n;i++){
  const e=G.enemies[i];
  if(!e.alive) continue;
  if(e.air&&hits==='ground') continue;
  if(d2(t.x,t.y,e.x,e.y)>r2) continue;
  let da=Math.atan2(e.y-t.y,e.x-t.x)-ang;
  while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;
  if(Math.abs(da)>cone) continue;
  out.push(e);
 }
 return out;
}
function splashAt(x,y,r,dmg,src,opt){
 const r2=r*r, n=G.enemies.length;
 for(let i=0;i<n;i++){
  const e=G.enemies[i];
  if(!e.alive) continue;
  if(e.air&&opt&&opt.groundOnly) continue;
  const dd=d2(x,y,e.x,e.y);
  if(dd>r2) continue;
  const f=1-Math.sqrt(dd)/r*.45;
  hurt(e,dmg*f,{src:src,silent:opt&&opt.silent});
  if(opt&&opt.stun&&e.alive) e.stun=Math.max(e.stun,opt.stun);
 }
}
function addPool(x,y,r,dps,dur,src){
 G.pools.push({x:x,y:y,r:r,dps:dps,life:dur,max:dur,src:src,perk:src&&src.lv===3});
}
function placeMine(t,s){
 if(!G.pathSamples||!G.pathSamples.length) return false;
 const r2=s.rng*s.rng, cand=[];
 for(let i=0;i<G.pathSamples.length;i++){
  const p=G.pathSamples[i];
  if(d2(t.x,t.y,p.x,p.y)>r2) continue;
  let near=false;
  for(let k=0;k<G.mines.length;k++){ if(d2(p.x,p.y,G.mines[k].x,G.mines[k].y)<900){ near=true; break; } }
  if(!near) cand.push(p);
 }
 if(!cand.length) return false;
 const p=cand[(Math.random()*cand.length)|0];
 G.mines.push({x:p.x,y:p.y,dmg:s.dmg,splash:s.splash,src:t,t:0,perk:s.perk});
 t.mines++;
 return true;
}

function fire(t){
 const s=tstat(t);
 if(t.D.hits==='none') return false;
 t.cc=(s.crit||0)+t.bc+AUG.crit;
 t.cm=(s.cmul||1.9)+t.bcm+AUG.critMul;

 if(t.id==='mine'){
  let live=0;
  for(let i=0;i<G.mines.length;i++) if(G.mines[i].src===t) live++;
  if(live>=s.cap) return false;
  if(!placeMine(t,s)) return false;
  SND.play('build',260);
  return true;
 }

 if(t.id==='flame'){
  const tg=findTarget(t,s);
  if(tg) aim(t,tg);
  const list=coneHits(t,s.rng,t.ang,s.cone,t.D.hits);
  if(!list.length) return false;
  G.fx.push({k:'cone',x:t.x,y:t.y,ang:t.ang,r:s.rng,c:s.cone,col:'#ff9a3c',life:.2,max:.2});
  for(let i=0;i<list.length;i++){
   const e=list[i];
   hurt(e,s.dmg,{src:t,silent:true});
   if(e.alive) poison(e,s.burn,s.bdur,s.perk?3:1,t);
  }
  t.recoil=1; SND.play('venom',140);
  return true;
 }

 if(t.id==='gravity'){
  const r2=s.rng*s.rng, n=G.enemies.length; let hit=0;
  for(let i=0;i<n;i++){
   const e=G.enemies[i];
   if(!e.alive||d2(t.x,t.y,e.x,e.y)>r2) continue;
   hit++;
   hurt(e,s.dmg,{src:t,silent:true});
   if(!e.alive) continue;
   if(e.D.boss&&!s.perk) continue;
   e.dist=Math.max(0,e.dist-s.pull*(s.perk?2:1));
   const p=e.air?airAt(e.dist):ptAt(e.dist);
   e.x=p.x; e.y=p.y;
   part(e.x,e.y,(t.x-e.x)*1.2,(t.y-e.y)*1.2,.3,2,'#b6a6ff');
  }
  if(!hit) return false;
  ring(t.x,t.y,s.rng,'#8f7bff',.42,2.5);
  t.recoil=1; SND.play('cryo',150);
  return true;
 }

 if(t.id==='prism'||t.id==='sonic'){
  const tg=findTarget(t,s); if(!tg) return false;
  aim(t,tg);
  const hits=rayHits(t.x,t.y,t.ang,s.rng,s.wide,t.D.hits);
  if(!hits.length) return false;
  const ex=t.x+Math.cos(t.ang)*s.rng, ey=t.y+Math.sin(t.ang)*s.rng;
  beam(t.x,t.y,ex,ey,t.id==='prism'?'#d7f6ff':'#a9e4ff',.28,t.id==='prism'?5:8);
  for(let i=0;i<hits.length;i++){
   const e=hits[i].e;
   hurt(e,s.dmg*Math.pow(s.fall||1,i),{src:t});
   if(!e.alive) continue;
   if(t.id==='sonic'){
    e.stun=Math.max(e.stun,s.stun*(s.perk?2:1));
    if(s.perk&&e.shield>0){ e.shield=0; e.shieldT=e.D.shield.delay; ring(e.x,e.y,e.r+10,'#ffe066',.3,2); }
   }
   burst(e.x,e.y,t.D.col,4,.9);
  }
  t.recoil=1; SND.play(t.id==='prism'?'rail':'arc',80);
  return true;
 }

 if(t.id==='scatter'){
  const tg=findTarget(t,s); if(!tg) return false;
  aim(t,tg);
  for(let i=0;i<s.pellets;i++){
   const a=t.ang+rnd(-s.spread,s.spread)*.5;
   G.shots.push({k:'pellet',x:t.x+Math.cos(t.ang)*12,y:t.y+Math.sin(t.ang)*12,ang:a,
    spd:rnd(430,520),dmg:s.dmg,src:t,col:t.D.col,life:s.rng/460,perk:s.perk,hits:t.D.hits});
  }
  t.recoil=1; SND.play('pulse',60);
  return true;
 }

 if(t.id==='missile'){
  const tg=findTarget(t,s); if(!tg) return false;
  aim(t,tg);
  for(let i=0;i<s.salvo;i++){
   const off=(i-(s.salvo-1)/2)*7;
   G.shots.push({k:'rocket',x:t.x+Math.cos(t.ang+Math.PI/2)*off,y:t.y+Math.sin(t.ang+Math.PI/2)*off,
    ang:t.ang+rnd(-.5,.5),spd:200,turn:5.5,dmg:s.dmg,splash:s.splash,airx:s.airx,
    tg:tg,src:t,col:t.D.col,life:2.6,delay:i*.09});
  }
  t.recoil=1; SND.play('mortar',110);
  return true;
 }

 if(t.id==='plasma'||t.id==='nuke'){
  const tg=findTarget(t,s); if(!tg) return false;
  aim(t,tg);
  const flight=Math.max(.34,Math.hypot(tg.x-t.x,tg.y-t.y)/(t.id==='nuke'?230:300));
  const eff=tg.spd*(tg.slowT>0?1-tg.slow:1)*(tg.freeze>0||tg.stun>0?0:1);
  const dst=Math.min((tg.air?G.path.airLen:G.path.total)-1,tg.dist+eff*flight);

 }

 if(t.id==='cryo'){
  const r2=s.rng*s.rng, cnt=G.enemies.length; let n=0;
  for(let i=0;i<cnt;i++){

 if(t.id==='arc'){

  t.recoil=1; SND.play('arc',75);

 }

 if(t.id==='rail'){
  const tg=findTarget(t,s); if(!tg) return false;
  aim(t,tg);
  const exec=s.perk&&!tg.D.boss&&tg.shield<=0&&tg.hp/tg.maxHp<=.12;
  beam(t.x+Math.cos(t.ang)*17,t.y+Math.sin(t.ang)*17,tg.x,tg.y,'#ffe38a',.3,3);

  else hurt(tg,s.dmg,{src:t,pen:.6});

 const tg=findTarget(t,s); if(!tg) return false;
 aim(t,tg);

 if(t.id==='mortar'){
  const flight=Math.max(.3,Math.hypot(tg.x-t.x,tg.y-t.y)/320);
  const eff=tg.spd*(tg.slowT>0?1-tg.slow:1)*(tg.freeze>0||tg.stun>0?0:1);
  const dst=Math.min((tg.air?G.path.airLen:G.path.total)-1,tg.dist+eff*flight);
  const dir=tg.air?airAt(dst):ptAt(dst);
  G.shots.push({k:'shell',sx:t.x,sy:t.y-11,x:t.x,y:t.y-11,ex:dir.x,ey:dir.y,tt:0,dur:flight,

 const twin=(t.id==='pulse'&&s.perk)?2:1;

 t.recoil=1; SND.play(t.id==='venom'?'venom':'pulse',t.id==='venom'?95:42);

function explode(p){
 const col=p.col||'#ff8a3d';
 boom(p.ex,p.ey,p.splash,col);
 G.shake=Math.max(G.shake,p.big?15:4.5);
 SND.play('boom',65);
 const ground=(p.src&&p.src.D.hits==='ground');
 splashAt(p.ex,p.ey,p.splash,p.dmg,p.src,{groundOnly:ground,stun:p.stun||(p.perk&&p.src&&p.src.id==='mortar'&&Math.random()<.3?.5:0)});
 if(p.pool) addPool(p.ex,p.ey,p.prad,p.pool,p.pdur,p.src);
 if(p.fallout) addPool(p.ex,p.ey,p.splash*.8,p.dmg*.22,6,p.src);
 const n=p.big?34:15;
 for(let i=0;i<n;i++){
  const a=Math.random()*TAU,v=rnd(40,p.big?330:190);
  part(p.ex,p.ey,Math.cos(a)*v,Math.sin(a)*v,rnd(.24,p.big?1:.6),rnd(2,p.big?6:4.2),i%3?col:'#ffe9c4');
 }
 if(p.big) ring(p.ex,p.ey,p.splash*1.35,'#ffd9a0',.6,4);
}

function updateShots(dt){
 for(let i=G.shots.length-1;i>=0;i--){
  const p=G.shots[i];
  if(p.k==='shell'){
   p.tt+=dt/p.dur;
   if(p.tt>=1){ explode(p); G.shots.splice(i,1); continue; }
   p.x=lerp(p.sx,p.ex,p.tt); p.y=lerp(p.sy,p.ey,p.tt);
   continue;
  }
  if(p.delay>0){ p.delay-=dt; continue; }
  p.life-=dt;
  if(p.k==='pellet'){
   p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
   const n=G.enemies.length;
   for(let j=0;j<n;j++){
    const e=G.enemies[j];
    if(!e.alive) continue;
    if(e.air&&p.hits==='ground') continue;
    const rr=e.r+4;
    if(d2(p.x,p.y,e.x,e.y)>rr*rr) continue;
    let dmg=p.dmg;
    if(p.perk&&d2(p.src.x,p.src.y,e.x,e.y)<(TILE*2)*(TILE*2)) dmg*=2;
    hurt(e,dmg,{src:p.src,silent:true});
    burst(p.x,p.y,p.col,2,.6);
    p.life=0; break;
   }
   if(p.life<=0||p.x<-40||p.x>W+40||p.y<-40||p.y>H+40) G.shots.splice(i,1);
   continue;
  }
  if(p.k==='rocket'){
   if(p.tg&&p.tg.alive){
    let want=Math.atan2(p.tg.y-p.y,p.tg.x-p.x), da=want-p.ang;
    while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;
    p.ang+=clamp(da,-p.turn*dt,p.turn*dt);
   }
   p.spd=Math.min(560,p.spd+620*dt);
   p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
   if(Math.random()<dt*40) part(p.x,p.y,rnd(-16,16),rnd(-16,16),.35,2.2,'#ffb98a');
   let boomIt=false;
   if(p.tg&&p.tg.alive){ const rr=p.tg.r+6; if(d2(p.x,p.y,p.tg.x,p.tg.y)<rr*rr) boomIt=true; }
   else if(p.life<=1.6) boomIt=true;
   if(boomIt){
    const mul=(p.tg&&p.tg.air)?p.airx:1;
    boom(p.x,p.y,p.splash,'#ff9f6a');
    splashAt(p.x,p.y,p.splash,p.dmg*mul,p.src,{});
    SND.play('boom',80);
    G.shots.splice(i,1); continue;
   }
   if(p.life<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50) G.shots.splice(i,1);
   continue;
  }
  if(p.tg&&p.tg.alive) p.ang=Math.atan2(p.tg.y-p.y,p.tg.x-p.x);
  p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
  if(p.k==='glob'&&Math.random()<dt*26) part(p.x,p.y,rnd(-14,14),rnd(-14,14),.32,2,'#7dff9b');
  if(p.tg&&p.tg.alive){
   const rr=p.tg.r+5;
   if(d2(p.x,p.y,p.tg.x,p.tg.y)<rr*rr){
    const tgt=p.tg;
    burst(p.x,p.y,p.col,4,.85);
    hurt(tgt,p.dmg,{src:p.src});
    if(p.dot&&tgt.alive) poison(tgt,p.dot,p.ddur,p.cap,p.src);
    G.shots.splice(i,1); continue;
   }
  }
  if(p.life<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50) G.shots.splice(i,1);
 }
}

/* 집속 광선 · 지속 조사 */
function updateBeam(t,dt){
 const s=tstat(t);
 t.cc=t.bc+AUG.crit; t.cm=1.9+t.bcm+AUG.critMul;
 const r2=s.rng*s.rng;
 if(t.lock&&(!t.lock.alive||d2(t.x,t.y,t.lock.x,t.lock.y)>r2)) t.lock=null;
 if(!t.lock){ t.lock=findTarget(t,s); t.lockT=0; }
 if(!t.lock){ t.lockT=Math.max(0,t.lockT-dt*2); return; }
 aim(t,t.lock);
 t.lockT=Math.min(s.rup,t.lockT+dt);
 const ramp=1+(s.ramp-1)*(t.lockT/s.rup);
 const full=t.lockT>=s.rup-.01;
 hurt(t.lock,s.dps*ramp*dt,{src:t,silent:true,nocrit:true,pen:(s.perk&&full)?1:0});
 t.recoil=.35+.3*Math.sin(G.time*40);
 if(Math.random()<dt*30) part(t.lock.x+rnd(-6,6),t.lock.y+rnd(-6,6),rnd(-30,30),rnd(-40,-10),.4,2.4,'#ff9fb0');
 if(Math.random()<dt*3) SND.play('venom',260);
}

function updatePools(dt){
 for(let i=G.pools.length-1;i>=0;i--){
  const p=G.pools[i];
  p.life-=dt;
  if(p.life<=0){ G.pools.splice(i,1); continue; }
  const r2=p.r*p.r, n=G.enemies.length;
  for(let j=0;j<n;j++){
   const e=G.enemies[j];
   if(!e.alive||d2(p.x,p.y,e.x,e.y)>r2) continue;
   let mul=1;
   if(p.perk){
    let over=0;
    for(let k=0;k<G.pools.length;k++){
     const q=G.pools[k];
     if(q!==p&&d2(q.x,q.y,e.x,e.y)<=q.r*q.r) over++;
    }
    if(over) mul=1.5;
   }
   hurt(e,p.dps*mul*dt,{src:p.src,silent:true,nocrit:true});
  }
  if(Math.random()<dt*24) part(p.x+rnd(-p.r,p.r)*.7,p.y+rnd(-p.r,p.r)*.7,rnd(-8,8),-rnd(10,32),.5,2.4,'#d9a6ff');
 }
}
function updateMines(dt){
 const list=G.mines.slice();
 for(let i=0;i<list.length;i++){
  const m=list[i];
  if(m.gone) continue;
  m.t+=dt;
  if(m.t<.35) continue;
  const n=G.enemies.length;
  for(let j=0;j<n;j++){
   const e=G.enemies[j];
   if(!e.alive||e.air) continue;
   const rr=e.r+12;
   if(d2(m.x,m.y,e.x,e.y)<rr*rr){ detonate(m); break; }
  }
 }
}
/* 폭발한 지뢰는 gone으로 표시하고 객체 기준으로 제거 — 연쇄 폭발 중 인덱스가 어긋나지 않게 */
function detonate(m){
 if(!m||m.gone) return;
 m.gone=true;
 const i=G.mines.indexOf(m);
 if(i>=0) G.mines.splice(i,1);
 boom(m.x,m.y,m.splash,'#ffb43d');
 G.shake=Math.max(G.shake,5);
 SND.play('boom',60);
 splashAt(m.x,m.y,m.splash,m.dmg,m.src,{groundOnly:true});
 for(let k=0;k<14;k++){ const a=Math.random()*TAU,v=rnd(50,210);
  part(m.x,m.y,Math.cos(a)*v,Math.sin(a)*v,rnd(.24,.6),rnd(2,4.4),k%3?'#ffb43d':'#ffe6b0'); }
 if(m.perk){
  const r=m.splash*1.15, r2=r*r, victims=[];
  for(let k=0;k<G.mines.length;k++){
   const o=G.mines[k];
   if(!o.gone&&d2(m.x,m.y,o.x,o.y)<r2) victims.push(o);
  }
  for(let k=0;k<victims.length;k++) detonate(victims[k]);
 }
}

/* ═══════════ 침공체 갱신 ═══════════ */
function updateEnemies(dt){
 let bosses=null;
 for(let i=0;i<G.enemies.length;i++){
  const e=G.enemies[i]; e.hasted=false;
  if(e.alive&&e.D.aura){ if(!bosses) bosses=[]; bosses.push(e); }
 }
 if(bosses) for(let b=0;b<bosses.length;b++){
  const B=bosses[b], r2=B.D.aura.rad*B.D.aura.rad;
  for(let i=0;i<G.enemies.length;i++){ const e=G.enemies[i];
   if(e.alive&&e!==B&&d2(B.x,B.y,e.x,e.y)<r2) e.hasted=true; }
 }

 for(let i=G.enemies.length-1;i>=0;i--){
  const e=G.enemies[i];
  if(!e.alive){ G.enemies.splice(i,1); continue; }
  e.age+=dt; e.wob+=dt*6.5;
  if(e.hitT>0) e.hitT-=dt;
  if(e.slowT>0){ e.slowT-=dt; if(e.slowT<=0) e.slow=0; }
  if(e.freeze>0) e.freeze-=dt;
  if(e.stun>0) e.stun-=dt;

  if(e.pois.length){
   let any=false;
   for(let k=e.pois.length-1;k>=0;k--){
    const q=e.pois[k]; q.t-=dt;
    if(q.dps>0){ any=true; hurt(e,q.dps*dt,{pure:true,silent:true,src:q.src}); }
    if(q.t<=0) e.pois.splice(k,1);
    if(!e.alive) break;
   }
   if(any&&Math.random()<dt*8) part(e.x+rnd(-6,6),e.y+rnd(-6,6),rnd(-9,9),-rnd(12,30),.5,2,'#7dff9b');
   if(!e.alive){ G.enemies.splice(i,1); continue; }
  }

  if(e.D.shield){
   if(e.shieldT>0) e.shieldT-=dt;
   else if(e.shield<e.shieldMax){
    const scale=e.shieldMax/e.D.shield.amt;
    e.shield=Math.min(e.shieldMax,e.shield+e.D.shield.regen*scale*dt);
   }
  }

  if(e.D.heal){
   e.healCd-=dt;
   if(e.healCd<=0){
    e.healCd=e.D.heal.cd;
    const r2=e.D.heal.rad*e.D.heal.rad, amt=e.D.heal.amt*hpScale(e.waveN); let n=0;
    for(let j=0;j<G.enemies.length;j++){
     const o=G.enemies[j];
     if(!o.alive||o===e||o.hp>=o.maxHp) continue;
     if(d2(e.x,e.y,o.x,o.y)>r2) continue;
     o.hp=Math.min(o.maxHp,o.hp+amt);
     beam(e.x,e.y,o.x,o.y,'#6effc4',.32,2);
     if(++n>=3) break;
    }
    if(n) ring(e.x,e.y,e.D.heal.rad,'#6effc4',.42,1.5);
   }
  }

  if(e.D.spawn){
   e.spawnCd-=dt;
   if(e.spawnCd<=0){
    e.spawnCd=e.D.spawn.cd;
    for(let k=0;k<e.D.spawn.n;k++){
     const s=makeEnemy(e.D.spawn.type,e.waveN,Math.max(0,e.dist-22-k*14));
     G.enemies.push(s);
    }
    ring(e.x,e.y,44,'#ff5b6e',.4,2.5);
   }
  }

  let sp=e.spd;
  if(e.slowT>0) sp*=(1-e.slow);
  if(e.hasted) sp*=e.D.aura?1:1.22;
  if(e.freeze>0||e.stun>0) sp=0;
  e.dist+=sp*dt;

  const len=e.air?G.path.airLen:G.path.total;
  e.prog=e.dist/len;
  if(e.dist>=len){ leak(e); G.enemies.splice(i,1); continue; }
  const p=e.air?airAt(e.dist):ptAt(e.dist);
  e.x=p.x; e.y=p.y; e.ang=p.ang;
 }
}

/* ═══════════ 웨이브 ═══════════ */
function startWave(){
 if(G.waveOn||G.scene!=='play') return;
 G.wave++;
 G.waveOn=true; G.waveT=0; G.queue=[];
 const def=waveDef(G.wave);
 const mul=G.chaos?chaosCount(G.wave):1;
 let boss=false;
 for(let i=0;i<def.length;i++){
  const g=def[i];
  if(g[0]==='boss') boss=true;
  const cnt=g[0]==='boss'?g[1]:Math.round(g[1]*mul);
  for(let k=0;k<cnt;k++) G.queue.push({t:g[0],at:g[3]+k*g[2]});
 }
 G.queue.sort((a,b)=>a.at-b.at);
 banner('WAVE '+G.wave, boss?'경보 · 파괴자 접근':(G.chaos?'아수라장':(G.endless?'무한 교전':'')));
 SND.play(boss?'bossin':'wave');
 SND.intensity=clamp(G.wave/22,0,1);
 feed('<b>웨이브 '+G.wave+'</b> 교전 개시'+(boss?' · 보스 등장':''),boss?'bad':'');
 syncUI();
}
function endWave(){
 G.waveOn=false;
 G.mines=[]; G.pools=[];
 let bonus=Math.round((22+G.wave*3.4)*(1+AUG.goldWave)*(G.chaos?1.5:1));
 /* 채굴기 생산 */
 let mined=0, repair=0, compound=0;
 for(let i=0;i<G.towers.length;i++){
  const t=G.towers[i], L=t.D.lv[t.lv];
  if(t.id==='mint'){ mined+=L.yield; if(t.lv===3) compound+=.03; }
  else if(t.id==='mender') repair+=L.rep;
 }
 const interest=Math.round(G.gold*(AUG.interest+compound));
 bonus+=mined+interest;
 G.gold+=bonus; G.earned+=bonus; flashGold();
 G.score+=Math.round(150*G.D.mult);
 say(G.path.core.x,G.path.core.y-48,'+'+bonus,'#ffc247',19);
 let msg='웨이브 '+G.wave+' 방어 성공 · <b>+'+bonus+'</b> 에너지';
 if(mined) msg+=' (채굴 '+mined+')';
 if(interest) msg+=' (이자 '+interest+')';
 feed(msg,'good');
 /* 수리 · 재생 */
 if(repair>0||AUG.regen>0){
  G.repBank=(G.repBank||0)+repair+AUG.regen;
  const over=hasMenderPerk()?5:0;
  const cap=G.maxLives+over;
  while(G.repBank>=1&&G.lives<cap){ G.repBank-=1; G.lives++; }
  if(G.lives>G.maxLives) G.maxLives=G.lives;
  if(repair+AUG.regen>0&&G.lives<cap) feed('코어 수리 진행 <b>'+Math.floor((G.repBank%1)*100)+'%</b>');
 }
 SND.intensity=.25;
 if(!G.endless&&!G.chaos&&G.wave>=LAST_WAVE){ finish(true); return; }
 if(G.chaos&&G.wave%10===0) banner('생존 '+G.wave+' 웨이브','아수라장 돌파');
 G.prepMax=G.chaos?14:12; G.prep=G.prepMax;
 syncUI();
 if(G.chaos&&(G.wave===1||(G.wave-1)%3===0)){ offerAugments(); return; }
}
function hasMenderPerk(){
 for(let i=0;i<G.towers.length;i++) if(G.towers[i].id==='mender'&&G.towers[i].lv===3) return true;
 return false;
}
function callWave(){
 if(G.scene!=='play'||G.waveOn) return;
 const b=Math.ceil(G.prep)*3;
 if(b>0){
  G.gold+=b; G.earned+=b; flashGold();
  say(G.path.core.x,G.path.core.y-30,'조기 호출 +'+b,'#5ef2a4',14);
  feed('조기 호출 보너스 <b>+'+b+'</b> 에너지','good');

function tryPlace(tx,ty){
 if(!G.buy) return;
 const D=TOWERS[G.buy], price=buildCost(G.buy);
 if(!buildable(tx,ty)){ SND.play('nope',140); return; }
 if(G.gold<price){ SND.play('nope',140); feed('에너지가 부족합니다 · <b>'+price+'</b> 필요','warn'); return; }
 G.gold-=price;
 const t=makeTower(G.buy,tx,ty);
 G.towers.push(t); G.occ[ty*COLS+tx]=t;
 refreshBuffs();
 ring(t.x,t.y,tstat(t).rng,D.col,.55,2);
 burst(t.x,t.y,D.col,13,1.2);

 if(G.tips===0){ G.tips=1; hintText('타워를 클릭하면 <b>강화</b>와 <b>타게팅</b>을 조정할 수 있습니다'); }

function upgrade(t){
 if(!t||t.lv>=3) return;
 const c=upCost(t);
 if(G.gold<c){ SND.play('nope',140); feed('강화 에너지 부족 · <b>'+c+'</b> 필요','warn'); return; }

 ring(t.x,t.y,tstat(t).rng,t.D.col,.6,2.5);
 burst(t.x,t.y,t.D.col,17,1.4);

function sellTower(t){

 const v=sellValue(t);
 G.gold+=v; flashGold();
 for(let i=G.mines.length-1;i>=0;i--) if(G.mines[i].src===t) G.mines.splice(i,1);
 G.occ[t.ty*COLS+t.tx]=null;
 const i=G.towers.indexOf(t); if(i>=0) G.towers.splice(i,1);
 refreshBuffs();
 burst(t.x,t.y,'#8095bd',15,1.2);

/* ═══════════ 진행 ═══════════ */
function step(dt){
 G.time+=dt;
 if(G.shake>0) G.shake=Math.max(0,G.shake-dt*40);
 if(G.flash>0) G.flash=Math.max(0,G.flash-dt*2.4);

 for(let i=G.fx.length-1;i>=0;i--){ const f=G.fx[i]; f.life-=dt; if(f.life<=0) G.fx.splice(i,1); }
 for(let i=G.parts.length-1;i>=0;i--){
  const p=G.parts[i]; p.life-=dt;
  if(p.life<=0){ G.parts.splice(i,1); continue; }
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt;
  const k=Math.pow(p.drag,dt*60); p.vx*=k; p.vy*=k;
 }
 for(let i=G.texts.length-1;i>=0;i--){
  const q=G.texts[i]; q.life-=dt;
  if(q.life<=0){ G.texts.splice(i,1); continue; }
  q.y+=q.vy*dt; q.x+=q.vx*dt; q.vy*=Math.pow(.945,dt*60);
 }
 if(G.scene!=='play') return;

 refreshBuffs();

 if(G.waveOn){
  G.waveT+=dt;
  while(G.queue.length&&G.queue[0].at<=G.waveT){
   const q=G.queue.shift();
   G.enemies.push(makeEnemy(q.t,G.wave,0));
  }
  if(!G.queue.length&&!G.enemies.length) endWave();
 } else if(G.prep>0){
  G.prep-=dt;
  if(G.prep<=0){ G.prep=0; if(G.auto) startWave(); }
 }

 applyAuras();
 updateEnemies(dt);

 for(let i=0;i<G.towers.length;i++){
  const t=G.towers[i];
  if(t.recoil>0) t.recoil=Math.max(0,t.recoil-dt*6.5);
  t.spin+=dt;
  if(t.D.hits==='none') continue;
  if(t.id==='beam'){ updateBeam(t,dt); continue; }
  t.cd-=dt;
  if(t.cd<=0){
   if(fire(t)){ const s=tstat(t); t.cd=1/Math.max(.05,s.rate); }
   else t.cd=.09;
  }
 }
 updateShots(dt);
 updatePools(dt);
 updateMines(dt);
}

/* ═══════════ 렌더링 ═══════════ */
const cv=$('#game'), cx=cv.getContext('2d');
let BG=null, VIG=null;

function poly(g,x,y,r,n,rot){
 g.beginPath();
 for(let i=0;i<n;i++){
  const a=rot+i/n*TAU, px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
  if(i) g.lineTo(px,py); else g.moveTo(px,py);
 }
 g.closePath();
}
function pathLine(g){
 const p=G.path.pts;
 g.beginPath(); g.moveTo(p[0].x,p[0].y);
 for(let i=1;i<p.length;i++) g.lineTo(p[i].x,p[i].y);
}
function shard(g,tx,ty){
 const x=(tx+.5)*TILE, y=(ty+.5)*TILE;
 g.save(); g.translate(x,y);
 for(let i=0;i<3;i++){
  const a=i*2.1+tx*.7+ty*.4, r=11+((i*7+tx*3+ty*5)%5)*1.7;
  const ox=Math.cos(a)*7, oy=Math.sin(a)*6;
  g.fillStyle='rgba(23,38,72,.95)'; g.strokeStyle='rgba(125,170,255,.26)'; g.lineWidth=1;
  g.beginPath();
  g.moveTo(ox,oy-r); g.lineTo(ox+r*.55,oy); g.lineTo(ox,oy+r*.72); g.lineTo(ox-r*.55,oy);
  g.closePath(); g.fill(); g.stroke();
 }
 g.restore();
}
function buildBG(){
 const c=document.createElement('canvas'); c.width=W; c.height=H;
 const g=c.getContext('2d');
 const grad=g.createLinearGradient(0,0,W,H);
 grad.addColorStop(0,'#070c1c'); grad.addColorStop(.55,'#0a1024'); grad.addColorStop(1,'#0c0f22');
 g.fillStyle=grad; g.fillRect(0,0,W,H);
 const blobs=[[W*.18,H*.22,340,'rgba(47,120,255,.13)'],[W*.84,H*.78,380,'rgba(160,60,255,.11)'],
              [W*.56,H*.1,280,'rgba(0,200,255,.07)'],[W*.3,H*.9,300,'rgba(255,60,120,.05)']];
 for(let i=0;i<blobs.length;i++){
  const b=blobs[i], rg=g.createRadialGradient(b[0],b[1],0,b[0],b[1],b[2]);
  rg.addColorStop(0,b[3]); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg; g.fillRect(0,0,W,H);
 }
 for(let i=0;i<130;i++){
  const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.1+.3;
  g.fillStyle='rgba(200,225,255,'+(.06+Math.random()*.22)+')';
  g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
 }
 g.strokeStyle='rgba(120,170,255,.05)'; g.lineWidth=1; g.beginPath();
 for(let x=0;x<=COLS;x++){ g.moveTo(x*TILE+.5,0); g.lineTo(x*TILE+.5,H); }
 for(let y=0;y<=ROWS;y++){ g.moveTo(0,y*TILE+.5); g.lineTo(W,y*TILE+.5); }
 g.stroke();
 g.fillStyle='rgba(125,170,255,.13)';
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
  if(G.path.tiles.has(x+','+y)||G.blocked.has(x+','+y)) continue;
  g.fillRect(x*TILE+TILE/2-1,y*TILE+TILE/2-1,2,2);
 }
 for(let i=0;i<G.map.blocks.length;i++) shard(g,G.map.blocks[i][0],G.map.blocks[i][1]);
 g.lineCap='round'; g.lineJoin='round';
 pathLine(g); g.strokeStyle='rgba(47,224,255,.07)'; g.lineWidth=40; g.stroke();
 pathLine(g); g.strokeStyle='rgba(47,224,255,.22)'; g.lineWidth=30; g.stroke();
 pathLine(g); g.strokeStyle='#0a1226'; g.lineWidth=26.5; g.stroke();
 g.save(); g.globalAlpha=.5;
 pathLine(g); g.strokeStyle='rgba(60,110,190,.35)'; g.lineWidth=1; g.setLineDash([2,9]); g.stroke();
 g.restore();
 return c;
}
function buildVIG(){

function drawFlow(g){

function drawCore(g){

 g.fillStyle=rg; g.beginPath(); g.arc(0,0,56,0,TAU); g.fill();

  poly(g,0,0,25+i*9,6,0); g.stroke(); g.restore();
 }
 g.globalAlpha=1;

 g.save(); g.rotate(t*.35); g.scale(pu,pu);
 g.fillStyle=col;
 if(!G.lowfx){ g.shadowColor=col; g.shadowBlur=24; }
 poly(g,0,0,15,6,0); g.fill();
 g.shadowBlur=0;
 g.fillStyle='rgba(255,255,255,.9)'; poly(g,0,0,6.5,6,Math.PI/6); g.fill();

function drawShape(g,e,col){
 const r=e.r, t=G.time, s=e.D.shape;
 if(s==='square'){
  g.rotate(t*1.3+e.wob*.08); poly(g,0,0,r,4,0); g.fill(); g.stroke();
  g.fillStyle=col; poly(g,0,0,r*.4,4,Math.PI/4); g.fill();
 } else if(s==='tri'){
  g.rotate(e.ang);
  g.beginPath(); g.moveTo(r*1.3,0); g.lineTo(-r*.8,r*.85); g.lineTo(-r*.3,0); g.lineTo(-r*.8,-r*.85);
  g.closePath(); g.fill(); g.stroke();
 } else if(s==='hex'){
  g.rotate(t*.45);
  poly(g,0,0,r,6,0); g.fill(); g.stroke();
  g.save(); g.globalAlpha=.5; g.lineWidth=3.4; poly(g,0,0,r*.72,6,Math.PI/6); g.stroke(); g.restore();
  g.fillStyle=col; poly(g,0,0,r*.3,6,0); g.fill();
 } else if(s==='wing'){
  g.rotate(e.ang);
  const f=Math.sin(t*13+e.wob)*.45;
  g.beginPath(); g.moveTo(0,0); g.lineTo(-r*.95,-r*(1.05+f)); g.lineTo(-r*.15,-r*.25); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(0,0); g.lineTo(-r*.95, r*(1.05+f)); g.lineTo(-r*.15, r*.25); g.closePath(); g.fill(); g.stroke();
  poly(g,0,0,r*.6,4,0); g.fill(); g.stroke();
 } else if(s==='orb'){
  g.beginPath(); g.arc(0,0,r,0,TAU); g.fill(); g.stroke();
  g.save(); g.rotate(t*2.1); g.globalAlpha=.75; g.lineWidth=2;
  for(let i=0;i<3;i++){ g.beginPath(); g.arc(0,0,r*.58,i/3*TAU,i/3*TAU+.95); g.stroke(); }
  g.restore();
 } else if(s==='plus'){
  g.rotate(t*.85);
  const a=r*.4;
  g.beginPath();
  g.moveTo(-a,-r); g.lineTo(a,-r); g.lineTo(a,-a); g.lineTo(r,-a); g.lineTo(r,a); g.lineTo(a,a);
  g.lineTo(a,r); g.lineTo(-a,r); g.lineTo(-a,a); g.lineTo(-r,a); g.lineTo(-r,-a); g.lineTo(-a,-a);
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle=col; g.beginPath(); g.arc(0,0,r*.28,0,TAU); g.fill();
 } else if(s==='oct'){
  g.rotate(t*.38); poly(g,0,0,r,8,Math.PI/8); g.fill(); g.stroke();
  g.fillStyle=col; poly(g,0,0,r*.33,8,0); g.fill();
 } else if(s==='star'){
  g.globalAlpha=.55+Math.sin(t*8+e.wob)*.28;
  g.rotate(t*1.05);
  g.beginPath();
  for(let i=0;i<10;i++){
   const rr=i%2?r*.44:r, a=i/10*TAU, px=Math.cos(a)*rr, py=Math.sin(a)*rr;
   if(i) g.lineTo(px,py); else g.moveTo(px,py);
  }
  g.closePath(); g.fill(); g.stroke(); g.globalAlpha=1;
 } else if(s==='boss'){
  g.save(); g.rotate(-t*.55); g.globalAlpha=.45; g.lineWidth=2.5; poly(g,0,0,r*1.4,3,0); g.stroke(); g.restore();
  g.save(); g.rotate(t*.85); g.globalAlpha=.55; g.lineWidth=2; poly(g,0,0,r*1.16,6,0); g.stroke(); g.restore();
  g.lineWidth=3; poly(g,0,0,r,8,Math.PI/8); g.fill(); g.stroke();
  g.save(); g.rotate(t*1.7); g.fillStyle=col; poly(g,0,0,r*.44,3,0); g.fill(); g.restore();
 }
}
function drawEnemies(g){
 const es=G.enemies;
 for(let i=0;i<es.length;i++){
  const e=es[i];
  if(!e.alive) continue;
  g.save(); g.translate(e.x,e.y);
  if(e.air){
   g.save(); g.globalAlpha=.3; g.fillStyle='#000';

  }
  const col=e.hitT>0?'#ffffff':e.col;

  }

   g.globalAlpha=.9; g.strokeStyle='#ffffff'; g.lineWidth=1.3; g.stroke(); g.globalAlpha=1;
  } else if(e.slowT>0){
   g.globalAlpha=.55; g.strokeStyle='#9fd8ff'; g.lineWidth=1.4;
   g.beginPath(); g.arc(0,0,e.r+4,G.time*2,G.time*2+2.1); g.stroke();
   g.beginPath(); g.arc(0,0,e.r+4,G.time*2+Math.PI,G.time*2+Math.PI+2.1); g.stroke();
   g.globalAlpha=1;
  }
  if(e.stun>0){
   g.fillStyle='#ffe066';

    const a=G.time*7+k/3*TAU;
    g.beginPath(); g.arc(Math.cos(a)*(e.r+7),Math.sin(a)*(e.r+7)*.5-e.r-2,1.9,0,TAU); g.fill();
   }

   g.fillRect(x,y,w*f,h);
   if(e.shieldMax>0&&e.shield>0){ g.fillStyle='#ffe066'; g.fillRect(x,y-3.5,w*clamp(e.shield/e.shieldMax,0,1),2); }
  }
 }
}

function drawFx(g){
 for(let i=0;i<G.fx.length;i++){
  const f=G.fx[i], k=1-f.life/f.max;
  g.save();
  if(f.k==='ring'){
   g.globalAlpha=(1-k)*.85; g.strokeStyle=f.col; g.lineWidth=f.w;
   if(!G.lowfx){ g.shadowColor=f.col; g.shadowBlur=12; }
   g.beginPath(); g.arc(f.x,f.y,f.r*(.25+k*.78),0,TAU); g.stroke();
  } else if(f.k==='boom'){
   const r=f.r*(.35+k*.95); g.globalAlpha=1-k;
   const rg=g.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
   rg.addColorStop(0,'rgba(255,244,214,.95)'); rg.addColorStop(.45,f.col); rg.addColorStop(1,'rgba(255,90,0,0)');
   g.fillStyle=rg; g.beginPath(); g.arc(f.x,f.y,r,0,TAU); g.fill();
  } else if(f.k==='bolt'){
   g.globalAlpha=1-k; g.lineCap='round';
   if(!G.lowfx){ g.shadowColor=f.col; g.shadowBlur=15; }
   for(let pass=0;pass<2;pass++){
    g.strokeStyle=pass?'rgba(255,255,255,.92)':f.col;
    g.lineWidth=pass?1.2:2.8;
    g.beginPath();
    for(let j=0;j<f.pts.length-1;j++){
     const a=f.pts[j], b=f.pts[j+1];
     g.moveTo(a.x,a.y);
     for(let s=1;s<=3;s++){
      const tt=s/3, jx=s<3?rnd(-6,6):0, jy=s<3?rnd(-6,6):0;
      g.lineTo(lerp(a.x,b.x,tt)+jx, lerp(a.y,b.y,tt)+jy);
     }
    }
    g.stroke();
   }
  } else if(f.k==='beam'){
   g.globalAlpha=1-k; g.strokeStyle=f.col; g.lineWidth=Math.max(.5,f.w*(1-k*.65)); g.lineCap='round';
   if(!G.lowfx){ g.shadowColor=f.col; g.shadowBlur=15; }
   g.beginPath(); g.moveTo(f.x1,f.y1); g.lineTo(f.x2,f.y2); g.stroke();
  } else if(f.k==='cone'){
   g.globalAlpha=(1-k)*.5;
   const rg=g.createRadialGradient(f.x,f.y,4,f.x,f.y,f.r);
   rg.addColorStop(0,'rgba(255,240,190,.95)'); rg.addColorStop(.55,f.col); rg.addColorStop(1,'rgba(255,80,0,0)');
   g.fillStyle=rg;
   g.beginPath(); g.moveTo(f.x,f.y);
   g.arc(f.x,f.y,f.r*(.7+k*.35),f.ang-f.c,f.ang+f.c); g.closePath(); g.fill();
  }
  g.restore();
 }
}

/* ═══════════ DPS 요약 ═══════════ */
function dpsOf(id,s,lv){
 if(id==='amp'||id==='chrono'||id==='radar'||id==='curse'||id==='mint'||id==='mender') return 0;
 if(id==='beam') return s.dps*(1+s.ramp)/2;
 if(id==='pulse') return s.dmg*s.rate*(lv===3?2:1);
 if(id==='scatter') return s.dmg*s.pellets*s.rate;
 if(id==='missile') return s.dmg*s.salvo*s.rate;
 if(id==='arc'){ const f=lv===3?.9:.78; let m=0; for(let i=0;i<s.chain;i++) m+=Math.pow(f,i); return s.dmg*s.rate*m; }
 if(id==='rail') return s.dmg*s.rate*(1+s.crit*(s.cmul-1));
 if(id==='venom') return s.dmg*s.rate+s.dot*(lv===3?2:1);
 if(id==='flame') return s.dmg*s.rate+s.burn*(lv===3?3:1);
 if(id==='plasma') return s.dmg*s.rate+s.pool;
 return s.dmg*s.rate;
}

 const s=tstat(t||{D:D,lv:0,bd:0,br:0,bg:0,bc:0,bcm:0});

 const delta=function(a,b,suf,pct){
  if(!nx||b===undefined||b===null||a===b) return '';

 };

 let rows='';
 if(D.hits==='none'){
  const L=s.raw;
  if(id==='amp'){
   rows+=statRow('위력 증폭','+'+Math.round(L.ad*100)+'%',nx?' ▲'+Math.round((nx.ad-L.ad)*100)+'%':'');
   rows+=statRow('연사 증폭','+'+Math.round(L.ar*100)+'%',nx?' ▲'+Math.round((nx.ar-L.ar)*100)+'%':'');
  } else if(id==='chrono'){
   rows+=statRow('연사 증폭','+'+Math.round(L.ar*100)+'%',nx?' ▲'+Math.round((nx.ar-L.ar)*100)+'%':'');
  } else if(id==='radar'){
   rows+=statRow('치명타 부여','+'+Math.round(L.ac*100)+'%',nx?' ▲'+Math.round((nx.ac-L.ac)*100)+'%':'');
   rows+=statRow('사거리 증폭','+'+Math.round(L.abg*100)+'%',nx?' ▲'+Math.round((nx.abg-L.abg)*100)+'%':'');
  } else if(id==='curse'){
   rows+=statRow('방어력 감소','-'+L.shred,nx?' ▲'+(nx.shred-L.shred):'');
   rows+=statRow('받는 피해','+'+Math.round(L.vuln*100)+'%',nx?' ▲'+Math.round((nx.vuln-L.vuln)*100)+'%':'');
  } else if(id==='mint'){
   rows+=statRow('웨이브 생산',L.yield+' 에너지',nx?' ▲'+(nx.yield-L.yield):'');
   rows+=statRow('회수까지',Math.ceil((t?t.spent:D.cost)/L.yield)+' 웨이브','');
  } else if(id==='mender'){
   rows+=statRow('수리 속도',Math.round(L.rep*100)/100+' / 웨이브',nx?' ▲'+Math.round((nx.rep-L.rep)*100)/100:'');
   rows+=statRow('내구도 1당',Math.ceil(1/L.rep)+' 웨이브','');
  }
  if(L.rng) rows+=statRow('영향 반경',tiles(s.rng),nx?' ▲'+tiles(nx.rng-L.rng):'');
  if(t&&L.rng){
   let n=0; const r2=s.rng*s.rng;
   for(let i=0;i<G.towers.length;i++){ const o=G.towers[i];
    if(o!==t&&o.D.hits!=='none'&&d2(t.x,t.y,o.x,o.y)<=r2) n++; }
   rows+=statRow('연결된 방어탑',n+'기','');
  }
 } else {
  if(id==='beam'){
   rows+=statRow('기본 출력',Math.round(s.dps)+'/초',nx?delta(s.raw.dps,nx.dps):'');
   rows+=statRow('최대 출력',Math.round(s.dps*s.ramp)+'/초','');

   rows+=statRow(id==='mine'?'설치 속도':'연사',(Math.round(s.rate*100)/100)+'/초',nx?delta(s.raw.rate,nx.rate):'');
  }

  if(s.pool) rows+=statRow('장판',s.pool+'/초 · '+s.pdur+'초','');
  if(s.cap) rows+=statRow('최대 매설',s.cap+'개',nx&&nx.cap>s.cap?' ▲'+(nx.cap-s.cap):'');

  if(s.burn) rows+=statRow('화상',s.burn+'/초 · '+s.bdur+'초','');

   c.dataset.price=String(price);

  }

function miniMap(c,map){
 const g=c.getContext('2d'), s=c.width/COLS;
 c.height=Math.round(s*ROWS);
 g.fillStyle='rgba(8,13,28,.95)'; g.fillRect(0,0,c.width,c.height);
 g.strokeStyle='rgba(120,170,255,.09)'; g.lineWidth=1; g.beginPath();
 for(let x=0;x<=COLS;x+=2){ g.moveTo(x*s,0); g.lineTo(x*s,c.height); }
 for(let y=0;y<=ROWS;y+=2){ g.moveTo(0,y*s); g.lineTo(c.width,y*s); }
 g.stroke();
 g.lineCap='round'; g.lineJoin='round';
 g.beginPath();
 for(let i=0;i<map.wp.length;i++){
  const x=(map.wp[i][0]+.5)*s, y=(map.wp[i][1]+.5)*s;
  if(i) g.lineTo(x,y); else g.moveTo(x,y);
 }
 g.strokeStyle='rgba(47,224,255,.22)'; g.lineWidth=Math.max(3,s*.85); g.stroke();
 g.strokeStyle='rgba(120,235,255,.85)'; g.lineWidth=Math.max(1,s*.3); g.stroke();
 const f=map.wp[0], l=map.wp[map.wp.length-1];
 g.fillStyle='#ff4d6d'; g.beginPath(); g.arc((f[0]+.5)*s,(f[1]+.5)*s,s*1.2,0,TAU); g.fill();
 g.fillStyle='#2fe0ff'; g.beginPath(); g.arc((l[0]+.5)*s,(l[1]+.5)*s,s*1.5,0,TAU); g.fill();
}
function mapInfo(m){
 const p=buildPath(m);
 const free=COLS*ROWS-p.tiles.size-m.blocks.length;
 return {tiles:p.tiles.size,free:free,len:Math.round(p.total/TILE)};
}
function findMap(id){

 return null;
}
function applyMap(m){

 G.blocked=new Set();

/* ═══════════ 루프 ═══════════ */
const FIX=1/60;
let lastT=0, acc=0, fpsA=0, fpsN=0;
function loop(ts){
 requestAnimationFrame(loop);
 if(!lastT){ lastT=ts; return; }
 let dt=(ts-lastT)/1000; lastT=ts;
 if(dt>.25) dt=.25;
 fpsA+=dt; fpsN++;
 if(fpsA>=1.5){ G.lowfx=(fpsN/fpsA)<44; fpsA=0; fpsN=0; }
 const frozen=(G.scene==='play'&&G.paused);
 acc+=dt;
 let guard=0;
 while(acc>=FIX&&guard++<6){
  acc-=FIX;
  if(frozen) continue;
  const n=(G.scene==='play')?G.speed:1;
  for(let i=0;i<n;i++) step(FIX);
 }
 if(G.path) render();
 if(G.scene!=='menu') syncFast(false);
}

 $('#b-mus').classList.toggle('on',SND.musOn);

 cv.addEventListener('pointermove',function(ev){
  const p=canvasPos(ev);
  G.mouse.x=p.x; G.mouse.y=p.y; G.mouse.in=true;
  G.hover.x=Math.floor(p.x/TILE); G.hover.y=Math.floor(p.y/TILE);
 });
 cv.addEventListener('pointerleave',function(){ G.mouse.in=false; });
 cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
 cv.addEventListener('pointerdown',function(ev){
  ev.preventDefault();
  SND.init(); SND.resume();
  if(G.scene!=='play'||G.paused) return;
  const p=canvasPos(ev);
  const tx=Math.floor(p.x/TILE), ty=Math.floor(p.y/TILE);
  G.hover.x=tx; G.hover.y=ty; G.mouse.in=true; G.mouse.x=p.x; G.mouse.y=p.y;
  if(ev.button===2){ G.buy=null; G.sel=null; syncUI(); return; }
  const occ=(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS)?G.occ[ty*COLS+tx]:null;
  if(G.buy){
   if(occ){ G.sel=occ; G.buy=null; syncUI(); }
   else tryPlace(tx,ty);
   return;
  }
  G.sel=(occ&&G.sel!==occ)?occ:null;
  syncUI();
 });
 E.modes.addEventListener('click',function(ev){
  const b=ev.target.closest('[data-mode]');
  if(!b||!G.sel) return;
  G.sel.mode=b.dataset.mode;
  syncUI();
 });
 E.up.addEventListener('click',function(){ if(G.sel) upgrade(G.sel); });
 E.sell.addEventListener('click',function(){ if(G.sel) sellTower(G.sel); });
 E.call.addEventListener('click',function(){ SND.init(); SND.resume(); callWave(); });
 E.auto.addEventListener('click',function(){
  G.auto=!G.auto; E.auto.classList.toggle('on',G.auto); DB.setOpt('auto',G.auto);
  feed('웨이브 자동 시작 <b>'+(G.auto?'켜짐':'꺼짐')+'</b>');
 });
 E.pause.addEventListener('click',togglePause);
 $('#b-quit').addEventListener('click',openMenu);
 $('#b-sfx').addEventListener('click',function(){
  SND.init(); SND.on=!SND.on; this.classList.toggle('on',SND.on); DB.setOpt('sfx',SND.on);
  if(SND.on) SND.play('build');
 });
 $('#b-mus').addEventListener('click',function(){
  SND.init(); SND.resume();
  SND.setMusic(!SND.musOn); this.classList.toggle('on',SND.musOn); DB.setOpt('mus',SND.musOn);
  if(SND.musOn&&G.scene==='play') SND.startMusic();
 });
 const sp=document.querySelectorAll('[data-speed]');
 for(let i=0;i<sp.length;i++) sp[i].addEventListener('click',function(){ setSpeed(+this.dataset.speed); });

 window.addEventListener('keydown',function(ev){
  const c=ev.code;
  if(G.scene!=='play'){
   if(c==='Enter'&&!E.veil.classList.contains('hide')){
    const g=E.sheet.querySelector('#m-go')||E.sheet.querySelector('#e-again');
    if(g) g.click();
   }
   return;
  }
  if(c.indexOf('Digit')===0){
   const n=+c.slice(5), ids=TCATS[G.tab].ids;
   if(n>=1&&n<=ids.length){ selectBuy(ids[n-1]); ev.preventDefault(); }
  }
  else if(c==='Tab'){ ev.preventDefault(); G.tab=(G.tab+1)%TCATS.length; buildTabs(); buildShop(); syncUI(); }
  else if(c==='Space'){ ev.preventDefault(); SND.init(); SND.resume(); callWave(); }
  else if(c==='KeyP'){ togglePause(); }
  else if(c==='Escape'){ G.buy=null; G.sel=null; syncUI(); }
  else if(c==='KeyU'){ if(G.sel) upgrade(G.sel); }
  else if(c==='KeyX'){ if(G.sel) sellTower(G.sel); }
  else if(c==='BracketLeft'){ setSpeed(Math.max(1,G.speed-1)); }
  else if(c==='BracketRight'){ setSpeed(Math.min(3,G.speed+1)); }
 });
 window.addEventListener('blur',function(){ if(G.scene==='play'&&!G.paused) togglePause(); });

 showMenu(false);
 syncUI();
 requestAnimationFrame(loop);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
