function drawParts(g){
 if(!G.parts.length) return;
 g.save(); g.globalCompositeOperation='lighter';
 const lo=G.lowfx;
 for(let i=0;i<G.parts.length;i++){
  const p=G.parts[i], a=clamp(p.life/p.max,0,1), r=p.size*a+.4;
  g.globalAlpha=a*.9; g.fillStyle=p.col;
  /* 작은 입자나 저사양 모드에서는 원 대신 사각형 — 경로를 만들지 않아 훨씬 싸다 */
  if(lo||r<1.6) g.fillRect(p.x-r,p.y-r,r*2,r*2);
  else { g.beginPath(); g.arc(p.x,p.y,r,0,TAU); g.fill(); }
 }
 g.restore();
}
function drawTexts(g){
 g.save(); g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round';
 let sz=-1;
 for(let i=0;i<G.texts.length;i++){
  const q=G.texts[i], a=clamp(q.life/q.max,0,1);
  g.globalAlpha=a<.35?a/.35:1;
  if(q.size!==sz){ sz=q.size; g.font='700 '+sz+'px Orbitron, sans-serif'; }
  g.lineWidth=3.4; g.strokeStyle='rgba(2,5,12,.8)'; g.strokeText(q.s,q.x,q.y);
  g.fillStyle=q.col; g.fillText(q.s,q.x,q.y);
 }
 g.restore();
}
function drawGhost(g){
 if(!G.buy||!G.mouse.in) return;
 const tx=G.hover.x, ty=G.hover.y;
 if(tx<0||ty<0||tx>=COLS||ty>=ROWS) return;
 const D=TOWERS[G.buy], ok=buildable(tx,ty)&&G.gold>=D.cost;
 const x=(tx+.5)*TILE, y=(ty+.5)*TILE, col=ok?D.col:'#ff4d6d', r=D.lv[0].rng;
 g.save();
 g.globalAlpha=.09; g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
 g.globalAlpha=.6; g.strokeStyle=col; g.lineWidth=1.6;
 g.setLineDash([7,7]); g.lineDashOffset=-G.time*26;
 g.beginPath(); g.arc(x,y,r,0,TAU); g.stroke(); g.setLineDash([]);
 g.globalAlpha=1;
 g.fillStyle=ok?'rgba(47,224,255,.14)':'rgba(255,77,109,.2)';
 g.fillRect(tx*TILE+2,ty*TILE+2,TILE-4,TILE-4);
 g.strokeStyle=col; g.lineWidth=1.6; g.strokeRect(tx*TILE+2.5,ty*TILE+2.5,TILE-5,TILE-5);
 g.globalAlpha=.75;
 towerArt(g,G.buy,0,x,y,-Math.PI/2,0,G.time);
 g.restore();
}
function drawSel(g){
 const t=G.sel; if(!t) return;
 const s=tstat(t);
 g.save();
 g.globalAlpha=.08; g.fillStyle=t.D.col;
 g.beginPath(); g.arc(t.x,t.y,s.rng,0,TAU); g.fill();
 g.globalAlpha=.72; g.strokeStyle=t.D.col; g.lineWidth=1.7;
 g.setLineDash([8,8]); g.lineDashOffset=-G.time*26;
 g.beginPath(); g.arc(t.x,t.y,s.rng,0,TAU); g.stroke(); g.setLineDash([]);
 g.globalAlpha=.95; g.strokeStyle='#ffffff'; g.lineWidth=1.5;
 g.strokeRect(t.tx*TILE+2.5,t.ty*TILE+2.5,TILE-5,TILE-5);
 if(t.id==='amp'){
  const L=t.D.lv[t.lv], r2=L.rng*L.rng;
  g.strokeStyle='rgba(255,95,162,.55)'; g.lineWidth=1.3; g.setLineDash([4,5]);
  for(let i=0;i<G.towers.length;i++){

   if(d2(t.x,t.y,o.x,o.y)<=r2){ g.beginPath(); g.moveTo(t.x,t.y); g.lineTo(o.x,o.y); g.stroke(); }
  }
  g.setLineDash([]);
 }

}
function drawBossBar(g){
 let b=null,n=0;
 for(let i=0;i<G.enemies.length;i++){
  const e=G.enemies[i];
  if(e.alive&&e.D.boss){ n++; if(!b||e.hp>b.hp) b=e; }
 }
 if(!b) return;
 const w=440,h=9,x=(W-w)/2,y=16;
 g.save();
 g.fillStyle='rgba(4,8,18,.82)'; g.fillRect(x-3,y-3,w+6,h+6);
 g.strokeStyle='rgba(255,77,109,.55)'; g.lineWidth=1; g.strokeRect(x-3.5,y-3.5,w+7,h+7);
 const gr=g.createLinearGradient(x,0,x+w,0);
 gr.addColorStop(0,'#ff4d6d'); gr.addColorStop(1,'#ff9a3c');
 g.fillStyle=gr; g.fillRect(x,y,w*clamp(b.hp/b.maxHp,0,1),h);
 g.font='700 11px Orbitron, sans-serif'; g.textAlign='center'; g.fillStyle='#ffd7dd';
 g.fillText('파괴자'+(n>1?' ×'+n:'')+'  '+fmt(b.hp)+' / '+fmt(b.maxHp), W/2, y+h+13);
 g.restore();
}

}

/* ═══════════ DPS 요약 ═══════════ */
function dpsOf(id,s,lv){
 if(TOWERS[id].hits==='none') return 0;
 if(id==='blade') return s.dps;
 if(id==='ricochet'){ let m=0; for(let i=0;i<=s.bounce;i++) m+=Math.pow(s.fall,i); return s.dmg*s.rate*m; }
 if(id==='gatling') return s.dmg*s.rate*(1+(s.spin||0));
 if(id==='swarmpod') return s.dmg*s.salvo*s.rate;
 if(id==='cluster') return (s.dmg+s.frag*s.fdmg*.4)*s.rate;
 if(id==='barrage') return s.dmg*s.shells*s.rate;
 if(id==='bomblet') return (s.dmg+s.blets*s.bdmg*.4)*s.rate;
 if(id==='storm') return s.dmg*s.zaps*s.rate;
 if(id==='boomer') return s.dmg*s.rate*2*(s.perk?2:1);
 if(id==='acid') return s.dmg*s.rate+s.dot;
 if(id==='gas'||id==='magma') return s.pool;
 if(id==='vortex') return s.vdps;
 if(id==='sever') return s.dmg*s.rate;
 if(id==='beam') return s.dps*(1+s.ramp)/2;
 if(id==='pulse') return s.dmg*s.rate*(lv===3?2:1);
 if(id==='scatter') return s.dmg*s.pellets*s.rate;
 if(id==='missile') return s.dmg*s.salvo*s.rate;
 if(id==='arc'){ const f=lv===3?.9:.78; let m=0; for(let i=0;i<s.chain;i++) m+=Math.pow(f,i); return s.dmg*s.rate*m; }
 if(id==='rail') return s.dmg*s.rate*(1+s.crit*(s.cmul-1));
 if(id==='venom') return s.dmg*s.rate+s.dot*(lv===3?2:1);
 if(id==='flame') return s.dmg*s.rate+s.burn*(lv===3?3:1);
 if(id==='plasma') return s.dmg*s.rate+s.pool;
 return s.dmg*s.rate;
}

 if(cls) d.className=cls;

}

function augFlash(col){

}

}
function buildTabs(){
 E.tabs.innerHTML='';
 for(let i=0;i<TCATS.length;i++){
  const b=document.createElement('button');
  b.className='tab'+(i===G.tab?' on':''); b.type='button';
  b.textContent=TCATS[i].n;
  b.dataset.tab=String(i);
  b.addEventListener('click',function(){ G.tab=+this.dataset.tab; buildTabs(); buildShop(); syncUI(); });
  E.tabs.appendChild(b);
 }
}
function buildShop(){
 E.shop.innerHTML='';
 const ids=TCATS[G.tab].ids;
 for(let i=0;i<ids.length;i++){
  const id=ids[i], D=TOWERS[id];
  const b=document.createElement('button');
  b.className='card'; b.type='button';
  b.style.setProperty('--c',D.col);
  b.dataset.id=id;
  b.innerHTML='<span class="hk">'+(i+1)+'</span><span class="ic">'+tIcon(id,26)+'</span>'+
   '<span class="nm">'+D.name+'</span><span class="ct" data-cost="'+id+'">'+buildCost(id)+'</span>';
  b.addEventListener('click',function(){ selectBuy(id); });
  E.shop.appendChild(b);
 }
}

 const nx=(t&&lv<3)?D.lv[lv+1]:null;
 const delta=function(a,b,suf,pct){
  if(!nx||b===undefined||b===null||a===b) return '';
  const d=pct?Math.round((b-a)*100):Math.round((b-a)*10)/10;

 };

 const tiles=v=>Math.round(v/TILE*10)/10+'칸';
 let rows='';
 if(D.hits==='none'){
  const pw=s.pw||1, L=scaleSup(s.raw,pw), nx2=nx?scaleSup(nx,pw):null;
  if(id==='amp'){
   rows+=statRow('위력 증폭','+'+Math.round(L.ad*100)+'%',nx2?' ▲'+Math.round((nx2.ad-L.ad)*100)+'%':'');

   rows+=statRow('연사 증폭','+'+Math.round(L.ar*100)+'%',nx2?' ▲'+Math.round((nx2.ar-L.ar)*100)+'%':'');

   rows+=statRow('방어력 감소','-'+L.shred,nx2?' ▲'+(nx2.shred-L.shred):'');

  } else if(id==='mint'){
   rows+=statRow('웨이브 생산',L.yield+' 에너지',nx2?' ▲'+(nx2.yield-L.yield):'');

  } else if(id==='overclock'){

function miniMap(c,map){
 const g=c.getContext('2d'), s=c.width/COLS;
 c.height=Math.round(s*ROWS);
 g.fillStyle='rgba(8,13,28,.95)'; g.fillRect(0,0,c.width,c.height);
 g.strokeStyle='rgba(120,170,255,.09)'; g.lineWidth=1; g.beginPath();
 for(let x=0;x<=COLS;x+=2){ g.moveTo(x*s,0); g.lineTo(x*s,c.height); }
 for(let y=0;y<=ROWS;y+=2){ g.moveTo(0,y*s); g.lineTo(c.width,y*s); }
 g.stroke();
 g.lineCap='round'; g.lineJoin='round';
 g.beginPath();
 for(let i=0;i<map.wp.length;i++){
  const x=(map.wp[i][0]+.5)*s, y=(map.wp[i][1]+.5)*s;
  if(i) g.lineTo(x,y); else g.moveTo(x,y);
 }
 g.strokeStyle='rgba(47,224,255,.22)'; g.lineWidth=Math.max(3,s*.85); g.stroke();
 g.strokeStyle='rgba(120,235,255,.85)'; g.lineWidth=Math.max(1,s*.3); g.stroke();
 const f=map.wp[0], l=map.wp[map.wp.length-1];
 g.fillStyle='#ff4d6d'; g.beginPath(); g.arc((f[0]+.5)*s,(f[1]+.5)*s,s*1.2,0,TAU); g.fill();
 g.fillStyle='#2fe0ff'; g.beginPath(); g.arc((l[0]+.5)*s,(l[1]+.5)*s,s*1.5,0,TAU); g.fill();
}

 return {tiles:all.size,free:COLS*ROWS-all.size-m.blocks.length,len:Math.round(len/TILE)};

/* ═══════════ 협동전 네트워크 ═══════════ */
const ETYPE=Object.keys(ENEMIES), TIDS=Object.keys(TOWERS);
/* ═══════════ 협동전 연결 ═══════════
   두 가지 경로를 쓴다.
   p2p  : PeerJS(WebRTC)로 두 브라우저를 직접 연결 — 서로 다른 컴퓨터, 로그인 불필요
   room : Claude 아티팩트 런타임의 room 기능 — 같은 조직 계정끼리
   둘 다 없으면 협동전은 혼자 양면 방어로만 동작한다.                      */
const NET={
 api:null, tried:false, initing:null,
 peer:null, conn:null, mode:'', ready:false,
 code:'', side:0, host:false, nick:'',
 peers:[], partner:null, lastSend:0, lastSeen:0,
 status:'', onLobby:null,

 init(){
  if(NET.initing) return NET.initing;
  NET.initing=(async function(){
   if(NET.tried) return NET.api;
   NET.tried=true;
   try{ NET.api=(window.claude&&window.claude.use)?await window.claude.use('room'):null; }
   catch(e){ NET.api=null; }
   if(NET.api){
    NET.api.onPeers(function(ch){ NET.peers=ch.peers; NET.syncRoom(); },function(){ NET.api=null; });
    NET.api.on('coop',function(m){ if(!m.isMe) NET.handle(m.data); },function(){});
   }
   NET.ui();
   return NET.api;
  })();
  return NET.initing;
 },
 ok(){ return !!(NET.api||window.Peer); },
 ui(){ if(NET.onLobby) NET.onLobby(); },
 joined(){ return NET.mode==='p2p' ? !!(NET.conn&&NET.conn.open) : !!NET.partner; },

 /* ── 방 열기 / 들어가기 ── */
 async open(isHost,code){
  await NET.init();
  NET.close();
  NET.code=code; NET.host=isHost; NET.side=isHost?0:1;
  NET.nick=isHost?'P1':'P2';
  NET.lastSeen=performance.now();
  if(NET.api){ NET.mode='room'; NET.status=isHost?'상대를 기다리는 중':'방에 들어갔습니다';
   NET.say({m:'ncd',room:code,side:NET.side,nick:NET.nick,st:'lobby'}); NET.ui(); return; }
  if(window.Peer){ NET.openP2P(isHost,code); return; }
  NET.status='연결 수단을 찾을 수 없습니다'; NET.ui();
 },
 openP2P(isHost,code){
  NET.mode='p2p'; NET.status='연결 중…'; NET.ui();
  let p;
  try{ p=new window.Peer(isHost?('ncd7-'+code):undefined,{debug:0}); }
  catch(e){ NET.status='연결에 실패했습니다'; NET.ui(); return; }
  NET.peer=p;
  p.on('open',function(){
   NET.ready=true;
   if(isHost){ NET.status='상대를 기다리는 중 · 코드를 알려주세요'; NET.ui(); }
   else { NET.status='방을 찾는 중…'; NET.ui(); NET.bind(p.connect('ncd7-'+code,{serialization:'json'})); }
  });
  p.on('connection',function(c){ if(NET.host) NET.bind(c); });
  p.on('error',function(e){
   const t=(e&&e.type)||'';
   if(t==='unavailable-id') NET.status='이미 사용 중인 방 코드입니다 · 다시 만들어 주세요';
   else if(t==='peer-unavailable') NET.status='그 방을 찾을 수 없습니다 · 코드를 확인해 주세요';
   else if(t==='browser-incompatible') NET.status='이 브라우저는 P2P 연결을 지원하지 않습니다';
   else NET.status='연결 오류 · 잠시 후 다시 시도해 주세요';
   NET.ui();
  });
 },
 bind(c){
  if(!c) return;
  NET.conn=c;
  c.on('open',function(){
   NET.status='상대와 연결됐습니다';
   NET.lastSeen=performance.now();
   NET.say({m:'ncd',room:NET.code,side:NET.side,nick:NET.nick,st:G.scene});
   NET.ui();
  });
  c.on('data',function(d){ NET.recv(d); });
  c.on('close',function(){
   NET.conn=null; NET.partner=null;
   NET.status='상대 연결이 끊겼습니다'; NET.ui();
  });
  c.on('error',function(){});
 },
 close(){
  try{ if(NET.conn) NET.conn.close(); }catch(e){}
  try{ if(NET.peer) NET.peer.destroy(); }catch(e){}
  NET.conn=null; NET.peer=null; NET.ready=false; NET.partner=null;
 },

 /* ── 같은 방 코드를 가진 상대 찾기 (room 전용) ── */
 syncRoom(){
  if(NET.mode!=='room') return;
  let found=null;
  for(let i=0;i<NET.peers.length;i++){
   const p=NET.peers[i], pr=p.presence||{};
   if(p.isMe||pr.m!=='ncd'||!NET.code||pr.room!==NET.code) continue;
   found=p;
  }
  NET.partner=found;
  if(found) NET.lastSeen=performance.now();
  NET.ui();
 },

 /* ── 전송 ── */
 say(patch){
  if(NET.mode==='room'){ if(NET.api) NET.api.presence(patch).catch(function(){}); return; }
  if(NET.conn&&NET.conn.open){
   patch.k='st';
   try{ NET.conn.send(patch); }catch(e){}
  }
 },
 send(obj){
  obj.room=NET.code;
  if(NET.mode==='room'){ if(NET.api) NET.api.emit('coop',obj).catch(function(){}); return; }
  if(NET.conn&&NET.conn.open){ try{ NET.conn.send(obj); }catch(e){} }
 },
 recv(d){
  if(!d||typeof d!=='object') return;
  NET.lastSeen=performance.now();
  if(d.k==='st'){ NET.partner={presence:d}; return; }
  NET.handle(d);
 },
 handle(d){
  if(!d||d.room!==NET.code) return;
  if(d.k==='start'){ startCoop(NET.side,d.seed); return; }
  if(d.k==='wave'){
   if(G.scene==='play'&&!G.waveOn&&d.n>G.wave){ G.wave=d.n-1; G.prep=0; startWave(); }
   return;
  }
  if(d.k==='callwave'){ if(NET.host&&G.scene==='play'&&!G.waveOn) callWave(); return; }
  if(d.k==='bye'){ feed('<b>상대가 나갔습니다</b> · 남은 진영은 그대로 진행됩니다','bad'); NET.partner=null; }
 },

 /* 내 진영 상태를 절대값으로 계속 알린다 — 유실돼도 다음 갱신이 바로잡는다 */
 push(force){
  if(!NET.code) return;
  if(NET.mode==='p2p'&&!(NET.conn&&NET.conn.open)) return;

/* 같은 시드에서 두 사람에게 똑같은 증강 후보가 똑같은 순서로 나오게 하는 난수 */
function mulberry32(a){
 return function(){
  a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;
 };
}
function mapIdx(id){ for(let i=0;i<MAPS.length;i++) if(MAPS[i].id===id) return i; return 0; }
const DIFF_KEYS=['easy','normal','hard'];
function duelCode(){
 const d=G.duel, p=d.p1||{wave:0,score:0};
 return ['NCD',d.seed.toString(36),mapIdx(G.map.id)+''+DIFF_KEYS.indexOf(G.diff),
  p.wave.toString(36),Math.round(p.score).toString(36)].join('-').toUpperCase();
}
function parseDuelCode(txt){
 const p=String(txt||'').trim().toUpperCase().split('-');
 if(p.length!==5||p[0]!=='NCD') return null;
 const seed=parseInt(p[1],36), md=p[2], wave=parseInt(p[3],36), score=parseInt(p[4],36);
 const mi=parseInt(md[0],10), di=parseInt(md[1],10);
 if(!isFinite(seed)||!isFinite(wave)||!isFinite(score)||!MAPS[mi]||!DIFF_KEYS[di]) return null;
 return {seed:seed,map:MAPS[mi].id,diff:DIFF_KEYS[di],p1:{wave:wave,score:score,killed:0,lives:0,leaked:0}};
}

/* ═══════════ 루프 ═══════════ */
const FIX=1/60;
let lastT=0, acc=0, fpsA=0, fpsN=0, fpsGood=0;
function loop(ts){
 requestAnimationFrame(loop);
 if(!lastT){ lastT=ts; return; }
 let dt=(ts-lastT)/1000; lastT=ts;
 if(dt>.25) dt=.25;
 fpsA+=dt; fpsN++;
 if(fpsA>=1.5){
  const fps=fpsN/fpsA;
  if(fps<44){ G.lowfx=true; fpsGood=0; }
  else if(G.lowfx&&fps>55&&++fpsGood>=6) G.lowfx=false;
  fpsA=0; fpsN=0;
 }
 const frozen=(G.scene==='play'&&G.paused);
 acc+=dt;
 let guard=0;
 while(acc>=FIX&&guard++<6){
  acc-=FIX;
  if(frozen) continue;
  const n=(G.scene==='play')?G.speed:1;
  for(let i=0;i<n;i++) step(FIX);
 }
 if(G.path) render();
 if(G.scene!=='menu') syncFast(false);
}

 if(tgo) tgo.addEventListener('click',function(){
  SND.init(); SND.resume(); SND.play('build');
  E.title.classList.add('gone');
  setTimeout(function(){ E.title.style.display='none'; },460);
 });
 NET.init();
 NET.onLobby=function(){
  if(G.scene==='play'||!G.coopSel) return;
  if(E.veil.classList.contains('hide')) return;
  const box=E.sheet.querySelector('#c-lobby');
  if(box) showMenu(false);
 };
 showMenu(false);
 syncUI();
 requestAnimationFrame(loop);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
