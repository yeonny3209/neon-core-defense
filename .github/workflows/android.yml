name: 안드로이드 APK 빌드

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: 게임 파일을 앱 안에 복사
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          ls -la android/app/src/main/assets/

      - name: 자바 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3
        with:
          # 기본값인 'tools' 패키지는 폐기되어 더 이상 받을 수 없다.
          # 필요한 platform/build-tools 는 Gradle 이 알아서 받는다.
          packages: ''

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 빌드 (바로 설치용)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: AAB 빌드 (플레이 스토어 제출용, 서명 전)
        working-directory: android
        run: gradle bundleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: 결과 파일 확인
        run: |
          echo "=== 만들어진 파일 ==="
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -printf '%p  %s bytes\n'

      - name: 빌드 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: neon-core-defense-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 다운로드 링크 만들기 (누구나 받을 수 있는 공개 링크)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find android/app/build/outputs -name '*.apk' | head -1)
          cp "$APK" neon-core-defense.apk
          FILES="neon-core-defense.apk"
          AAB=$(find android/app/build/outputs -name '*.aab' | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" neon-core-defense.aab
            FILES="$FILES neon-core-defense.aab"
          fi
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest $FILES \
            --title "네온 코어 디펜스 - 안드로이드 (최신)" \
            --notes "**neon-core-defense.apk** — 휴대폰에서 이 파일을 내려받아 바로 설치하세요. 설치할 때 '알 수 없는 앱 설치 허용'을 켜야 합니다.

**neon-core-defense.aab** — 나중에 플레이 스토어에 올릴 때 쓰는 파일입니다. 아직 서명 전이라 스토어 제출에는 서명이 더 필요합니다.

플레이 스토어 심사를 거치지 않은 직접 설치용 파일입니다."
