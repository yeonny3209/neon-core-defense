:root{
  color-scheme:dark;
  --void:#05070f; --deck:#0b1120; --deck2:#121c34;
  --edge:rgba(125,170,255,.15); --edge2:rgba(125,170,255,.34);
  --ice:#e8f0ff; --mute:#8095bd; --dim:#5b6c94;
  --core:#2fe0ff; --flux:#ffc247; --breach:#ff4d6d; --grow:#5ef2a4;
  --font-d:'Orbitron',ui-sans-serif,system-ui,sans-serif;
  --font-b:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 640px at 18% -12%, #112445 0%, transparent 62%),
    radial-gradient(900px 620px at 104% 112%, #1d1136 0%, transparent 58%),
    var(--void);
  background-attachment:fixed;
  color:var(--ice); font-family:var(--font-b); font-size:14px; line-height:1.5;
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{background:var(--core);color:#04202a}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--core);outline-offset:2px;border-radius:6px}

#app{max-width:1500px;margin:0 auto;padding:12px 14px 22px;display:flex;flex-direction:column;gap:11px}

/* ---------- top rail ---------- */
#rail{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 14px;border:1px solid var(--edge);
  border-radius:14px;background:linear-gradient(180deg,rgba(21,33,60,.8),rgba(9,14,28,.72));backdrop-filter:blur(9px)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-d);font-weight:900;font-size:14px;letter-spacing:.05em;white-space:nowrap}
.brand .mark{width:20px;height:22px;background:linear-gradient(160deg,var(--core),#0a6f8c);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:0 0 16px -2px var(--core);flex:none;
  animation:markpulse 3.4s ease-in-out infinite}
@keyframes markpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
.brand small{font-family:var(--font-b);font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0}
.diffbadge{font-family:var(--font-b);font-weight:700;font-size:9.5px;letter-spacing:.06em;color:var(--core);
  background:rgba(47,224,255,.12);border:1px solid rgba(47,224,255,.36);border-radius:99px;padding:2px 8px;white-space:nowrap}
.diffbadge.easy{color:var(--grow);background:rgba(94,242,164,.12);border-color:rgba(94,242,164,.36)}
.diffbadge.hard{color:var(--breach);background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.4)}
.diffbadge.chaos{color:#ff6bd6;background:rgba(255,107,214,.16);border-color:rgba(255,107,214,.5)}

.readouts{display:flex;gap:7px;flex-wrap:wrap}
.ro{min-width:88px;padding:5px 11px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.028)}
.ro .k{display:block;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:500}
.ro .v{display:block;font-family:var(--font-d);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.25}
.ro.flux .v{color:var(--flux)} .ro.life .v{color:var(--grow)} .ro.life.hurt .v{color:var(--breach)}
.ro.bump .v{animation:bump .34s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{font-size:12px;font-weight:600;color:var(--mute);background:rgba(255,255,255,.04);border:1px solid var(--edge);
  border-radius:9px;padding:7px 11px;cursor:pointer;transition:background .14s,color .14s,border-color .14s,transform .14s}
.btn:hover{color:var(--ice);border-color:var(--edge2);background:rgba(47,224,255,.1)}
.btn:active{transform:translateY(1px)}
.btn.on{color:#04202a;background:var(--core);border-color:var(--core);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden}
.seg .btn{border:0;border-radius:0;padding:7px 10px}
.seg .btn+.btn{border-left:1px solid var(--edge)}

/* ---------- stage ---------- */
#stage{display:flex;gap:11px;align-items:flex-start}
#field{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:9px}
#board{position:relative;border:1px solid var(--edge2);border-radius:14px;overflow:hidden;background:#04060d;
  box-shadow:0 26px 70px -26px #000,0 0 60px -30px var(--core)}
canvas#game{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
#banner .txt{font-family:var(--font-d);font-weight:900;font-size:clamp(28px,5vw,58px);letter-spacing:.16em;
  color:#fff;text-shadow:0 0 34px var(--core),0 0 90px var(--core);white-space:nowrap;text-align:center}
#banner .sub{font-size:13px;letter-spacing:.34em;color:var(--core);text-align:center;margin-top:6px;text-transform:uppercase}
#banner.go{animation:bannergo 2.1s ease forwards}
@keyframes bannergo{0%{opacity:0;transform:scale(.86)}18%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:7px 15px;border-radius:99px;
  background:rgba(6,10,20,.86);border:1px solid var(--edge2);font-size:12px;color:var(--mute);pointer-events:none;
  white-space:nowrap;transition:opacity .3s;backdrop-filter:blur(4px)}
#hint b{color:var(--core)}
#hint.off{opacity:0}

/* ---------- manifest ---------- */
#manifest{display:flex;align-items:center;gap:11px;padding:8px 11px;border:1px solid var(--edge);border-radius:12px;
  background:linear-gradient(180deg,rgba(18,28,52,.72),rgba(9,14,28,.72));flex-wrap:wrap;position:relative;overflow:hidden}
#manifest .lead{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600;white-space:nowrap}
#mflist{display:flex;gap:6px;flex:1 1 200px;flex-wrap:wrap;min-width:0}
.chip{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 5px;border-radius:99px;background:rgba(255,255,255,.045);
  border:1px solid var(--edge);font-size:11.5px;font-weight:500;white-space:nowrap}
.chip svg{flex:none}
.chip b{font-family:var(--font-d);font-size:11px;font-variant-numeric:tabular-nums;color:var(--ice)}
.chip.boss{border-color:var(--breach);background:rgba(255,77,109,.14);color:#ffd7dd}
#mftimer{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--core),#7cf5ff);width:0;
  box-shadow:0 0 12px var(--core)}

/* ---------- side column ---------- */
#col{width:302px;flex:0 0 302px;display:flex;flex-direction:column;gap:9px}
.panel{border:1px solid var(--edge);border-radius:14px;padding:11px;
  background:linear-gradient(180deg,rgba(19,29,54,.76),rgba(8,13,26,.8))}
.panel>h2{margin:0 0 9px;font-family:var(--font-d);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mute);font-weight:700;display:flex;align-items:center;gap:8px}
.panel>h2::after{content:"";flex:1;height:1px;background:var(--edge)}

#tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{flex:1;padding:6px 2px;border-radius:8px;border:1px solid var(--edge);background:transparent;color:var(--dim);
  font-size:11px;font-weight:700;cursor:pointer;transition:.13s;font-family:var(--font-b)}
.tab:hover{color:var(--ice);border-color:var(--edge2)}
.tab.on{background:rgba(47,224,255,.16);border-color:var(--core);color:var(--core)}
#shop{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#auglist{display:flex;flex-wrap:wrap;gap:5px;max-height:156px;overflow:auto;scrollbar-width:thin}
.augchip{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;
  border:1px solid;white-space:nowrap}
.augchip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;font-style:normal}
.augs{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:4px 0}
.augcard{position:relative;padding:16px 14px 15px;border-radius:14px;border:1px solid var(--edge);cursor:pointer;
  text-align:left;color:var(--ice);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  display:flex;flex-direction:column;gap:7px;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.augcard:hover{transform:translateY(-3px)}
.augcard .rr{font-family:var(--font-d);font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.augcard .an{font-size:15px;font-weight:700;line-height:1.3}
.augcard .ad{font-size:11.5px;color:var(--mute);line-height:1.55}
.augcard::before{content:"";position:absolute;inset:0;opacity:.1;pointer-events:none;background:radial-gradient(120px 60px at 50% 0%,currentColor,transparent 70%)}
.augcard.r1{border-color:rgba(185,198,255,.4);color:#b9c6ff}
.augcard.r1:hover{box-shadow:0 12px 34px -14px #b9c6ff}
.augcard.r2{border-color:rgba(255,194,71,.5);color:#ffc247}
.augcard.r2:hover{box-shadow:0 12px 34px -12px #ffc247}
.augcard.r3{border-color:rgba(255,107,214,.6);color:#ff6bd6;
  background:linear-gradient(180deg,rgba(255,107,214,.14),rgba(47,224,255,.07))}
.augcard.r3:hover{box-shadow:0 14px 40px -10px #ff6bd6}
.augcard .an,.augcard .ad{color:var(--ice)}
.augcard .ad{color:var(--mute)}
.augcard .ahead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.augcard .at{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mute);letter-spacing:.02em}
.augcard .ai{display:block;height:28px}
.augcard .aw{font-size:10.5px;color:var(--flux);opacity:.9}
/* 카드가 한 장씩 뒤집히며 등장 — fill-mode 를 backwards 로 둬야 끝난 뒤 hover 이동이 먹는다 */
.augs{perspective:900px}
.augcard{animation:acIn .52s cubic-bezier(.2,1.25,.4,1) backwards}
.augcard:nth-child(2){animation-delay:.09s}
.augcard:nth-child(3){animation-delay:.18s}
@keyframes acIn{from{opacity:0;transform:translateY(26px) rotateX(38deg) scale(.9)}to{opacity:1;transform:none}}
.augcard.r2{box-shadow:inset 0 0 0 1px rgba(255,194,71,.08)}
.augcard.r3::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:50%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.2),transparent);
  transform:skewX(-18deg);animation:acShine 3.2s .7s ease-in-out infinite}
@keyframes acShine{0%{left:-60%}40%,100%{left:130%}}
.augcard.r3{animation:acIn .52s cubic-bezier(.2,1.25,.4,1) backwards,acGlow 2.4s .6s ease-in-out infinite}
.augcard.r3:nth-child(2){animation-delay:.09s,.69s}
.augcard.r3:nth-child(3){animation-delay:.18s,.78s}
@keyframes acGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,214,0)}50%{box-shadow:0 0 22px -4px rgba(255,107,214,.55)}}
.augcard.uq .at{background:linear-gradient(90deg,#ff6bd6,#2fe0ff);color:#081018}
@media (prefers-reduced-motion:reduce){ .augcard,.augcard.r3{animation:none} .augcard.r3::after{display:none} }
@media (max-width:700px){ .augs{grid-template-columns:1fr} }
.card{position:relative;padding:8px 8px 7px;border-radius:11px;border:1px solid var(--edge);text-align:left;
  background:rgba(255,255,255,.025);cursor:pointer;color:var(--ice);display:flex;flex-direction:column;gap:5px;
  transition:transform .13s,border-color .13s,background .13s,box-shadow .13s}
.card:hover{border-color:var(--edge2);background:rgba(255,255,255,.06);transform:translateY(-1px)}
.card.sel{border-color:var(--c);background:rgba(255,255,255,.08);box-shadow:0 0 0 1px var(--c),0 8px 26px -10px var(--c)}
.card.poor{opacity:.42}
.card .ic{height:30px;display:grid;place-items:center}
.card .nm{font-size:11.5px;font-weight:700;letter-spacing:-.01em}
.card .ct{font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--flux);font-variant-numeric:tabular-nums}
.card .hk{position:absolute;top:5px;right:6px;font-family:var(--font-d);font-size:9px;color:var(--dim)}

#detail{display:none}
#detail.show{display:block}
.dhead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.dhead .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--edge);flex:none}
.dhead .nm{font-size:13.5px;font-weight:700;line-height:1.25}
.dhead .lv{font-family:var(--font-d);font-size:10px;letter-spacing:.1em;color:var(--core)}
.rows{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.row{display:flex;align-items:baseline;gap:8px;font-size:11.5px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.02)}
.row .k{color:var(--dim);flex:none}
.row .v{font-family:var(--font-d);font-size:11.5px;font-variant-numeric:tabular-nums;margin-left:auto}
.row .up{color:var(--grow);font-size:10.5px;font-family:var(--font-d);margin-left:5px}
.note{font-size:11px;line-height:1.5;color:var(--mute);padding:7px 9px;border-radius:8px;background:rgba(47,224,255,.07);
  border-left:2px solid var(--core);margin-bottom:9px}
.note.locked{background:rgba(255,255,255,.03);border-left-color:var(--dim);color:var(--dim)}
.modes{display:flex;gap:4px;margin-bottom:9px;flex-wrap:wrap}
.mode{flex:1 1 auto;padding:5px 2px;border-radius:7px;border:1px solid var(--edge);background:transparent;color:var(--dim);
  font-size:10.5px;font-weight:600;cursor:pointer;transition:.13s}

.mode.on{background:rgba(47,224,255,.16);border-color:var(--core);color:var(--core)}
.acts{display:flex;gap:6px}
.acts .btn{flex:1;padding:9px 6px;font-size:12px}
.btn.buy{background:linear-gradient(180deg,rgba(94,242,164,.2),rgba(94,242,164,.09));border-color:rgba(94,242,164,.5);color:#b7ffdb}
.btn.buy:hover:not(:disabled){background:rgba(94,242,164,.3);color:#fff}
.btn.sell{color:#ffb3bf;border-color:rgba(255,77,109,.36)}
.btn.sell:hover{background:rgba(255,77,109,.18);color:#fff}

#feed{max-height:116px;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:11.5px;scrollbar-width:thin}
#feed div{color:var(--mute);padding:2px 0;border-bottom:1px solid rgba(125,170,255,.06);animation:fadein .25s ease}
#feed b{color:var(--ice);font-weight:600}
#feed .good b{color:var(--grow)} #feed .bad b{color:var(--breach)} #feed .warn b{color:var(--flux)}
@keyframes fadein{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

/* ---------- 타이틀 ---------- */
#title{position:fixed;inset:0;z-index:80;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(1100px 700px at 50% 42%,rgba(18,42,80,.72),rgba(3,5,12,.94) 62%),rgba(3,5,12,.97);
  backdrop-filter:blur(3px);animation:tfade .5s ease}
#title.gone{animation:tout .45s ease forwards;pointer-events:none}
@keyframes tfade{from{opacity:0}to{opacity:1}}
@keyframes tout{to{opacity:0;transform:scale(1.04)}}
.tstage{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;padding:20px;position:relative;z-index:2}
.tmark{position:relative;width:104px;height:104px;margin-bottom:22px;animation:tpop .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes tpop{from{opacity:0;transform:scale(.4) rotate(-40deg)}to{opacity:1;transform:none}}
.thex{position:absolute;inset:0;border:2px solid var(--core);opacity:.5;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.thex.h1{animation:tspin 7s linear infinite}
.thex.h2{inset:13px;opacity:.32;animation:tspin 5s linear infinite reverse}
.thex.h3{inset:26px;opacity:.22;animation:tspin 9s linear infinite}
@keyframes tspin{to{transform:rotate(360deg)}}
.tcore{position:absolute;inset:34px;background:linear-gradient(160deg,#9af4ff,var(--core));
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  box-shadow:0 0 34px 6px rgba(47,224,255,.55);animation:tbeat 2.6s ease-in-out infinite}
@keyframes tbeat{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.5);transform:scale(1.07)}}
.tname{margin:0;font-size:clamp(30px,6.4vw,62px);font-weight:700;letter-spacing:-.01em;line-height:1.1;
  color:#eaf6ff;text-shadow:0 0 30px rgba(47,224,255,.55),0 0 80px rgba(47,224,255,.28);
  animation:trise .6s .12s ease both}
.tsub{font-family:var(--font-d);font-size:clamp(9px,1.7vw,12px);font-weight:700;letter-spacing:.42em;
  color:var(--core);opacity:.75;margin:12px 0 0;animation:trise .6s .22s ease both}
.tline{color:var(--mute);font-size:13.5px;margin:20px 0 0;max-width:40ch;line-height:1.7;
  animation:trise .6s .32s ease both}
#t-go{margin-top:30px;padding:16px 48px;font-size:16px;animation:trise .6s .42s ease both}
.tfoot{display:flex;align-items:center;gap:12px;margin-top:26px;font-size:11.5px;color:var(--dim);
  animation:trise .6s .54s ease both}
.tfoot i{width:3px;height:3px;border-radius:50%;background:var(--dim);opacity:.6}
@keyframes trise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tscan{position:absolute;left:0;right:0;height:180px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(47,224,255,.06) 45%,rgba(47,224,255,.11) 50%,rgba(47,224,255,.06) 55%,transparent);
  animation:tscan 5.5s linear infinite}
@keyframes tscan{from{top:-200px}to{top:100%}}
/* 증강 획득 섬광 */
#augflash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0}
#augflash.go{animation:augf .6s ease forwards}
@keyframes augf{0%{opacity:.5}100%{opacity:0}}
@media (max-width:620px){ .tmark{width:78px;height:78px} .tcore{inset:25px} .thex.h3{inset:19px} }

/* ---------- overlay ---------- */

.sheet h1{font-family:var(--font-d);font-weight:900;font-size:clamp(27px,4.6vw,44px);letter-spacing:.03em;margin:0;

.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

.mapcard:hover{border-color:var(--edge2);background:rgba(255,255,255,.06)}

.mapcard canvas{width:100%;height:auto;display:block;border-radius:7px;background:rgba(0,0,0,.36)}
.mapcard .nm{font-size:13px;font-weight:700}
.mapcard .sub{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.codein{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--edge2);

.chips .btn{padding:8px 15px}
.startrow{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}

.big.alt{background:linear-gradient(180deg,#ffe08a,var(--flux));box-shadow:0 12px 34px -12px var(--flux);color:#2a1c00}
.best{font-size:12px;color:var(--mute)}
.best b{font-family:var(--font-d);color:var(--flux);font-size:14px}

.gl b{color:var(--ice);display:block;margin-bottom:3px;font-size:12px}
kbd{font-family:var(--font-d);font-size:10px;background:rgba(255,255,255,.09);border:1px solid var(--edge2);

.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px;margin:6px 0 4px}

function waveDef(n){
  if(n<=LAST_WAVE) return WAVES[n-1];
  const t=n-LAST_WAVE, pool=['brute','phase','shield','flyer','splitter','swift','healer'];
  const out=[['boss',1+Math.floor(t/3),7,0]];
  for(let i=0;i<3+Math.min(3,Math.floor(t/4));i++){
    const ty=pool[(t*3+i*5)%pool.length];
    out.push([ty, 10+t*2, Math.max(.18,.6-t*.02), 2+i*3]);
  }
  return out;
}

/* 특수 증강 계산 도우미 */
function uTowerMul(t){
 let m=0;
 if(U.polymath){ m+=U.polymath*towerKinds(); }
 if(U.purist&&towerKinds()<=5) m+=U.purist;
 if(U.broke&&G.gold<=150) m+=U.broke;
 if(U.rage) m+=U.rage*Math.max(0,G.maxLives-G.lives);
 if(U.snow) m+=Math.min(1.5,U.snow*(G.snowKills||0));
 if(U.hoard) m+=Math.min(1.2,U.hoard*(G.hoardKills||0));
 if(U.glass) m+=U.glass-1;
 if(U.sprint) m+=U.sprint;
 if(U.tax) m+=U.tax;
 if(U.fragile) m+=U.fragile;
 if(U.pacifist) m+=U.pacifist-1;
 if(U.perfect&&G.perfectOn) m+=U.perfect;
 if(t){
  if(U.triplet) m+=U.triplet*Math.floor(kindCount(t.id)/3);
  if(U.phalanx) m+=U.phalanx*(t.adj||0);
  if(U.lone&&t.adj===0&&t.near2===0) m+=U.lone;
  if(U.frontline) m+=U.frontline*clamp(t.coreDist||0,0,1);
  if(U.lastwall&&(t.coreTiles||99)<=3) m+=U.lastwall;
  if(U.spread) m+=U.spread;
  if(U.focus&&t.focusE) m+=Math.min(U.focus,(t.focusT||0)*.22);
  if(U.patience) m+=Math.min(3,U.patience*Math.max(0,(G.time-(t.lastFire||0))-.5));
  if(U.twin&&t.twinReady) m+=U.twin-1;
 }
 if(U.vanguard&&G.waveOn&&G.waveProg<.3) m+=U.vanguard;
 if(U.tide&&G.waveOn&&G.waveProg>.7) m+=U.tide;
 return m;
}
function towerKinds(){
 if(G.kindsF===G.frame) return G.kindsN;
 const seen={}; let n=0;
 for(let i=0;i<G.towers.length;i++){ const id=G.towers[i].id; if(!seen[id]){ seen[id]=1; n++; } }
 G.kindsF=G.frame; G.kindsN=n; return n;
}
function kindCount(id){
 if(G.kcF!==G.frame){ G.kcF=G.frame; G.kc={};
  for(let i=0;i<G.towers.length;i++){ const k=G.towers[i].id; G.kc[k]=(G.kc[k]||0)+1; } }
 return G.kc[id]||0;
}
/* 진형 관련 값은 구조가 바뀔 때만 다시 잰다 */
function uGeom(){
 const n=G.towers.length;
 let far=1;
 for(let i=0;i<n;i++){
  const t=G.towers[i];
  const d=Math.hypot(t.x-G.core.x,t.y-G.core.y);
  t.coreRaw=d; if(d>far) far=d;
  t.coreTiles=Math.round(d/TILE);
 }
 for(let i=0;i<n;i++){
  const t=G.towers[i];
  t.coreDist=t.coreRaw/far;
  let adj=0, near2=0;
  for(let j=0;j<n;j++){
   if(i===j) continue;
   const o=G.towers[j], dx=Math.abs(o.tx-t.tx), dy=Math.abs(o.ty-t.ty);
   if(dx+dy===1) adj++;
   if(dx<=2&&dy<=2) near2++;
  }
  t.adj=adj; t.near2=near2;
 }
}
/* 특수 증강의 시간 기반 효과 */
function uStep(dt){
 if(U.freeze){
  G.freezeT=(G.freezeT||0)+dt;
  if(G.freezeT>=18){
   G.freezeT=0;
   let n=0;
   for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];
    if(!e.alive) continue;
    e.stun=Math.max(e.stun,U.freeze); n++;
   }
   if(n){ ring(G.core.x,G.core.y,300,'#9df0ff',.9,4); SND.play('cryo'); feed('<b>시간 정지</b> · 모든 적이 멈췄습니다','good'); }
  }
 }
 if(U.coregun){
  G.cgT=(G.cgT||0)+dt;
  if(G.cgT>=4){
   G.cgT=0;
   let best=null,bp=-1;
   for(let i=0;i<G.enemies.length;i++){ const e=G.enemies[i]; if(e.alive&&e.prog>bp){ bp=e.prog; best=e; } }
   if(best){
    const dmg=140+G.wave*45;
    beam(G.core.x,G.core.y,best.x,best.y,'#9af4ff',.35,5);
    hurt(best,dmg,{src:null,nocrit:true});
    boom(best.x,best.y,44,'#9af4ff');
    SND.play('rail',60);
   }
  }
 }
 if(U.spree){
  G.spreeWin=(G.spreeWin||0)-dt;
  if(G.spreeWin<=0){ G.spreeWin=3; G.spreeN=0; }
  if(G.spreeT>0) G.spreeT-=dt;
 }
 if(U.twin){
  for(let i=0;i<G.towers.length;i++){
   const t=G.towers[i];
   t.twinT=(t.twinT||0)+dt;
   if(t.twinT>=9){ t.twinT=0; t.twinReady=1; }
  }
 }
 if(U.delay&&G.delayQ&&G.delayQ.length){
  for(let i=G.delayQ.length-1;i>=0;i--){
   const q=G.delayQ[i];
   q.t-=dt;
   if(q.t>0) continue;
   G.delayQ.splice(i,1);
   if(q.e&&q.e.alive) hurt(q.e,q.d,{src:q.src,aug:true,silent:true,nocrit:true});
  }
 }
 if(U.echo&&G.echoQ&&G.echoQ.length){
  for(let i=G.echoQ.length-1;i>=0;i--){
   const q=G.echoQ[i];
   q.t-=dt;
   if(q.t>0) continue;
   G.echoQ.splice(i,1);
   if(q.e&&q.e.alive) hurt(q.e,q.d,{src:q.src,aug:true,silent:true,nocrit:true});
  }
 }
}

function parseFx(str){
 const fx={}, parts=str.split(',');
 for(let i=0;i<parts.length;i++){
  const kv=parts[i].split('='), path=kv[0].trim().split('.'), v=parseFloat(kv[1]);
  if(path.length===1){ fx[path[0]]=v; }
  else if(path.length===2){ if(!fx[path[0]]) fx[path[0]]={}; fx[path[0]][path[1]]=v; }
  else {
   if(!fx[path[0]]) fx[path[0]]={};
   if(!fx[path[0]][path[1]]) fx[path[0]][path[1]]={};
   fx[path[0]][path[1]][path[2]]=v;
  }
 }
 return fx;
}

function tfDesc(tw,f,v){
 const d=FIELD_DEF[f], nm=TOWERS[tw]?TOWERS[tw].name:tw;
 if(!d) return nm+' '+f+' +'+v;
 if(d.mode==='mul') return nm+' '+d.lab+' +'+Math.round(v*100)+'%';
 if(d.unit==='%p') return nm+' '+d.lab+' +'+Math.round(v*100)+'%p';
 if(d.unit==='×') return nm+' '+d.lab+' +'+v+'배';
 return nm+' '+d.lab+' +'+v+(d.unit||'');
}
function augDesc(a){
 const fx=a.fx, out=[];
 for(const k in fx){
  const v=fx[k];
  if(k==='goldW') continue;
  if(typeof v==='object'){
   if(k==='tf'){
    for(const tw in v){ for(const f in v[tw]) out.push(tfDesc(tw,f,v[tw][f])); }
    continue;
   }
   if(k==='uniq'){
    for(const uk in v){
     for(let i=0;i<UNIQ.length;i++) if(UNIQ[i][0]===uk) out.push(UNIQ[i][3]);
    }
    continue;
   }
   for(const s in v){
    const x=v[s], sup=TOWERS[s]&&TOWERS[s].hits==='none';
    if(k==='cDmg') out.push(CAT_N[s]+' 계열 피해 '+pct(x));
    else if(k==='cRate') out.push(CAT_N[s]+' 계열 연사 '+pct(x));
    else if(k==='cRng') out.push(CAT_N[s]+(s==='sup'?' 계열 영향 반경 ':' 계열 사거리 ')+pct(x));
    else if(k==='tDmg') out.push(TOWERS[s].name+(sup?' 효과 ':' 피해 ')+pct(x));
    else if(k==='tRate') out.push(TOWERS[s].name+' 연사 '+pct(x));
    else if(k==='tRng') out.push(TOWERS[s].name+(sup?' 영향 반경 ':' 사거리 ')+pct(x));
    else if(k==='vs') out.push(VS_N[s]+'에게 피해 '+pct(x));
   }
   continue;
  }
  if(k==='gold'){ out.push('즉시 에너지 +'+Math.round(v+(fx.goldW||0)*G.wave)+(fx.goldW?' (웨이브 비례)':'')); continue; }
  if(k==='maxLives'){ out.push(v>0?'최대 내구도 +'+v+' (즉시 회복)':'최대 내구도 '+v); continue; }
  if(k==='restore'){ out.push('코어 내구도 완전 회복'); continue; }
  if(k==='retro'){ out.push('보유한 모든 방어탑을 즉시 1단계 무료 강화'); continue; }
  out.push(FX_TXT[k]?FX_TXT[k](v):k);
 }
 return out.join(', ');
}
function applyAug(a){
 const fx=a.fx;
 for(const k in fx){
  const v=fx[k];
  if(k==='uniq'){ for(const uk in v) U[uk]=(U[uk]||0)+v[uk]; continue; }
  if(typeof v==='object'){
   for(const s in v){
    const vv=v[s];
    if(typeof vv==='object'){
     if(!AUG[k][s]) AUG[k][s]={};
     for(const f in vv) AUG[k][s][f]=(AUG[k][s][f]||0)+vv[f];
    } else AUG[k][s]=(AUG[k][s]||0)+vv;
   }
   continue;
  }
  if(k==='goldW') continue;
  if(k==='gold'){ const g=Math.round(v+(fx.goldW||0)*G.wave); G.gold+=g; G.earned+=g; flashGold(); continue; }
  if(k==='maxLives'){
   if(v>0){ G.maxLives+=v; G.lives+=v; }
   else { G.maxLives=Math.max(1,G.maxLives+v); G.lives=Math.max(1,Math.min(G.lives,G.maxLives)); }
   continue;
  }
  if(k==='restore'){ G.lives=Math.max(G.lives,G.maxLives); continue; }
  if(k==='retro'){
   for(let i=0;i<G.towers.length;i++){
    const t=G.towers[i];
    if(t.lv<3){ t.lv++; ring(t.x,t.y,tstat(t).rng||40,t.D.col,.6,2); }
   }
   continue;
  }
  if(AUG[k]!==undefined) AUG[k]+=v;
 }
}

 const R=(G.duel.on&&G.rng)?G.rng:Math.random;
 const pool=[], picks=[], owned={};
 for(let i=0;i<AUGMENTS.length;i++) if(!AUG.taken[AUGMENTS[i].id]) pool.push(AUGMENTS[i]);
 for(let i=0;i<G.towers.length;i++) owned[G.towers[i].id]=1;
 const w=G.wave, wt=[0,62,30,8];
 if(w>=10){ wt[1]=52; wt[2]=35; wt[3]=13; }
 if(w>=20){ wt[1]=42; wt[2]=39; wt[3]=19; }
 if(w>=30){ wt[1]=32; wt[2]=42; wt[3]=26; }
 for(let k=0;k<n&&pool.length;k++){
  const r=R()*(wt[1]+wt[2]+wt[3]);
  const tier=r<wt[1]?1:(r<wt[1]+wt[2]?2:3);
  let band=pool.filter(function(a){ return a.r===tier; });
  if(!band.length) band=pool.slice();
  let tot=0;
  const ws=band.map(function(a){ const x=G.duel.on?1:(a.tw?(owned[a.tw]?3:.5):1); tot+=x; return x; });
  let roll=R()*tot, pick=band[band.length-1];
  for(let j=0;j<band.length;j++){ roll-=ws[j]; if(roll<=0){ pick=band[j]; break; } }
  picks.push(pick);
  pool.splice(pool.indexOf(pick),1);
 }
 return picks;
}

const SND={
 ctx:null,master:null,comp:null,gSfx:null,gMus:null,verb:null,send:null,
 noise:null,on:true,musOn:true,last:Object.create(null),ready:false,voices:0,
 init(){
  if(this.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
   const c=new AC(); this.ctx=c;

   this.comp=c.createDynamicsCompressor();
   this.comp.threshold.value=-10; this.comp.knee.value=8; this.comp.ratio.value=12;
   this.comp.attack.value=.003; this.comp.release.value=.2;
   this.comp.connect(c.destination);

   this.master=c.createGain(); this.master.gain.value=.9; this.master.connect(this.comp);
   this.gSfx=c.createGain(); this.gSfx.gain.value=.5; this.gSfx.connect(this.master);
   this.gMus=c.createGain(); this.gMus.gain.value=0; this.gMus.connect(this.master);

   /* 합성 임펄스로 만든 짧은 공간감 */
   this.verb=c.createConvolver();
   this.verb.buffer=this.mkIR(1.9,2.6);
   const vg=c.createGain(); vg.gain.value=.9;
   this.verb.connect(vg); vg.connect(this.master);
   this.send=c.createGain(); this.send.gain.value=1; this.send.connect(this.verb);

   const len=(c.sampleRate*1.6)|0, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
   for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
   this.noise=b;
   this.ready=true;
  }catch(e){ this.ready=false; }
 },
 mkIR(dur,decay){
  const c=this.ctx, n=(c.sampleRate*dur)|0, buf=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){
   const d=buf.getChannelData(ch);
   let lp=0;
   for(let i=0;i<n;i++){
    const t=i/n;
    const v=(Math.random()*2-1)*Math.pow(1-t,decay);
    lp+=(v-lp)*.35;                 /* 어둡게 굴려서 쇳소리를 없앤다 */
    d[i]=lp;
   }
  }
  return buf;
 },
 resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); },
 busy(){ return this.voices>26; },

 /* ── 기본 목소리 ── */
 tone(o){
  if(!this.ready||!this.on||this.busy()) return;
  const c=this.ctx,t=c.currentTime+(o.at||0);
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+o.d);
  if(o.detune) osc.detune.value=o.detune;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(o.g||.2,t+(o.atk||.005));
  g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  let node=osc;
  if(o.lp){
   const f=c.createBiquadFilter(); f.type='lowpass';
   f.frequency.setValueAtTime(o.lp,t);
   if(o.lp2) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.lp2),t+o.d);
   f.Q.value=o.q||.7;
   node.connect(f); node=f;
  }
  node.connect(g); g.connect(this.gSfx);
  if(o.verb) g.connect(this.send);
  this.voices++;
  osc.onended=()=>{ this.voices--; };
  osc.start(t); osc.stop(t+o.d+.02);

 hiss(o){
  if(!this.ready||!this.on||this.busy()) return;
  const c=this.ctx,t=c.currentTime+(o.at||0);
  const s=c.createBufferSource(); s.buffer=this.noise;
  if(o.rate) s.playbackRate.value=o.rate;
  const f=c.createBiquadFilter(); f.type=o.type||'lowpass';
  f.frequency.setValueAtTime(o.f,t);
  if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f2),t+o.d);
  f.Q.value=o.q||1;
  const g=c.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(o.g||.2,t+(o.atk||.004));
  g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  s.connect(f); f.connect(g); g.connect(this.gSfx);
  if(o.verb) g.connect(this.send);
  this.voices++;
  s.onended=()=>{ this.voices--; };
  s.start(t); s.stop(t+o.d+.02);

 /* FM 한 방 — 금속성 타격음에 쓴다 */

  if(!this.ready||!this.on||this.busy()) return;
  const c=this.ctx,t=c.currentTime+(o.at||0);
  const car=c.createOscillator(), mod=c.createOscillator(), mg=c.createGain(), g=c.createGain();

  mod.frequency.setValueAtTime(o.f*(o.ratio||2.4),t);

  g.gain.linearRampToValueAtTime(o.g||.18,t+.004);
  g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  car.connect(g); g.connect(this.gSfx);
  if(o.verb) g.connect(this.send);
  this.voices++;
  car.onended=()=>{ this.voices--; };
  car.start(t); mod.start(t); car.stop(t+o.d+.02); mod.stop(t+o.d+.02);

 chord(notes,o){
  o=o||{};

   this.tone({f:notes[i],type:o.type||'triangle',d:o.d||.5,g:(o.g||.09),

 /* ── 배경음악: 사용자가 만든 트랙을 그대로 반복 재생한다 ──
    교전 강도(intensity)에 따라 저역통과 필터를 살짝 열고 닫아 다이나믹을 준다. */
 musicBuf:null,musicLoading:false,musicCbs:null,musicSrc:null,musicFilter:null,
 mTimer:null,intensity:0,inten:0,
 loadMusic(cb){
  if(this.musicBuf){ cb&&cb(); return; }
  if(this.musicLoading){ if(cb){ this.musicCbs=this.musicCbs||[]; this.musicCbs.push(cb); } return; }
  this.musicLoading=true;
  fetch(MUSIC_SRC).then(r=>r.arrayBuffer()).then(buf=>this.ctx.decodeAudioData(buf)).then(ab=>{
   this.musicBuf=ab; this.musicLoading=false;
   if(cb) cb();
   if(this.musicCbs){ const cs=this.musicCbs; this.musicCbs=null; cs.forEach(f=>f()); }
  }).catch(()=>{ this.musicLoading=false; });
 },
 startMusic(){
  if(!this.ready||this.musicSrc) return;
  if(!this.musicBuf){ this.loadMusic(()=>this.startMusic()); return; }
  const c=this.ctx;
  if(!this.musicFilter){
   this.musicFilter=c.createBiquadFilter();
   this.musicFilter.type='lowpass'; this.musicFilter.Q.value=.6;
   this.musicFilter.connect(this.gMus);
  }
  this.musicFilter.frequency.setValueAtTime(1200,c.currentTime);
  const src=c.createBufferSource();
  src.buffer=this.musicBuf; src.loop=true;
  src.connect(this.musicFilter);
  src.start(0);
  this.musicSrc=src;
  if(!this.mTimer) this.mTimer=setInterval(()=>this.pump(),160);
  this.gMus.gain.cancelScheduledValues(c.currentTime);
  this.gMus.gain.setTargetAtTime(this.musOn?.32:0,c.currentTime,.8);
 },
 stopMusic(){
  if(this.mTimer){ clearInterval(this.mTimer); this.mTimer=null; }
  if(this.musicSrc){ try{ this.musicSrc.stop(); }catch(e){} this.musicSrc.disconnect(); this.musicSrc=null; }
  if(this.ready) this.gMus.gain.setTargetAtTime(0,this.ctx.currentTime,.3);
 },
 setMusic(v){
  this.musOn=v;
  if(this.ready&&this.musicSrc) this.gMus.gain.setTargetAtTime(v?.32:0,this.ctx.currentTime,.35);
 },
 pump(){
  if(!this.ready||!this.musicFilter) return;
  /* 강도는 천천히 따라간다 — 갑자기 음색이 튀지 않게 */
  this.inten+=(this.intensity-this.inten)*.1;
  this.musicFilter.frequency.setTargetAtTime(1200+this.inten*9000,this.ctx.currentTime,.3);
 }
};

function buildPath(wp){
 const pts=wp.map(w=>({x:(w[0]+.5)*TILE,y:(w[1]+.5)*TILE}));
 const segs=[]; let total=0;
 for(let i=0;i<pts.length-1;i++){
  const a=pts[i],b=pts[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);
  segs.push({a:a,b:b,len:len,s:total,ux:(b.x-a.x)/len,uy:(b.y-a.y)/len});
  total+=len;
 }
 const tiles=new Set();
 for(let i=0;i<wp.length-1;i++){
  let x=wp[i][0],y=wp[i][1];
  const tx=wp[i+1][0],ty=wp[i+1][1];
  const sx=Math.sign(tx-x),sy=Math.sign(ty-y); let guard=0;
  tiles.add(x+','+y);
  while((x!==tx||y!==ty)&&guard++<300){ x+=sx; y+=sy; tiles.add(x+','+y); }
 }
 const gate=pts[0], core=pts[pts.length-1];
 return {pts:pts,segs:segs,total:total,tiles:tiles,gate:gate,core:core,
   airLen:Math.hypot(core.x-gate.x,core.y-gate.y)};
}

/* 협동전은 회랑이 둘이다. lane 0 = 왼쪽 진영, lane 1 = 오른쪽 진영, 코어는 하나를 공유한다 */
function PATH(l){ return G.paths[l||0]||G.paths[0]; }
function ptAt(d,lane){
 const p=PATH(lane), n=p.segs.length; d=clamp(d,0,p.total);
 for(let i=0;i<n;i++){ const s=p.segs[i];
  if(d<=s.s+s.len||i===n-1){ const k=d-s.s; return {x:s.a.x+s.ux*k, y:s.a.y+s.uy*k, ang:Math.atan2(s.uy,s.ux)}; } }
 return {x:p.core.x,y:p.core.y,ang:0};
}
function airAt(d,lane){
 const p=PATH(lane), k=clamp(d/p.airLen,0,1);
 return {x:lerp(p.gate.x,p.core.x,k), y:lerp(p.gate.y,p.core.y,k),
   ang:Math.atan2(p.core.y-p.gate.y,p.core.x-p.gate.x)};
}
function onPath(tx,ty){
 for(let i=0;i<G.paths.length;i++) if(G.paths[i].tiles.has(tx+','+ty)) return true;
 return false;
}
/* 협동전에서는 자기 진영에만 지을 수 있다 */
function mySide(tx){ return tx<COOP_SPLIT?0:1; }
const COOP_SPLIT=14;
const buildable=(tx,ty)=>tx>=0&&ty>=0&&tx<COLS&&ty<ROWS&&!onPath(tx,ty)&&!G.blocked.has(tx+','+ty)
 &&!G.occ[ty*COLS+tx]&&(G.side<0||mySide(tx)===G.side);

function makeEnemy(type,waveN,dist,lane){
 const D=ENEMIES[type];

  maxHp:D.hp*hs, hp:D.hp*hs,
  armor:Math.max(0,D.armor+(G.chaos?chaosArmor(waveN):0)-(D.boss?AUG.bossArmor:0)),
  shred:0, vuln:0, cursed:false, bounty:0, acid:0, acidPerk:0,
  markV:0, markT:0, frostT:0, gasT:0, kcd:0, fcd:0, scd:0,
  gold:Math.max(1,Math.round(D.gold*goldScale(waveN))),
  dist:dist||0, x:0,y:0, ang:0, prog:0,
  spd:D.spd*G.D.spd*(G.chaos?chaosSpd(waveN):1)*clamp(1-AUG.enemySpd,.6,1.2)*(D.boss?Math.max(.5,1-AUG.bossSlow):1)*(U.sprint?1.35:1), slow:0, slowT:0, freeze:0, stun:0, pois:[], brk:0,
  shield:D.shield?D.shield.amt*hs:0, shieldMax:D.shield?D.shield.amt*hs:0, shieldT:0,
  healCd:rnd(0,1), spawnCd:3, alive:true, hitT:0, hasted:false,
  wob:Math.random()*TAU, spin:rnd(-1.6,1.6), age:0
 };

}
function hurt(e,amount,o){
 o=o||{};
 if(!e.alive||amount<=0) return 0;
 let dmg=amount, crit=false;
 const src=o.src, direct=(src&&!o.pure&&!o.aug);
 const fullBefore=e.hp>=e.maxHp*.999;
 if(direct&&!o.tick&&src.cc>0&&!o.nocrit&&Math.random()<src.cc){ crit=true; dmg*=src.cm; }
 if(e.D.dr) dmg*=(1-e.D.dr);
 /* 특효·조건부 보너스는 한 묶음으로 합산 */
 let mul=1;
 const vk=e.D.vsKey||e.type;
 if(AUG.vs[vk]) mul+=AUG.vs[vk];
 if(AUG.swarm&&e.D.cls==='swarm') mul+=AUG.swarm;
 if(AUG.giant&&e.D.cls==='giant') mul+=AUG.giant;
 if(AUG.bossDmg&&e.D.boss) mul+=AUG.bossDmg;
 if(AUG.air&&e.air) mul+=AUG.air;
 if(AUG.first&&G.waveOn&&G.waveT<4) mul+=AUG.first;
 if(AUG.last&&G.lives<=5) mul+=AUG.last;
 if(AUG.bossWave&&G.bossOn) mul+=AUG.bossWave;
 if(AUG.fullHp&&direct&&fullBefore) mul+=AUG.fullHp;
 if(AUG.lowHp&&e.hp<=e.maxHp*.35) mul+=AUG.lowHp;
 if(src&&(AUG.near||AUG.far)){
  const dd=d2(src.x,src.y,e.x,e.y);
  if(AUG.near&&dd<=6400) mul+=AUG.near;
  if(AUG.far&&dd>=25600) mul+=AUG.far;
 }
 if(e.markT>G.time) mul+=e.markV;
 if(U.reaper&&e.hp<=e.maxHp*.3) mul+=1;
 if(U.crowd&&e.packed) mul+=U.crowd;
 if(e.freeze>0&&e.frostT>G.time) mul+=.4;
 dmg*=mul;
 const vul=AUG.vuln+(e.vuln||0);
 if(vul) dmg*=(1+vul);
 if((o.pure||o.tick)&&AUG.dotAmp) dmg*=(1+AUG.dotAmp);
 if(U.fracture&&direct){ e.hitN=(e.hitN||0)+1; if(e.hitN===U.fracture) ring(e.x,e.y,e.r+12,'#ff8a3d',.4,2); }
 if(!o.pure){
  let ar=e.armor-AUG.shred-(e.shred||0)-(e.brk||0)-(e.acid||0);
  if(U.fracture&&(e.hitN||0)>=U.fracture) ar=0;
  if(e.gasT>G.time) ar*=.5;
  ar=Math.max(0,ar*(1-(o.pen||0)));
  if(ar<=0&&e.acidPerk) dmg*=1.25;
  dmg=Math.max(dmg*0.12,dmg-ar);
 }
 const ex=Math.min(.2,AUG.exec);
 if(ex&&direct&&!e.D.boss&&e.shield<=0&&e.hp>0&&e.hp/e.maxHp<=ex){
  say(e.x,e.y-e.r-6,'처형','#ff6bd6',14); dmg=e.hp+1;
 }
 if(e.shield>0&&!o.ignoreShield){
  const sb=1+AUG.shieldBreak;
  const take=Math.min(e.shield,dmg*sb);
  e.shield-=take; dmg-=take/sb; e.shieldT=e.D.shield.delay;
  if(e.shield<=0){ ring(e.x,e.y,e.r+10,'#ffe066',.35,2); SND.play('die',60); }
 }
 e.hp-=dmg; e.hitT=.11;
 G.dealt+=dmg;
 if(src){ src.dmg+=dmg; }
 if(!o.silent&&dmg>=6) say(e.x+rnd(-4,4),e.y-e.r-3,Math.round(dmg),crit?'#ffd34d':'#eaf4ff',crit?15:11);
 if(crit&&AUG.critSplash>0&&!o.aug){
  const r=44, r2=r*r, n=G.enemies.length;
  for(let i=0;i<n;i++){
   const o2=G.enemies[i];
   if(!o2.alive||o2===e||d2(e.x,e.y,o2.x,o2.y)>r2) continue;
   hurt(o2,dmg*AUG.critSplash,{src:src,aug:true,silent:true});
  }
  ring(e.x,e.y,r,'#ffd34d',.2,1.5);
 }
 if(e.hp<=0){
  const over=-e.hp;
  kill(e,src);
  if(AUG.overkill>0&&over>0&&!o.aug){
   let best=null,bd=90*90, n=G.enemies.length;
   for(let i=0;i<n;i++){
    const o2=G.enemies[i];
    if(!o2.alive||o2===e) continue;
    const dd=d2(e.x,e.y,o2.x,o2.y);
    if(dd<bd){ bd=dd; best=o2; }
   }
   if(best){ beam(e.x,e.y,best.x,best.y,'#ffd7a0',.2,2); hurt(best,over*AUG.overkill,{src:src,aug:true,silent:true}); }
  }
  return dmg;
 }
 if(direct&&!o.tick){
  augOnHit(e,src,dmg);
  if(U.echo){ (G.echoQ=G.echoQ||[]).push({e:e,d:dmg*U.echo,src:src,t:.35}); }
  if(U.delay){ (G.delayQ=G.delayQ||[]).push({e:e,d:dmg*U.delay,src:src,t:2}); }
  if(U.siphon2){ G.repBank=(G.repBank||0)+dmg*U.siphon2/Math.max(1,G.maxLives); }
  if(src&&U.focus){
   if(src.focusE===e) src.focusT=(src.focusT||0)+1; else { src.focusE=e; src.focusT=0; }
  }
 }
 return dmg;
}
function augOnHit(e,src,dmg){
 const sl=Math.min(.5,AUG.slow);
 if(sl>0&&!e.D.noSlow){ if(sl>e.slow||e.slowT<=0) e.slow=Math.max(e.slow,sl); e.slowT=Math.max(e.slowT,1.2); }
 if(AUG.burn>0) poison(e,AUG.burn,3,3,src);
 if(AUG.stun>0&&(e.scd||0)<=G.time&&Math.random()<Math.min(.35,AUG.stun)){ e.stun=Math.max(e.stun,.4); e.scd=G.time+1.2; }
 if(AUG.freeze>0&&!e.D.noSlow&&(e.fcd||0)<=G.time&&Math.random()<Math.min(.25,AUG.freeze)){
  e.freeze=Math.max(e.freeze,e.D.boss?.3:.8); e.fcd=G.time+2;
  ring(e.x,e.y,e.r+9,'#bfe6ff',.35,2);
 }
 if(AUG.knock>0&&!e.D.boss&&(e.kcd||0)<=G.time&&Math.random()<Math.min(.35,AUG.knock)){
  e.kcd=G.time+1.2;
  e.dist=Math.max(0,e.dist-TILE*.8);
  const p=e.air?airAt(e.dist,e.lane):ptAt(e.dist,e.lane); e.x=p.x; e.y=p.y;
 }
 if(AUG.shredHit>0) e.brk=Math.min(15,(e.brk||0)+AUG.shredHit);
 if(AUG.splash>0&&dmg>0){
  const r=Math.min(80,AUG.splash), r2=r*r, n=G.enemies.length;
  for(let i=0;i<n;i++){
   const o2=G.enemies[i];
   if(!o2.alive||o2===e||d2(e.x,e.y,o2.x,o2.y)>r2) continue;

function scaleSup(L,pw){

 for(let i=0;i<ks.length;i++) if(o[ks[i]]!==undefined) o[ks[i]]=o[ks[i]]*pw;

/* 전용 증강(tf)은 레벨 수치 자체를 바꾼다 — 비율 증가 항목과 가산 항목을 구분한다 */
const TF_MUL={splash:1,prad:1,pool:1,vdps:1,vr:1,dot:1,burn:1,pull:1,push:1,wide:1,orbr:1,brad:1,stun:1,root:1,frz:1,cone:1};
function tlv(t){
 const L=t.D.lv[t.lv], b=AUG.tf[t.id];
 if(!b) return L;
 const o={};
 for(const k in L) o[k]=L[k];
 for(const f in b){
  const v=b[f];
  if(TF_MUL[f]) o[f]=(o[f]||0)*(1+v);
  else o[f]=(o[f]||0)+v;
 }
 return o;
}
function tstat(t){

    캐시가 없으면 타워 한 기당 프레임마다 객체를 서너 개씩 새로 만들게 된다. */
 if(t._sf===G.frame&&t._s) return t._s;
 const L=tlv(t), id=t.id, c=CAT_OF[id], sup=t.D.hits==='none';
 let dm=1+t.bd+AUG.dmg+(AUG.cDmg[c]||0)+(AUG.tDmg[id]||0);

 if(AUG.goldDmg) dm+=Math.min(1,AUG.goldDmg*Math.floor(G.gold/1000));
 if(AUG.lvDmg&&t.lv===3) dm+=AUG.lvDmg;
 dm=Math.max(.3,dm)*(1+uTowerMul(t));
 let rm=1+t.br+AUG.rate+(AUG.cRate[c]||0)+(AUG.tRate[id]||0)+(G.rushT>0?AUG.rush:0);
 if(G.spreeT>0) rm*=2;
 if(U.preheat&&G.preheatT>0) rm*=U.preheat;
 if(U.locomotive&&G.waveOn) rm*=1+Math.min(.8,U.locomotive*G.waveT);
 if(AUG.lv0Rate&&t.lv===0) rm+=AUG.lv0Rate;
 rm=Math.max(.3,rm);
 if(id==='gatling') rm*=1+(L.spin||0)*(t.spinup||0);
 const gm=Math.max(.5,1+t.bg+AUG.rng+(AUG.cRng[c]||0)+(AUG.tRng[id]||0));
 const s={};
 for(const k in L) s[k]=L[k];
 s.raw=L; s.perk=!!L.perk; s.pw=sup?supPow(t):1;
 s.dmg=(L.dmg||0)*dm; s.dps=(L.dps||0)*dm;
 s.dot=(L.dot||0)*dm; s.burn=(L.burn||0)*dm;
 s.pool=(L.pool||0)*dm; s.vdps=(L.vdps||0)*dm;
 s.fdmg=(L.fdmg||0)*dm; s.bdmg=(L.bdmg||0)*dm;
 s.rate=(L.rate||0)*rm;
 s.rng=sup?supRng(t):(L.rng||0)*gm;
 s.airx=L.airx||1;
 s.fall=L.fall===undefined?1:Math.min(1,L.fall);
 s.ramp=L.ramp||1; s.rup=L.rup||1;
 s.crit=L.crit||0; s.cmul=L.cmul||0;
 s.splash=L.splash||0; s.slow=L.slow||0; s.sdur=L.sdur||0; s.chain=L.chain||0;
 s.ddur=L.ddur||0; s.pellets=L.pellets||0; s.spread=L.spread||0; s.salvo=L.salvo||0;
 s.pdur=L.pdur||0; s.prad=L.prad||0; s.cap=L.cap||0; s.wide=L.wide||0;
 s.cone=L.cone||0; s.bdur=L.bdur||0; s.stun=L.stun||0; s.pull=L.pull||0;
 t._sf=G.frame; t._s=s;
 return s;
}

function applyAuras(){

  const L=tlv(t), R=supRng(t), r2=R*R, pw=supPow(t);

   }

function targetKey(t,e,dd){
 if(t.mode==='last') return -e.prog;
 if(t.mode==='strong') return e.hp+e.shield;
 if(t.mode==='close') return -dd;
 return e.prog;
}
function canHit(e,hits){
 if(e.air&&hits==='ground') return false;
 if(!e.air&&hits==='air') return false;
 return true;
}
function findTarget(t,s){
 const r2=s.rng*s.rng, hits=t.D.hits;
 let best=null,bk=-Infinity;
 const avoid=(U.spread&&t.lastTg&&t.lastTg.alive)?t.lastTg:null;
 for(let i=0;i<G.enemies.length;i++){
  const e=G.enemies[i];
  if(!e.alive||!canHit(e,hits)) continue;
  const dd=d2(t.x,t.y,e.x,e.y);
  if(dd>r2) continue;
  if(e===avoid) continue;
  const k=targetKey(t,e,dd);
  if(k>bk){ bk=k; best=e; }
 }
 if(!best&&avoid) best=avoid;
 if(U.spread) t.lastTg=best;
 return best;
}
function findTargets(t,s,n){
 const r2=s.rng*s.rng, hits=t.D.hits, list=[];
 for(let i=0;i<G.enemies.length;i++){
  const e=G.enemies[i];
  if(!e.alive||!canHit(e,hits)) continue;
  const dd=d2(t.x,t.y,e.x,e.y);
  if(dd>r2) continue;
  list.push({e:e,k:targetKey(t,e,dd)});
 }
 list.sort(function(a,b){ return b.k-a.k; });
 const out=[];
 for(let i=0;i<list.length&&i<n;i++) out.push(list[i].e);
 return out;
}
function aim(t,e){ t.ang=Math.atan2(e.y-t.y,e.x-t.x); }
function pullBack(e,amt){
 if(e.D.boss) amt*=.25;
 e.dist=Math.max(0,e.dist-amt);
 const p=e.air?airAt(e.dist,e.lane):ptAt(e.dist,e.lane);
 e.x=p.x; e.y=p.y;
}
function poison(e,dps,dur,cap,src){
 const st=e.pois;
 if(st.length<cap){ st.push({dps:dps,t:dur,src:src||null}); return; }
 let m=0; for(let i=1;i<st.length;i++) if(st[i].dps<st[m].dps) m=i;
 if(dps>=st[m].dps){ st[m].dps=dps; st[m].t=dur; st[m].src=src||null; }
 else st[m].t=Math.max(st[m].t,dur);
}
/* 직선 위의 적을 앞에서부터 수집 */
function rayHits(x,y,ang,len,wide,hits){
 const cx=Math.cos(ang), cy=Math.sin(ang), out=[], n=G.enemies.length;
 for(let i=0;i<n;i++){
  const e=G.enemies[i];
  if(!e.alive||!canHit(e,hits)) continue;
  const dx=e.x-x, dy=e.y-y, proj=dx*cx+dy*cy;
  if(proj<-8||proj>len) continue;
  if(Math.abs(dx*(-cy)+dy*cx)>wide*.5+e.r*.6) continue;
  out.push({e:e,d:proj});
 }
 out.sort(function(a,b){ return a.d-b.d; });
 return out;
}
/* 부채꼴 안의 적 */
function coneHits(t,rng,ang,cone,hits){
 const r2=rng*rng, out=[], n=G.enemies.length;
 for(let i=0;i<n;i++){
  const e=G.enemies[i];
  if(!e.alive||!canHit(e,hits)) continue;
  if(d2(t.x,t.y,e.x,e.y)>r2) continue;
  let da=Math.atan2(e.y-t.y,e.x-t.x)-ang;
  while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;
  if(Math.abs(da)>cone) continue;
  out.push(e);
 }

}
function splashAt(x,y,r,dmg,src,opt){
 opt=opt||{};
 const r2=r*r, n=G.enemies.length;
 for(let i=0;i<n;i++){
  const e=G.enemies[i];
  if(!e.alive) continue;
  if(e.air&&opt.groundOnly) continue;
  if(!e.air&&opt.airOnly) continue;
  const dd=d2(x,y,e.x,e.y);
  if(dd>r2) continue;
  const f=1-Math.sqrt(dd)/r*.45;
  hurt(e,dmg*f,{src:src,silent:opt.silent,aug:opt.aug});
  if(!e.alive) continue;
  if(opt.stun) e.stun=Math.max(e.stun,opt.stun);
  if(opt.slowAir&&e.air){ if(e.slow<opt.slowAir||e.slowT<=0) e.slow=Math.max(e.slow,opt.slowAir); e.slowT=Math.max(e.slowT,2); }

function addPool(x,y,r,dps,dur,src,opt){

function pathPick(t,rng,gap,list){
 if(!G.pathSamples||!G.pathSamples.length) return null;
 const r2=rng*rng, cand=[];
 for(let i=0;i<G.pathSamples.length;i++){
  const p=G.pathSamples[i];
  if(d2(t.x,t.y,p.x,p.y)>r2) continue;
  if(gap&&list){
   let near=false;
   for(let k=0;k<list.length;k++){
    if(list[k].src===t&&d2(p.x,p.y,list[k].x,list[k].y)<gap*gap){ near=true; break; }
   }
   if(near) continue;
  }
  cand.push(p);
 }
 return cand.length?cand[(Math.random()*cand.length)|0]:null;
}

function updateShots(dt){
 for(let i=G.shots.length-1;i>=0;i--){
  const p=G.shots[i];
  if(p.delay>0){ p.delay-=dt; continue; }
  if(p.k==='shell'){
   p.tt+=dt/p.dur;
   if(p.tt>=1){ explode(p); G.shots.splice(i,1); continue; }
   p.x=lerp(p.sx,p.ex,p.tt); p.y=lerp(p.sy,p.ey,p.tt);
   continue;
  }
  p.life-=dt;
  if(p.k==='pellet'){
   p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
   const n=G.enemies.length;
   for(let j=0;j<n;j++){
    const e=G.enemies[j];
    if(!e.alive||!canHit(e,p.hits)) continue;
    if(p.hitList&&p.hitList.indexOf(e)>=0) continue;
    const rr=e.r+4;
    if(d2(p.x,p.y,e.x,e.y)>rr*rr) continue;
    let dmg=p.dmg;
    if(p.perk&&p.src&&d2(p.src.x,p.src.y,e.x,e.y)<(TILE*2)*(TILE*2)) dmg*=2;
    hurt(e,dmg,{src:p.src,silent:true});
    burst(p.x,p.y,p.col,2,.6);
    if(p.pierce>0){ p.pierce--; if(p.hitList) p.hitList.push(e); }
    else { p.life=0; }
    break;
   }
   if(p.life<=0||p.x<-40||p.x>W+40||p.y<-40||p.y>H+40) G.shots.splice(i,1);
   continue;
  }
  if(p.k==='orb'){
   p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
   if(Math.random()<dt*30) part(p.x,p.y,rnd(-18,18),rnd(-18,18),.4,2.4,p.col);
   const n=G.enemies.length;
   for(let j=0;j<n;j++){
    const e=G.enemies[j];
    if(!e.alive||!canHit(e,p.hits)||p.hitList.indexOf(e)>=0) continue;
    const rr=e.r+p.r;
    if(d2(p.x,p.y,e.x,e.y)>rr*rr) continue;
    p.hitList.push(e);
    hurt(e,p.dmg,{src:p.src});
    burst(e.x,e.y,p.col,4,.9);
   }
   if(p.life<=0){
    if(p.split){
     for(let k=-1;k<=1;k++){
      G.shots.push({k:'orb',x:p.x,y:p.y,ang:p.ang+k*.55,spd:190,dmg:p.dmg*.5,src:p.src,col:p.col,
       life:.55,r:p.r*.8,hitList:[],split:0,hits:p.hits});
     }
     ring(p.x,p.y,p.r*2,p.col,.3,2);
    }
    G.shots.splice(i,1); continue;
   }
   if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40) G.shots.splice(i,1);
   continue;
  }
  if(p.k==='bmr'){
   if(p.out){
    p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
    p.trav+=p.spd*dt;
    if(p.trav>=p.max) p.out=0;
   } else {
    const sx=p.src?p.src.x:p.x, sy=p.src?p.src.y:p.y;
    const a=Math.atan2(sy-p.y,sx-p.x);
    p.x+=Math.cos(a)*p.spd*dt; p.y+=Math.sin(a)*p.spd*dt;
    if(d2(p.x,p.y,sx,sy)<200){ G.shots.splice(i,1); continue; }
   }
   const set=p.out?p.hitA:p.hitB, n=G.enemies.length;
   for(let j=0;j<n;j++){
    const e=G.enemies[j];
    if(!e.alive||!canHit(e,p.hits)||set.indexOf(e)>=0) continue;
    const rr=e.r+p.r;
    if(d2(p.x,p.y,e.x,e.y)>rr*rr) continue;
    set.push(e);
    hurt(e,p.dmg,{src:p.src});
    burst(p.x,p.y,p.col,3,.8);
   }
   if(p.life<=0) G.shots.splice(i,1);
   continue;
  }
  if(p.k==='rocket'){
   if(p.tg&&p.tg.alive){
    let want=Math.atan2(p.tg.y-p.y,p.tg.x-p.x), da=want-p.ang;
    while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;
    p.ang+=clamp(da,-p.turn*dt,p.turn*dt);
   }
   p.spd=Math.min(560,p.spd+620*dt);
   p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
   if(Math.random()<dt*40) part(p.x,p.y,rnd(-16,16),rnd(-16,16),.35,2.2,'#ffb98a');
   let boomIt=false;
   if(p.tg&&p.tg.alive){ const rr=p.tg.r+6; if(d2(p.x,p.y,p.tg.x,p.tg.y)<rr*rr) boomIt=true; }
   else if(p.life<=1.6) boomIt=true;
   if(boomIt){
    const mul=(p.tg&&p.tg.air)?(p.airx||1):1;
    boom(p.x,p.y,p.splash,'#ff9f6a');
    splashAt(p.x,p.y,p.splash,p.dmg*mul,p.src,{});
    SND.play('boom',80);
    G.shots.splice(i,1); continue;
   }
   if(p.life<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50) G.shots.splice(i,1);
   continue;
  }
  /* 유도 탄 (dart · glob) */
  if(p.tg&&p.tg.alive) p.ang=Math.atan2(p.tg.y-p.y,p.tg.x-p.x);
  p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
  if(p.k==='glob'&&Math.random()<dt*26) part(p.x,p.y,rnd(-14,14),rnd(-14,14),.32,2,p.col);
  if(p.tg&&p.tg.alive){
   const rr=p.tg.r+5;
   if(d2(p.x,p.y,p.tg.x,p.tg.y)<rr*rr){
    const tgt=p.tg;
    burst(p.x,p.y,p.col,4,.85);
    const dealt=hurt(tgt,p.dmg,{src:p.src});
    if(p.dot&&tgt.alive) poison(tgt,p.dot,p.ddur,p.cap,p.src);
    if(p.corr&&tgt.alive){
     tgt.acid=Math.min(30,(tgt.acid||0)+p.corr);
     if(p.acidPerk) tgt.acidPerk=1;
    }
    if(p.pull&&tgt.alive){
     pullBack(tgt,p.pull);
     if(p.chainPull){
      const n=G.enemies.length;
      for(let j=0;j<n;j++){
       const o=G.enemies[j];
       if(!o.alive||o===tgt||d2(tgt.x,tgt.y,o.x,o.y)>1600) continue;
       pullBack(o,p.pull*.5);
      }
     }
    }
    if(p.leech&&p.src){
     let gain=dealt*p.leech;
     if(p.leechPerk&&!tgt.alive) gain+=tgt.maxHp*.02;
     p.src.gacc=(p.src.gacc||0)+gain;
     if(p.src.gacc>=1){
      const g=Math.floor(p.src.gacc); p.src.gacc-=g;
      G.gold+=g; G.earned+=g; flashGold();
      say(p.src.x,p.src.y-18,'+'+g,'#e8ff6b',11);
     }
    }
    if(p.bomb&&tgt.alive){
     G.bombs.push({e:tgt,x:tgt.x,y:tgt.y,t:p.bomb.fuse,dmg:p.bomb.dmg,r:p.bomb.r,src:p.src,perk:p.bomb.perk});
    }
    if(p.frag) spawnFrags(p.x,p.y,p.frag,p.fdmg,p.src,p.col,p.fragPierce,p.src?p.src.D.hits:'both');
    if(p.airSplash){
     boom(p.x,p.y,p.airSplash,'#c9d4ff');
     splashAt(p.x,p.y,p.airSplash,p.dmg*.6,p.src,{airOnly:true,silent:true,slowAir:p.slowAir});
    }
    if(p.bounce>0){
     let nx=null,nd=115*115;
     for(let j=0;j<G.enemies.length;j++){
      const o=G.enemies[j];
      if(!o.alive||o===tgt||p.hitList.indexOf(o)>=0) continue;
      const dd=d2(p.x,p.y,o.x,o.y);
      if(dd<nd){ nd=dd; nx=o; }
     }
     p.hitList.push(tgt);
     if(nx){
      p.tg=nx; p.bounce--; p.dmg*=p.fall; p.life=1.6;
      bolt([{x:p.x,y:p.y},{x:nx.x,y:nx.y}],p.col,.12);
      continue;
     }
    }
    G.shots.splice(i,1); continue;
   }
  }
  if(p.life<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50) G.shots.splice(i,1);
 }
}
/* 집속 광선 · 지속 조사 */
function updateBeam(t,dt){
 const s=tstat(t);
 t.cc=t.bc+AUG.crit; t.cm=1.9+t.bcm+AUG.critMul;
 const r2=s.rng*s.rng;
 if(t.lock&&(!t.lock.alive||d2(t.x,t.y,t.lock.x,t.lock.y)>r2)) t.lock=null;
 if(!t.lock){ t.lock=findTarget(t,s); t.lockT=0; }
 if(!t.lock){ t.lockT=Math.max(0,t.lockT-dt*2); return; }
 aim(t,t.lock);
 t.lockT=Math.min(s.rup,t.lockT+dt);
 const ramp=1+(s.ramp-1)*(t.lockT/s.rup);
 const full=t.lockT>=s.rup-.01;
 hurt(t.lock,s.dps*ramp*dt,{src:t,silent:true,nocrit:true,pen:(s.perk&&full)?1:0});
 t.recoil=.35+.3*Math.sin(G.time*40);
 if(Math.random()<dt*30) part(t.lock.x+rnd(-6,6),t.lock.y+rnd(-6,6),rnd(-30,30),rnd(-40,-10),.4,2.4,'#ff9fb0');
 if(Math.random()<dt*3) SND.play('venom',260);
}

function updatePools(dt){
 for(let i=G.pools.length-1;i>=0;i--){
  const p=G.pools[i];
  p.life-=dt;
  if(p.life<=0){ G.pools.splice(i,1); continue; }
  const r2=p.r*p.r, n=G.enemies.length;
  for(let j=0;j<n;j++){
   const e=G.enemies[j];
   if(!e.alive||d2(p.x,p.y,e.x,e.y)>r2) continue;
   if(e.air&&p.ground) continue;
   let mul=1;
   if(p.perk){
    let over=0;
    for(let k=0;k<G.pools.length;k++){
     const q=G.pools[k];
     if(q!==p&&d2(q.x,q.y,e.x,e.y)<=q.r*q.r) over++;
    }
    if(over) mul=1.5;
   }
   hurt(e,p.dps*mul*dt,{src:p.src,silent:true,nocrit:true,tick:true,pure:p.pure});
   if(!e.alive) continue;
   if(p.slow&&!e.D.noSlow){
    if(e.slow<p.slow||e.slowT<=0) e.slow=Math.max(e.slow,p.slow);
    e.slowT=Math.max(e.slowT,.3);
   }
   if(p.half) e.gasT=G.time+.25;
   if(p.burn) poison(e,p.burn,2,3,p.src);
  }
  if(Math.random()<dt*24) part(p.x+rnd(-p.r,p.r)*.7,p.y+rnd(-p.r,p.r)*.7,rnd(-8,8),-rnd(10,32),.5,2.4,p.col||'#d9a6ff');
 }
}
function updateMines(dt){

 for(let i=0;i<list.length;i++){
  const m=list[i];
  if(m.gone) continue;
  m.t+=dt;
  if(m.t<.35) continue;
  const n=G.enemies.length;
  for(let j=0;j<n;j++){
   const e=G.enemies[j];
   if(!e.alive||e.air) continue;
   const rr=e.r+12;

  }

/* 폭발한 지뢰는 gone으로 표시하고 객체 기준으로 제거 — 연쇄 폭발 중 인덱스가 어긋나지 않게 */
function detonate(m,trig){
 if(!m||m.gone) return;
 m.gone=true;
 const i=G.mines.indexOf(m);
 if(i>=0) G.mines.splice(i,1);
 if(m.snare){
  ring(m.x,m.y,30,'#c9a26b',.4,2.5);
  SND.play('cryo',120);
  const n=G.enemies.length;
  for(let j=0;j<n;j++){
   const e=G.enemies[j];
   if(!e.alive||e.air) continue;
   const near=(e===trig)||(m.perk&&d2(m.x,m.y,e.x,e.y)<2500);
   if(!near) continue;
   hurt(e,m.dmg,{src:m.src,silent:true});
   if(e.alive) e.stun=Math.max(e.stun,e.D.boss?m.root*.4:m.root);
  }
  return;
 }
 boom(m.x,m.y,m.splash,'#ffb43d');
 G.shake=Math.max(G.shake,5);
 SND.play('boom',60);
 splashAt(m.x,m.y,m.splash,m.dmg,m.src,{groundOnly:true});
 for(let k=0;k<14;k++){ const a=Math.random()*TAU,v=rnd(50,210);
  part(m.x,m.y,Math.cos(a)*v,Math.sin(a)*v,rnd(.24,.6),rnd(2,4.4),k%3?'#ffb43d':'#ffe6b0'); }
 if(m.perk){
  const r=m.splash*1.15, r2=r*r, victims=[];
  for(let k=0;k<G.mines.length;k++){
   const o=G.mines[k];
   if(!o.gone&&d2(m.x,m.y,o.x,o.y)<r2) victims.push(o);
  }
  for(let k=0;k<victims.length;k++) detonate(victims[k],trig);
 }
}
/* 시한 폭탄 — 숙주가 먼저 죽으면 그 자리에서 즉시 터진다 */
function updateBombs(dt){
 for(let i=G.bombs.length-1;i>=0;i--){
  const b=G.bombs[i];
  if(b.e&&b.e.alive){ b.x=b.e.x; b.y=b.e.y; }
  b.t-=dt;
  const dead=!b.e||!b.e.alive;
  if(b.t>0&&!dead) continue;
  G.bombs.splice(i,1);
  boom(b.x,b.y,b.r,'#ff5c5c');
  G.shake=Math.max(G.shake,6);
  SND.play('boom',70);
  const victims=[];
  if(b.perk){
   const r2=b.r*b.r, n=G.enemies.length;
   for(let j=0;j<n;j++){
    const e=G.enemies[j];
    if(e.alive&&d2(b.x,b.y,e.x,e.y)<=r2) victims.push(e);
   }
  }
  splashAt(b.x,b.y,b.r,b.dmg,b.src,{});
  for(let j=0;j<victims.length;j++){
   const e=victims[j];
   if(e.alive) G.bombs.push({e:e,x:e.x,y:e.y,t:b.t+1.2,dmg:b.dmg*.5,r:b.r*.8,src:b.src,perk:0});
  }
 }
}
/* 자폭 크롤러 — 회랑을 거슬러 올라간다 */
function updateCrawlers(dt){
 for(let i=G.crawlers.length-1;i>=0;i--){
  const c=G.crawlers[i];
  c.life-=dt;
  c.d-=c.spd*dt;
  if(c.d<=0||c.life<=0){ G.crawlers.splice(i,1); continue; }
  const p=ptAt(c.d,c.lane);
  c.x=p.x; c.y=p.y;
  if(Math.random()<dt*12) part(c.x,c.y,rnd(-12,12),rnd(-12,12),.3,1.8,'#ffa347');
  let hit=null;
  const n=G.enemies.length;
  for(let j=0;j<n;j++){
   const e=G.enemies[j];
   if(!e.alive||e.air) continue;
   const rr=e.r+11;
   if(d2(c.x,c.y,e.x,e.y)<rr*rr){ hit=e; break; }
  }
  if(!hit) continue;
  G.crawlers.splice(i,1);
  boom(c.x,c.y,c.splash,'#ffa347');
  G.shake=Math.max(G.shake,5);
  SND.play('boom',60);
  splashAt(c.x,c.y,c.splash,c.dmg,c.src,{groundOnly:true});
  if(c.perk&&!c.mini){
   for(let k=0;k<2;k++){
    G.crawlers.push({lane:c.lane,d:Math.max(4,c.d+(k?16:-16)),x:c.x,y:c.y,spd:90,dmg:c.dmg*.5,
     splash:c.splash*.7,src:c.src,life:5,perk:0,mini:1});
   }
  }
 }
}
/* 소용돌이 — 적을 한 점으로 끌어모은다 */
function updateVortex(dt){
 for(let i=G.vortex.length-1;i>=0;i--){
  const v=G.vortex[i];
  v.life-=dt;
  if(v.life<=0){
   if(v.perk){
    boom(v.x,v.y,v.r,'#8f7bff');
    splashAt(v.x,v.y,v.r,v.dps*6,v.src,{groundOnly:true});
    SND.play('boom',70);
   }
   G.vortex.splice(i,1); continue;
  }
  const r2=v.r*v.r, n=G.enemies.length;
  for(let j=0;j<n;j++){
   const e=G.enemies[j];
   if(!e.alive||e.air||e.lane!==(v.lane||0)||d2(v.x,v.y,e.x,e.y)>r2) continue;
   hurt(e,v.dps*dt,{src:v.src,silent:true,nocrit:true,tick:true});
   if(!e.alive) continue;
   const pull=Math.min(1,(e.D.boss?.9:2.6)*dt);
   e.dist+=(v.d0-e.dist)*pull;
   const p=ptAt(e.dist,e.lane);
   e.x=p.x; e.y=p.y;
  }
  if(Math.random()<dt*30){
   const a=Math.random()*TAU;
   part(v.x+Math.cos(a)*v.r,v.y+Math.sin(a)*v.r,-Math.cos(a)*90,-Math.sin(a)*90,.4,2.4,'#b6a6ff');
  }
 }
}
/* 회전 칼날 — 붙어 있는 동안 계속 벤다 */
function updateBlade(t,dt){
 const s=tstat(t);
 t.cc=t.bc+AUG.crit; t.cm=1.9+t.bcm+AUG.critMul;
 const r2=s.rng*s.rng, n=G.enemies.length;
 const bleed=(s.perk?.3:0)+(s.bleed||0);
 let hit=0;
 for(let i=0;i<n;i++){
  const e=G.enemies[i];
  if(!e.alive||d2(t.x,t.y,e.x,e.y)>r2) continue;
  hit++;
  hurt(e,s.dps*dt,{src:t,silent:true,nocrit:true,tick:true});
  if(e.alive&&bleed>0) poison(e,s.dps*bleed,3,1,t);
 }
 if(hit&&Math.random()<dt*20){
  const a=Math.random()*TAU;
  part(t.x+Math.cos(a)*s.rng*.8,t.y+Math.sin(a)*s.rng*.8,rnd(-20,20),rnd(-20,20),.3,2,'#e0e6ff');
 }
 if(hit&&Math.random()<dt*4) SND.play('pulse',180);
}
/* ═══════════ 침공체 갱신 ═══════════ */
function updateEnemies(dt){
 if(U.crowd&&G.frame%6===0){
  const n=G.enemies.length, R=TILE*1.5, R2=R*R;
  for(let i=0;i<n;i++){
   const e=G.enemies[i]; if(!e.alive) continue;
   let c=0;
   for(let j=0;j<n;j++){ const o=G.enemies[j]; if(o.alive&&d2(e.x,e.y,o.x,o.y)<=R2) c++; }
   e.packed=c>=5;
  }
 }
 let bosses=null;
 for(let i=0;i<G.enemies.length;i++){
  const e=G.enemies[i]; e.hasted=false;
  if(e.alive&&e.D.aura){ if(!bosses) bosses=[]; bosses.push(e); }
 }
 G.bossOn=!!bosses;
 if(bosses) for(let b=0;b<bosses.length;b++){
  const B=bosses[b], r2=B.D.aura.rad*B.D.aura.rad;
  for(let i=0;i<G.enemies.length;i++){ const e=G.enemies[i];
   if(e.alive&&e!==B&&d2(B.x,B.y,e.x,e.y)<r2) e.hasted=true; }
 }

 for(let i=G.enemies.length-1;i>=0;i--){
  const e=G.enemies[i];
  if(!e.alive){ G.enemies.splice(i,1); continue; }
  e.age+=dt; e.wob+=dt*6.5;
  if(e.hitT>0) e.hitT-=dt;
  if(e.slowT>0){ e.slowT-=dt; if(e.slowT<=0) e.slow=0; }
  if(e.freeze>0) e.freeze-=dt;
  if(e.stun>0) e.stun-=dt;

  if(e.pois.length){
   let any=false;
   for(let k=e.pois.length-1;k>=0;k--){
    const q=e.pois[k]; q.t-=dt;
    if(q.dps>0){ any=true; hurt(e,q.dps*dt,{pure:true,silent:true,src:q.src}); }
    if(q.t<=0) e.pois.splice(k,1);
    if(!e.alive) break;
   }
   if(any&&Math.random()<dt*8) part(e.x+rnd(-6,6),e.y+rnd(-6,6),rnd(-9,9),-rnd(12,30),.5,2,'#7dff9b');
   if(!e.alive){ G.enemies.splice(i,1); continue; }
  }

  if(e.D.shield){
   if(e.shieldT>0) e.shieldT-=dt;
   else if(e.shield<e.shieldMax){
    const scale=e.shieldMax/e.D.shield.amt;
    e.shield=Math.min(e.shieldMax,e.shield+e.D.shield.regen*scale*dt*Math.max(.1,1-AUG.shieldRegenCut));
   }
  }

  if(e.D.heal){
   e.healCd-=dt;
   if(e.healCd<=0){
    e.healCd=e.D.heal.cd;
    const r2=e.D.heal.rad*e.D.heal.rad, amt=e.D.heal.amt*hpScale(e.waveN)*Math.max(.1,1-AUG.antiHeal); let n=0;
    for(let j=0;j<G.enemies.length;j++){
     const o=G.enemies[j];
     if(!o.alive||o===e||o.hp>=o.maxHp) continue;
     if(d2(e.x,e.y,o.x,o.y)>r2) continue;
     o.hp=Math.min(o.maxHp,o.hp+amt);
     beam(e.x,e.y,o.x,o.y,'#6effc4',.32,2);
     if(++n>=3) break;
    }
    if(n) ring(e.x,e.y,e.D.heal.rad,'#6effc4',.42,1.5);
   }
  }

  if(e.D.spawn){
   e.spawnCd-=dt;
   if(e.spawnCd<=0){
    e.spawnCd=e.D.spawn.cd;
    for(let k=0;k<e.D.spawn.n;k++){
     const s=makeEnemy(e.D.spawn.type,e.waveN,Math.max(0,e.dist-22-k*14));
     G.enemies.push(s);
    }
    ring(e.x,e.y,44,'#ff5b6e',.4,2.5);
   }
  }

  let sp=e.spd;
  if(e.slowT>0) sp*=(1-e.slow);
  if(e.hasted) sp*=e.D.aura?1:1.22;
  if(e.freeze>0||e.stun>0) sp=0;
  e.dist+=sp*dt;

  const LP=PATH(e.lane), len=e.air?LP.airLen:LP.total;
  e.prog=e.dist/len;
  if(e.dist>=len){ leak(e); G.enemies.splice(i,1); continue; }
  const p=e.air?airAt(e.dist,e.lane):ptAt(e.dist,e.lane);
  e.x=p.x; e.y=p.y; e.ang=p.ang;
 }
}

function startWave(){
 if(G.waveOn||G.scene!=='play') return;
 G.wave++;
 G.waveOn=true; G.waveT=0; G.queue=[]; G.fbDone=0; G.perfectWave=1; G.waveProg=0;
 G.perfectOn=!!(U.perfect&&G.lastPerfect); G.snowKills=0; G.preheatT=U.preheat?4:0;
 let shGen=0;
 for(let i=0;i<G.towers.length;i++){ const t=G.towers[i]; if(t.id==='bulwark') shGen+=tlv(t).sh*supPow(t); }
 G.shBank=(G.shBank||0)+shGen;
 G.cShield=Math.round(AUG.coreShield)+Math.floor(G.shBank);
 G.shBank-=Math.floor(G.shBank);
 const def=waveDef(G.wave);
 const mul=G.chaos?chaosCount(G.wave):1;
 let boss=false;
 for(let i=0;i<def.length;i++){
  const g=def[i];
  if(g[0]==='boss') boss=true;
  const cnt=g[0]==='boss'?g[1]:Math.round(g[1]*mul);
  for(let k=0;k<cnt;k++) G.queue.push({t:g[0],at:g[3]+k*g[2]});
 }
 G.queue.sort((a,b)=>a.at-b.at);
 G.waveTotal=G.queue.length;
 banner('WAVE '+G.wave, boss?'경보 · 파괴자 접근':(G.chaos?'아수라장':(G.endless?'무한 교전':'')));
 SND.play(boss?'bossin':'wave');
 SND.intensity=clamp(G.wave/22,0,1);
 feed('<b>웨이브 '+G.wave+'</b> 교전 개시'+(boss?' · 보스 등장':''),boss?'bad':'');
 if(G.coop&&!G.coopSolo&&NET.host) NET.send({k:'wave',n:G.wave});
 syncUI();
}
function endWave(){
 G.waveOn=false; G.verdictDone=0;
 G.mines=[]; G.pools=[]; G.bombs=[]; G.crawlers=[]; G.vortex=[];
 G.lastPerfect=!!G.perfectWave;
 let bonus=Math.round((22+G.wave*3.4)*(1+AUG.goldWave)*(G.chaos?1.5:1));
 if(U.speedrun) bonus*=U.speedrun;
 if(U.allin) bonus*=U.allin;
 if(U.gambler){ const w=Math.random()<.5; bonus=w?bonus*2:0;
  feed(w?'<b>도박 성공</b> · 보너스 2배':'<b>도박 실패</b> · 보너스 없음',w?'good':'bad'); }
 bonus=Math.round(bonus);
 /* 채굴기 생산 */
 let mined=0, repair=0, compound=0;
 for(let i=0;i<G.towers.length;i++){
  const t=G.towers[i], L=tlv(t);
  if(t.id==='mint'){ mined+=Math.round(L.yield*supPow(t)); if(t.lv===3) compound+=.03+(L.comp||0); }
  else if(t.id==='mender') repair+=L.rep*supPow(t);
 }
 const interest=Math.round(G.gold*(AUG.interest+compound));
 const lifeBonus=Math.round(G.lives*AUG.lifeGold);
 bonus+=mined+interest+lifeBonus;
 G.gold+=bonus; G.earned+=bonus; flashGold();
 G.score+=Math.round(150*G.D.mult);
 say(G.core.x,G.core.y-48,'+'+bonus,'#ffc247',19);
 let msg='웨이브 '+G.wave+' 방어 성공 · <b>+'+bonus+'</b> 에너지';
 if(mined) msg+=' (채굴 '+mined+')';
 if(interest) msg+=' (이자 '+interest+')';
 feed(msg,'good');
 /* 수리 · 재생 */
 if(repair>0||AUG.regen>0){
  G.repBank=(G.repBank||0)+repair+AUG.regen;

  if(repair+AUG.regen>0&&G.lives<cap) feed('코어 수리 진행 <b>'+Math.floor((G.repBank%1)*100)+'%</b>');
 }
 SND.intensity=.25;
 if(!G.endless&&!G.chaos&&G.wave>=LAST_WAVE){ finish(true); return; }
 if(G.chaos&&G.wave%10===0) banner('생존 '+G.wave+' 웨이브','아수라장 돌파');
 if(U.autotune&&G.towers.length){
  const pool=G.towers.filter(function(t){ return t.lv<3; });
  if(pool.length){ const t=pool[(Math.random()*pool.length)|0]; t.lv++; G.buffsDirty=true;
   ring(t.x,t.y,60,t.D.col,.6,3); feed('<b>자동 정비</b> · '+t.D.name+' 강화','good'); }
 }
 G.prepMax=(G.chaos?14:12)+AUG.prepBonus; G.prep=G.prepMax;
 if(U.speedrun) G.prep=0.01;
 syncUI();
 if(G.chaos&&(G.wave===1||(G.wave-1)%3===0)){ offerAugments(); return; }
}

/* ═══════════ 진행 ═══════════ */
function step(dt){
 G.time+=dt; G.frame++;
 if(G.shake>0) G.shake=Math.max(0,G.shake-dt*40);
 if(G.flash>0) G.flash=Math.max(0,G.flash-dt*2.4);

 /* 수명이 끝난 이펙트는 splice 로 하나씩 빼지 않고 한 번에 앞으로 당겨 정리한다 */
 /* 고정 스텝(dt=FIX)에서는 감쇠 계수의 거듭제곱이 1제곱이라 계산을 건너뛴다 */
 const fixed=dt===FIX;
 let w=0;
 const fx=G.fx;
 for(let i=0;i<fx.length;i++){ const f=fx[i]; f.life-=dt; if(f.life>0) fx[w++]=f; }
 fx.length=w;
 const ps=G.parts; w=0;
 for(let i=0;i<ps.length;i++){
  const p=ps[i]; p.life-=dt;
  if(p.life<=0) continue;
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt;
  const k=fixed?p.drag:Math.pow(p.drag,dt*60); p.vx*=k; p.vy*=k;
  ps[w++]=p;
 }
 ps.length=w;
 const tx=G.texts; w=0;
 for(let i=0;i<tx.length;i++){
  const q=tx[i]; q.life-=dt;
  if(q.life<=0) continue;
  q.y+=q.vy*dt; q.x+=q.vx*dt; q.vy*=fixed?.945:Math.pow(.945,dt*60);
  tx[w++]=q;
 }
 tx.length=w;
 if(G.scene!=='play') return;

 /* 버프는 타워를 짓거나 팔거나 강화할 때만 바뀐다 — 매 프레임 O(타워²)로 다시 계산하지 않는다 */
 if(G.buffsDirty){ refreshBuffs(); }
 uStep(dt);
 if(G.rushT>0) G.rushT-=dt;
 if(!G.waveOn&&G.prep>0&&AUG.prepGold>0){ G.pAcc+=AUG.prepGold*dt; if(G.pAcc>=1){ const g=Math.floor(G.pAcc); G.pAcc-=g; G.gold+=g; G.earned+=g; } }
 if(G.waveOn&&AUG.passive>0){ G.pAcc+=AUG.passive*dt; if(G.pAcc>=1){ const g=Math.floor(G.pAcc); G.pAcc-=g; G.gold+=g; G.earned+=g; } }

 if(G.preheatT>0) G.preheatT-=dt;
 if(G.waveOn){
  G.waveT+=dt;
 if(U.verdict&&G.waveOn&&!G.queue.length&&G.enemies.length===1&&G.enemies[0].alive&&!G.enemies[0].D.boss&&!G.verdictDone){
   G.verdictDone=1;
   const e=G.enemies[0];
   say(e.x,e.y-24,'심판','#ff6bd6',16); boom(e.x,e.y,60,'#ff6bd6');
   hurt(e,e.hp+e.shield+1e6,{src:null,silent:true,nocrit:true,pen:1,ignoreShield:true});
  }
  while(G.queue.length&&G.queue[0].at<=G.waveT){
   const q=G.queue.shift();
   if(G.coop&&G.side<0){ G.enemies.push(makeEnemy(q.t,G.wave,0,0)); G.enemies.push(makeEnemy(q.t,G.wave,0,1)); }
   else G.enemies.push(makeEnemy(q.t,G.wave,0,G.side<0?0:G.side));
  }
  G.waveProg=G.queue.length?(1-G.queue.length/Math.max(1,G.waveTotal||1)):1;
  if(!G.queue.length&&!G.enemies.length) endWave();
 } else if(G.prep>0){
  G.prep-=dt;
  if(G.prep<=0){ G.prep=0; if(G.auto&&(!G.coop||G.coopSolo||NET.host)) startWave(); }
 }

 if(G.coop&&!G.coopSolo){
  decGhost();
  G.lives=coopLives();
  NET.push(false);
  /* 상대가 끊기면 남은 쪽이 웨이브 진행을 넘겨받는다 */
  if(!NET.host&&!NET.partner&&performance.now()-NET.lastSeen>6000){
   NET.host=true; feed('상대 연결이 끊겼습니다 · 웨이브 진행을 넘겨받습니다','warn');
  }
  if(G.lives<=0&&G.scene==='play'){ finish(false); return; }
 }
 applyAuras();
 updateEnemies(dt);

 for(let i=0;i<G.towers.length;i++){
  const t=G.towers[i];
  if(t.recoil>0) t.recoil=Math.max(0,t.recoil-dt*6.5);
  t.spin+=dt;
  if(t.id==='gatling') t.spinup=Math.max(0,(t.spinup||0)-dt*(t.lv===3?.12:.6));
  if(t.D.hits==='none') continue;
  if(t.id==='beam'){ updateBeam(t,dt); continue; }
  if(t.id==='blade'){ updateBlade(t,dt); continue; }
  t.cd-=dt;
  if(t.cd<=0){
   if(fire(t)){
    const s=tstat(t); t.cd=1/Math.max(.05,s.rate);
    t.lastFire=G.time; t.twinReady=0;
    if(U.overload){ t.shots=(t.shots||0)+1;
     if(t.shots>=25){ t.shots=0; boom(t.x,t.y,70,'#ffb066'); splashAt(t.x,t.y,70,tstat(t).dmg*3,t,{}); SND.play('boom',80); } }
    if(U.barrelroll&&Math.random()<U.barrelroll) t.cd=Math.min(t.cd,.06);
    if(t.id==='gatling') t.spinup=Math.min(1,(t.spinup||0)+.1);
    const mc=Math.min(.6,AUG.multi+(t.bm||0));
    if(mc>0&&Math.random()<mc) t.cd=Math.min(t.cd,.07);
   }
   else t.cd=.09;
  }
 }
 updateShots(dt);
 updatePools(dt);
 updateMines(dt);
 updateBombs(dt);
 updateCrawlers(dt);
 updateVortex(dt);
}

const cv=$('#game'), cx=cv.getContext('2d');

function poly(g,x,y,r,n,rot){
 g.beginPath();
 for(let i=0;i<n;i++){
  const a=rot+i/n*TAU, px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
  if(i) g.lineTo(px,py); else g.moveTo(px,py);
 }
 g.closePath();
}
function pathLine(g,l){
 const p=PATH(l).pts;
 g.beginPath(); g.moveTo(p[0].x,p[0].y);
 for(let i=1;i<p.length;i++) g.lineTo(p[i].x,p[i].y);
}
function shard(g,tx,ty){
 const x=(tx+.5)*TILE, y=(ty+.5)*TILE;
 g.save(); g.translate(x,y);
 for(let i=0;i<3;i++){
  const a=i*2.1+tx*.7+ty*.4, r=11+((i*7+tx*3+ty*5)%5)*1.7;
  const ox=Math.cos(a)*7, oy=Math.sin(a)*6;
  g.fillStyle='rgba(23,38,72,.95)'; g.strokeStyle='rgba(125,170,255,.26)'; g.lineWidth=1;
  g.beginPath();
  g.moveTo(ox,oy-r); g.lineTo(ox+r*.55,oy); g.lineTo(ox,oy+r*.72); g.lineTo(ox-r*.55,oy);
  g.closePath(); g.fill(); g.stroke();
 }
 g.restore();
}
function buildBG(){

 const g=c.getContext('2d');

 g.fillStyle=grad; g.fillRect(0,0,W,H);

              [W*.56,H*.1,280,'rgba(0,200,255,.07)'],[W*.3,H*.9,300,'rgba(255,60,120,.05)']];
 for(let i=0;i<blobs.length;i++){
  const b=blobs[i], rg=g.createRadialGradient(b[0],b[1],0,b[0],b[1],b[2]);
  rg.addColorStop(0,b[3]); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg; g.fillRect(0,0,W,H);
 }
 for(let i=0;i<130;i++){
  const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.1+.3;
  g.fillStyle='rgba(200,225,255,'+(.06+Math.random()*.22)+')';

 }
 g.strokeStyle='rgba(120,170,255,.05)'; g.lineWidth=1; g.beginPath();
 for(let x=0;x<=COLS;x++){ g.moveTo(x*TILE+.5,0); g.lineTo(x*TILE+.5,H); }
 for(let y=0;y<=ROWS;y++){ g.moveTo(0,y*TILE+.5); g.lineTo(W,y*TILE+.5); }
 g.stroke();
 g.fillStyle='rgba(125,170,255,.13)';
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
  if(onPath(x,y)||G.blocked.has(x+','+y)) continue;

 }
 for(let i=0;i<G.map.blocks.length;i++) shard(g,G.map.blocks[i][0],G.map.blocks[i][1]);
 g.lineCap='round'; g.lineJoin='round';
 for(let l=0;l<G.paths.length;l++){
  pathLine(g,l); g.strokeStyle='rgba(47,224,255,.07)'; g.lineWidth=40; g.stroke();
  pathLine(g,l); g.strokeStyle=l?'rgba(255,107,214,.2)':'rgba(47,224,255,.22)'; g.lineWidth=30; g.stroke();
  pathLine(g,l); g.strokeStyle='#0a1226'; g.lineWidth=26.5; g.stroke();
  g.save(); g.globalAlpha=.5;
  pathLine(g,l); g.strokeStyle='rgba(60,110,190,.35)'; g.lineWidth=1; g.setLineDash([2,9]); g.stroke();
  g.restore();
 }
 return c;
}

function drawShape(g,e,col){
 const r=e.r, t=G.time, s=e.D.shape;
 if(s==='square'){
  g.rotate(t*1.3+e.wob*.08); poly(g,0,0,r,4,0); g.fill(); g.stroke();
  g.fillStyle=col; poly(g,0,0,r*.4,4,Math.PI/4); g.fill();
 } else if(s==='tri'){
  g.rotate(e.ang);
  g.beginPath(); g.moveTo(r*1.3,0); g.lineTo(-r*.8,r*.85); g.lineTo(-r*.3,0); g.lineTo(-r*.8,-r*.85);
  g.closePath(); g.fill(); g.stroke();
 } else if(s==='hex'){
  g.rotate(t*.45);
  poly(g,0,0,r,6,0); g.fill(); g.stroke();
  g.save(); g.globalAlpha=.5; g.lineWidth=3.4; poly(g,0,0,r*.72,6,Math.PI/6); g.stroke(); g.restore();
  g.fillStyle=col; poly(g,0,0,r*.3,6,0); g.fill();
 } else if(s==='wing'){
  g.rotate(e.ang);
  const f=Math.sin(t*13+e.wob)*.45;
  g.beginPath(); g.moveTo(0,0); g.lineTo(-r*.95,-r*(1.05+f)); g.lineTo(-r*.15,-r*.25); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(0,0); g.lineTo(-r*.95, r*(1.05+f)); g.lineTo(-r*.15, r*.25); g.closePath(); g.fill(); g.stroke();
  poly(g,0,0,r*.6,4,0); g.fill(); g.stroke();
 } else if(s==='orb'){
  g.beginPath(); g.arc(0,0,r,0,TAU); g.fill(); g.stroke();
  g.save(); g.rotate(t*2.1); g.globalAlpha=.75; g.lineWidth=2;
  for(let i=0;i<3;i++){ g.beginPath(); g.arc(0,0,r*.58,i/3*TAU,i/3*TAU+.95); g.stroke(); }
  g.restore();
 } else if(s==='plus'){
  g.rotate(t*.85);
  const a=r*.4;
  g.beginPath();
  g.moveTo(-a,-r); g.lineTo(a,-r); g.lineTo(a,-a); g.lineTo(r,-a); g.lineTo(r,a); g.lineTo(a,a);
  g.lineTo(a,r); g.lineTo(-a,r); g.lineTo(-a,a); g.lineTo(-r,a); g.lineTo(-r,-a); g.lineTo(-a,-a);
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle=col; g.beginPath(); g.arc(0,0,r*.28,0,TAU); g.fill();
 } else if(s==='oct'){
  g.rotate(t*.38); poly(g,0,0,r,8,Math.PI/8); g.fill(); g.stroke();
  g.fillStyle=col; poly(g,0,0,r*.33,8,0); g.fill();
 } else if(s==='star'){
  g.globalAlpha=.55+Math.sin(t*8+e.wob)*.28;
  g.rotate(t*1.05);
  g.beginPath();
  for(let i=0;i<10;i++){
   const rr=i%2?r*.44:r, a=i/10*TAU, px=Math.cos(a)*rr, py=Math.sin(a)*rr;
   if(i) g.lineTo(px,py); else g.moveTo(px,py);
  }
  g.closePath(); g.fill(); g.stroke(); g.globalAlpha=1;
 } else if(s==='boss'){
  g.save(); g.rotate(-t*.55); g.globalAlpha=.45; g.lineWidth=2.5; poly(g,0,0,r*1.4,3,0); g.stroke(); g.restore();
  g.save(); g.rotate(t*.85); g.globalAlpha=.55; g.lineWidth=2; poly(g,0,0,r*1.16,6,0); g.stroke(); g.restore();
  g.lineWidth=3; poly(g,0,0,r,8,Math.PI/8); g.fill(); g.stroke();
  g.save(); g.rotate(t*1.7); g.fillStyle=col; poly(g,0,0,r*.44,3,0); g.fill(); g.restore();
 }
}

const AURAVIS={amp:1,chrono:1,radar:1,curse:1,stasis:1,bounty:1,overclock:1};
function drawTowers(g){
 for(let i=0;i<G.towers.length;i++){
  const t=G.towers[i];
  if(AURAVIS[t.id]){
   const R=supRng(t);
   g.save(); g.globalAlpha=.05+Math.sin(G.time*2+i)*.015;
   g.fillStyle=t.D.col; g.beginPath(); g.arc(t.x,t.y,R,0,TAU); g.fill(); g.restore();
  }
  if(t.id==='blade'){
   const s=tstat(t), R=s.rng*.82, blades=s.perk?6:3;
   g.save(); g.translate(t.x,t.y);
   g.globalAlpha=.12; g.fillStyle=t.D.col;
   g.beginPath(); g.arc(0,0,s.rng,0,TAU); g.fill();
   g.globalAlpha=1;
   if(!G.lowfx){ g.shadowColor=t.D.col; g.shadowBlur=10; }
   g.strokeStyle=t.D.col; g.lineWidth=3; g.lineCap='round';
   for(let b=0;b<blades;b++){
    const a=t.spin*7+b/blades*TAU;
    g.beginPath();
    g.moveTo(Math.cos(a)*R*.55,Math.sin(a)*R*.55);
    g.lineTo(Math.cos(a)*R,Math.sin(a)*R);
    g.stroke();
   }
   g.lineCap='butt'; g.shadowBlur=0;
   g.restore();
  }
  towerArt(g,t.id,t.lv,t.x,t.y,t.ang,t.recoil,t.spin);
  if(t.bd>0){
   g.save(); g.fillStyle='#ff5fa2'; g.globalAlpha=.85;
   const n=Math.min(3,Math.ceil(t.bd/.16));
   for(let k=0;k<n;k++){ g.beginPath(); g.arc(t.x-6+k*6,t.y+18,1.7,0,TAU); g.fill(); }
   g.restore();
  }
 }
}

  } else if(p.k==='rocket'){
   g.save(); g.translate(p.x,p.y); g.rotate(p.ang);
   g.fillStyle=p.col;
   if(!G.lowfx){ g.shadowColor=p.col; g.shadowBlur=12; }
   g.beginPath(); g.moveTo(8,0); g.lineTo(-4,2.6); g.lineTo(-4,-2.6); g.closePath(); g.fill();
   g.fillStyle='rgba(255,230,180,.9)';

   g.restore();
  } else {
   g.save(); g.fillStyle=p.col;
   if(!G.lowfx){ g.shadowColor=p.col; g.shadowBlur=13; }
   g.beginPath(); g.arc(p.x,p.y,4.6+Math.sin(G.time*18)*.9,0,TAU); g.fill(); g.restore();

 }
}
function drawBombs(g){
 for(let i=0;i<G.bombs.length;i++){
  const b=G.bombs[i], k=Math.max(0,Math.min(1,b.t/2));
  const bl=.4+Math.abs(Math.sin(G.time*(14-k*8)))*.6;
  g.save();
  g.globalAlpha=bl; g.fillStyle='#ff5c5c';
  if(!G.lowfx){ g.shadowColor='#ff5c5c'; g.shadowBlur=10; }
  g.beginPath(); g.arc(b.x,b.y-14,3.4,0,TAU); g.fill();
  g.globalAlpha=.55; g.strokeStyle='#ff5c5c'; g.lineWidth=1.6;
  g.beginPath(); g.arc(b.x,b.y-14,6.5,-Math.PI/2,-Math.PI/2+TAU*(1-k)); g.stroke();

}
function drawCrawlers(g){
 for(let i=0;i<G.crawlers.length;i++){
  const c=G.crawlers[i], sc=c.mini?.65:1;
  g.save(); g.translate(c.x,c.y); g.scale(sc,sc);
  g.strokeStyle='#ffa347'; g.lineWidth=1.6; g.lineCap='round';
  const w=Math.sin(G.time*16+i)*2.4;
  for(let s2=-1;s2<=1;s2+=2){
   g.beginPath();
   g.moveTo(s2*4,-3); g.lineTo(s2*9,-6+w);
   g.moveTo(s2*4,0); g.lineTo(s2*9.5,1);
   g.moveTo(s2*4,3); g.lineTo(s2*9,6-w);
   g.stroke();
  }
  g.lineCap='butt';
  g.fillStyle='rgba(30,16,6,.95)';
  if(!G.lowfx){ g.shadowColor='#ffa347'; g.shadowBlur=9; }

  g.strokeStyle='#ffa347'; g.lineWidth=1.8; g.stroke();
  g.fillStyle='#ffd9a0';
  g.globalAlpha=.5+Math.abs(Math.sin(G.time*8+i))*.5;
  g.beginPath(); g.arc(0,-2,2,0,TAU); g.fill();

 }
}
function drawVortex(g){
 for(let i=0;i<G.vortex.length;i++){
  const v=G.vortex[i], k=clamp(v.life/v.max,0,1);
  g.save(); g.translate(v.x,v.y);
  g.globalAlpha=.14+k*.2;
  const rg=g.createRadialGradient(0,0,2,0,0,v.r);
  rg.addColorStop(0,'rgba(20,8,50,.95)'); rg.addColorStop(.55,'rgba(110,91,255,.55)'); rg.addColorStop(1,'rgba(110,91,255,0)');
  g.fillStyle=rg; g.beginPath(); g.arc(0,0,v.r,0,TAU); g.fill();
  g.globalAlpha=.6*k; g.strokeStyle='#b6a6ff'; g.lineWidth=2; g.lineCap='round';
  for(let s2=0;s2<3;s2++){
   g.beginPath();
   for(let a=0;a<28;a++){
    const th=a/27*3.4+G.time*4+s2/3*TAU, rr=v.r*(1-a/27*.85);
    const px=Math.cos(th)*rr, py=Math.sin(th)*rr;
    if(a) g.lineTo(px,py); else g.moveTo(px,py);
   }
   g.stroke();
  }
  g.lineCap='butt';
  g.restore();
 }
}
function drawFx(g){
 for(let i=0;i<G.fx.length;i++){
  const f=G.fx[i], k=1-f.life/f.max;
  g.save();
  if(f.k==='ring'){
   g.globalAlpha=(1-k)*.85; g.strokeStyle=f.col; g.lineWidth=f.w;
   if(!G.lowfx){ g.shadowColor=f.col; g.shadowBlur=12; }
   g.beginPath(); g.arc(f.x,f.y,f.r*(.25+k*.78),0,TAU); g.stroke();
  } else if(f.k==='boom'){
   const r=f.r*(.35+k*.95); g.globalAlpha=1-k;
   const rg=g.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
   rg.addColorStop(0,'rgba(255,244,214,.95)'); rg.addColorStop(.45,f.col); rg.addColorStop(1,'rgba(255,90,0,0)');
   g.fillStyle=rg; g.beginPath(); g.arc(f.x,f.y,r,0,TAU); g.fill();
  } else if(f.k==='bolt'){
   g.globalAlpha=1-k; g.lineCap='round';
   if(!G.lowfx){ g.shadowColor=f.col; g.shadowBlur=15; }
   for(let pass=0;pass<2;pass++){
    g.strokeStyle=pass?'rgba(255,255,255,.92)':f.col;
    g.lineWidth=pass?1.2:2.8;
    g.beginPath();
    for(let j=0;j<f.pts.length-1;j++){
     const a=f.pts[j], b=f.pts[j+1];
     g.moveTo(a.x,a.y);
     for(let s=1;s<=3;s++){
      const tt=s/3, jx=s<3?rnd(-6,6):0, jy=s<3?rnd(-6,6):0;
      g.lineTo(lerp(a.x,b.x,tt)+jx, lerp(a.y,b.y,tt)+jy);
     }
    }
    g.stroke();
   }
  } else if(f.k==='beam'){
   g.globalAlpha=1-k; g.strokeStyle=f.col; g.lineWidth=Math.max(.5,f.w*(1-k*.65)); g.lineCap='round';
   if(!G.lowfx){ g.shadowColor=f.col; g.shadowBlur=15; }
   g.beginPath(); g.moveTo(f.x1,f.y1); g.lineTo(f.x2,f.y2); g.stroke();
  } else if(f.k==='cone'){
   g.globalAlpha=(1-k)*.5;
   const rg=g.createRadialGradient(f.x,f.y,4,f.x,f.y,f.r);
   rg.addColorStop(0,'rgba(255,240,190,.95)'); rg.addColorStop(.55,f.col); rg.addColorStop(1,'rgba(255,80,0,0)');
   g.fillStyle=rg;
   g.beginPath(); g.moveTo(f.x,f.y);
   g.arc(f.x,f.y,f.r*(.7+k*.35),f.ang-f.c,f.ang+f.c); g.closePath(); g.fill();
  }
  g.restore();
 }
}
function drawPools(g){
 for(let i=0;i<G.pools.length;i++){

function drawMines(g){
 for(let i=0;i<G.mines.length;i++){
  const m=G.mines[i], bl=.55+Math.abs(Math.sin(G.time*4+i))*.45;

function drawBeams(g){
 for(let i=0;i<G.towers.length;i++){
  const t=G.towers[i];
  if(t.id!=='beam'||!t.lock||!t.lock.alive) continue;
  const s=tstat(t), k=clamp(t.lockT/s.rup,0,1);
  g.save();
  g.lineCap='round';
  if(!G.lowfx){ g.shadowColor='#ff5f7a'; g.shadowBlur=18; }
  g.strokeStyle='rgba(255,95,122,'+(.45+k*.4)+')'; g.lineWidth=3+k*7;
  g.beginPath(); g.moveTo(t.x,t.y); g.lineTo(t.lock.x,t.lock.y); g.stroke();
  g.strokeStyle='rgba(255,255,255,'+(.7+k*.3)+')'; g.lineWidth=1+k*2.6;
  g.beginPath(); g.moveTo(t.x,t.y); g.lineTo(t.lock.x,t.lock.y); g.stroke();
  g.globalAlpha=.5+k*.5;
  g.fillStyle='#fff';
  g.beginPath(); g.arc(t.lock.x,t.lock.y,3+k*5,0,TAU); g.fill();
  g.restore();
 }
